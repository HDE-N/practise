<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>資料分析練習平台</title>

  <!-- 字型：非同步載入，連不上 Google Fonts 時會自動改用系統字型，不會卡住畫面 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" media="print" onload="this.media='all'">

  <!-- 外部元件（都鎖定版本；載入失敗時對應功能會停用，其餘照常運作） -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <!-- Excel 解析（SheetJS）只在上傳 .xlsx / .xls 時才下載；Firebase 只在有設定時才下載 -->

  <style>
/* ======================================================================
 * 設計變數
 * 靛藍夜色為底、金色為主色（呼應獎盃），積木用高彩度色塊區分功能
 * ==================================================================== */
:root {
  color-scheme: dark;
  --bg: #080716;
  --bg-2: #0e0c22;
  --ink: #0b0a1a;
  --panel: #15132f;
  --panel-2: #1c1940;
  --raise: #252156;
  --line: #2c2862;
  --line-soft: #221f4d;
  --text: #edeaff;
  --muted: #aaa5d6;
  --faint: #8580b6;
  --gold: #ffc83d;
  --gold-2: #ff9f1c;
  --cyan: #3fe3ff;
  --pink: #ff4fa3;
  --violet: #9b7bff;
  --ok: #3ee6a0;
  --bad: #ff5670;

  --b-src: #ffc83d;
  --b-rows: #46b6ff;
  --b-order: #a78bff;
  --b-cols: #2fd9bd;
  --b-calc: #86e04f;
  --b-text: #ffa64d;
  --b-stat: #ff7ab8;
  --b-multi: #ff7d6b;
  --b-clean: #e58cff;
  --b-misc: #cfcbea;

  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-display: "Chakra Petch", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, "Noto Sans TC", monospace;

  --side-w: 296px;
  --cut: 10px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.7;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
h1, h2, h3, p, ul, ol, dl, dd, pre { margin: 0; }
ul, ol { padding: 0; list-style: none; }
code, kbd, pre { font-family: var(--font-mono); }
::selection { background: rgba(255, 200, 61, .32); color: #fff; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.ico { width: 1.15em; height: 1.15em; flex: none; }

* { scrollbar-width: thin; scrollbar-color: #3a3580 transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #3a3580; border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: #5750b4; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 背景：蜂巢格會跟著游標發光（顏色像電競鍵盤的 RGB 波浪），點擊會擴散波紋 ---------- */
#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; background: var(--bg); }
.bg-glow {
  position: absolute; inset: 0;
  background:
    radial-gradient(900px 600px at 8% -10%, rgba(255, 200, 61, .11), transparent 60%),
    radial-gradient(1000px 700px at 105% 110%, rgba(255, 79, 163, .14), transparent 60%),
    radial-gradient(800px 600px at 62% -22%, rgba(63, 227, 255, .10), transparent 60%);
}
#bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.bg-beam { position: absolute; top: -30%; bottom: -30%; left: 0; width: 30vw; transform: translateX(-70vw) skewX(-24deg); will-change: transform; }
.bg-beam.b1 { background: linear-gradient(90deg, transparent, rgba(63, 227, 255, .075), transparent); animation: beam 17s linear infinite; }
.bg-beam.b2 { width: 18vw; background: linear-gradient(90deg, transparent, rgba(255, 79, 163, .07), transparent); animation: beam 23s linear infinite reverse; animation-delay: -9s; }
@keyframes beam { from { transform: translateX(-70vw) skewX(-24deg); } to { transform: translateX(170vw) skewX(-24deg); } }
.bg-scan {
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .018) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 40%, transparent 55%, rgba(3, 2, 10, .6) 100%);
}
html.fx-off .bg-beam, html.fx-off #bg-hex { display: none; }

/* ---------- 載入畫面 ---------- */
#loading { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; background: var(--bg); transition: opacity .5s ease, visibility .5s; }
#loading.out { opacity: 0; visibility: hidden; }
.load-box { display: grid; justify-items: center; gap: 16px; }
.load-mark { width: 56px; height: 56px; fill: var(--gold); }
.load-mark rect { transform-origin: 50% 100%; transform-box: fill-box; animation: bars 1.1s var(--ease) infinite alternate; }
.load-mark rect:nth-child(2) { animation-delay: .15s; }
.load-mark rect:nth-child(3) { animation-delay: .3s; }
@keyframes bars { from { transform: scaleY(.35); } to { transform: scaleY(1); } }
.load-text { font-family: var(--font-display); font-weight: 600; letter-spacing: .3em; color: var(--muted); padding-left: .3em; }
.load-bar { width: 180px; height: 3px; background: var(--line); overflow: hidden; }
.load-bar i { display: block; width: 40%; height: 100%; background: var(--gold); animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

/* ---------- 版面 ---------- */
#app { position: relative; z-index: 1; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100vh; height: 100dvh; animation: app-in .6s var(--ease) both; }
@keyframes app-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
#main { overflow-y: auto; overflow-x: hidden; min-width: 0; outline: none; }
#page { padding: 44px clamp(16px, 3.4vw, 52px) 110px; }
.topbar { display: none; }

/* ---------- 側欄 ---------- */
#sidebar { display: flex; flex-direction: column; min-height: 0; background: rgba(10, 9, 26, .78); border-right: 1px solid var(--line); backdrop-filter: blur(12px); }
.side-head { padding: 22px 20px 18px; border-bottom: 1px solid var(--line-soft); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-mark { width: 38px; height: 38px; fill: var(--gold); flex: none; }
.brand-text { display: grid; line-height: 1.15; font-family: var(--font-display); }
.brand-text strong { font-size: 21px; font-weight: 900; letter-spacing: .04em; }
.brand-text span { font-size: 13px; color: var(--muted); letter-spacing: .42em; }
#close-side { display: none; margin-left: auto; }
.overall { margin-top: 18px; }
.overall-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.overall-num { font-family: var(--font-display); }
.overall-num b { font-size: 22px; color: var(--gold); font-weight: 700; }
.overall-bar { height: 8px; margin-top: 8px; background: var(--line-soft); clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%); }
.overall-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-2), var(--gold)); transition: width .6s var(--ease); }

#nav { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 12px; display: grid; gap: 4px; align-content: start; }
.nav-empty { padding: 16px; color: var(--faint); }
.nav-item {
  display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  width: 100%; padding: 11px 12px 11px 10px; text-align: left;
  background: transparent; border: 0; border-left: 3px solid transparent; border-radius: 0 10px 10px 0;
  color: var(--muted); transition: background .2s, color .2s, border-color .2s;
}
.nav-item:hover { background: rgba(155, 123, 255, .10); color: var(--text); }
.nav-item.is-active { background: linear-gradient(90deg, rgba(255, 200, 61, .16), rgba(255, 200, 61, 0) 85%); border-left-color: var(--gold); color: var(--text); }
.nav-ico { display: grid; place-items: center; color: var(--faint); }
.nav-item.is-active .nav-ico { color: var(--gold); }
.nav-item.is-done .nav-ico { color: var(--ok); }
.nav-dot { width: 8px; height: 8px; border: 2px solid currentColor; transform: rotate(45deg); }
.nav-main { display: grid; gap: 6px; min-width: 0; }
.nav-title { font-weight: 500; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.nav-item.is-active .nav-title { font-weight: 700; }
.nav-bar { height: 3px; background: var(--line); }
.nav-bar i { display: block; height: 100%; background: var(--gold); transition: width .5s var(--ease); }
.nav-item.is-done .nav-bar i { background: var(--ok); }
.nav-count { font-family: var(--font-display); font-size: 13px; font-weight: 600; color: var(--faint); font-variant-numeric: tabular-nums; }
.nav-item.is-done .nav-count { color: var(--ok); }

.side-foot { padding: 14px 16px 16px; border-top: 1px solid var(--line-soft); display: grid; gap: 10px; }
.sync { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--faint); line-height: 1.4; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.sync.is-on i { background: var(--ok); box-shadow: 0 0 0 4px rgba(62, 230, 160, .18); }
.sync.is-warn i { background: var(--gold-2); }
.side-io { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* ---------- 按鈕 ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 40px; padding: 0 16px; border: 1px solid transparent; border-radius: 8px;
  font-weight: 700; font-size: 14.5px; line-height: 1; white-space: nowrap;
  transition: background .2s, border-color .2s, color .2s, filter .2s, transform .12s;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn-gold {
  background: linear-gradient(180deg, #ffd766, var(--gold) 55%, var(--gold-2)); color: var(--ink); border: 0; border-radius: 0; padding: 0 20px;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
}
.btn-gold:hover:not(:disabled) { filter: brightness(1.1) saturate(1.1); }
.btn-gold:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 4px #fff; }
.btn-gold:disabled { background: var(--raise); color: var(--faint); }
.btn-line { background: rgba(155, 123, 255, .08); border-color: var(--line); color: var(--text); }
.btn-line:hover:not(:disabled) { border-color: var(--violet); background: rgba(155, 123, 255, .18); }
.btn-quiet { background: transparent; border-color: var(--line); color: var(--muted); font-weight: 500; font-size: 13.5px; min-height: 36px; padding: 0 12px; }
.btn-quiet:hover { color: var(--text); border-color: var(--violet); }
.mini-btn {
  display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px;
  background: transparent; border: 1px solid transparent; border-radius: 6px; color: var(--muted); font-size: 13px; line-height: 1; white-space: nowrap;
  transition: background .2s, color .2s, border-color .2s;
}
.mini-btn:hover { color: var(--text); background: rgba(155, 123, 255, .14); }
.mini-btn.is-confirm { color: var(--bad); border-color: var(--bad); background: rgba(255, 86, 112, .12); font-weight: 700; }
.icon-btn { display: grid; place-items: center; width: 40px; height: 40px; background: transparent; border: 0; border-radius: 8px; color: var(--text); font-size: 20px; }
.icon-btn:hover { background: rgba(155, 123, 255, .16); }
.link-btn { background: none; border: 0; padding: 0; color: var(--cyan); text-decoration: underline; text-underline-offset: 3px; font-weight: 700; }

/* ---------- 單元標題 ---------- */
.unit-head { margin-bottom: 30px; }
.unit-kicker { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--gold); margin-bottom: 8px; }
.unit-title {
  font-family: var(--font-display); font-weight: 900; font-size: clamp(1.5rem, 1.05rem + 1.5vw, 2.3rem); line-height: 1.25;
  white-space: pre-line; overflow-wrap: anywhere; text-wrap: balance;
}
.unit-title::after { content: ""; display: block; width: 64px; height: 6px; margin-top: 16px; background: var(--gold); clip-path: polygon(0 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.unit-desc { margin-top: 16px; color: var(--muted); max-width: 68ch; }
.unit-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; margin-top: 22px; }
.unit-progress { color: var(--muted); font-size: 14.5px; }
.unit-progress b { font-family: var(--font-display); font-size: 20px; color: var(--gold); }
.seg { display: inline-flex; padding: 4px; gap: 4px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; }
.seg button { min-height: 36px; padding: 0 16px; background: transparent; border: 0; border-radius: 7px; color: var(--muted); font-weight: 500; font-size: 14.5px; transition: background .2s, color .2s; }
.seg button:hover { color: var(--text); }
.seg button.is-on { background: var(--gold); color: var(--ink); font-weight: 700; }

.empty-page { max-width: 62ch; padding: 40px 0; }
.empty-page h1 { font-family: var(--font-display); font-size: 1.8rem; margin-bottom: 12px; }
.empty-page p { color: var(--muted); margin-top: 8px; }
.empty-page code { color: var(--gold); }
.empty { color: var(--muted); padding: 28px 8px; text-align: center; }

/* ---------- 題目卡 ---------- */
.q-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
.q { display: grid; grid-template-columns: minmax(0, 1fr); }
.q-ask { padding: 26px 28px 26px 32px; min-width: 0; }
.q-answer { padding: 24px 28px 26px 32px; min-width: 0; border-top: 1px solid var(--line-soft); }
@media (min-width: 1280px) {
  .q { grid-template-columns: minmax(0, 1.08fr) minmax(0, .92fr); }
  .q-answer { border-top: 0; border-left: 1px solid var(--line-soft); padding-left: 28px; }
}
.q-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; min-height: 30px; }
.q-no {
  font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--ink); background: var(--muted); padding: 3px 12px 3px 10px;
  clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
}
.q.is-solved .q-no { background: var(--gold); }
.q-state { display: inline-flex; align-items: center; gap: 6px; color: var(--gold); font-weight: 700; font-size: 14px; }
.q-text { font-size: 1.0625rem; line-height: 1.85; white-space: pre-line; overflow-wrap: anywhere; max-width: 70ch; }
.q-example { margin-top: 20px; background: #090817; border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; }
.q-example-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 8px 6px 16px; background: rgba(155, 123, 255, .08); border-bottom: 1px solid var(--line-soft); font-size: 13px; color: var(--muted); }
.q-example pre { padding: 14px 16px; font-size: 14.5px; line-height: 1.75; color: #cfeee9; white-space: pre-wrap; overflow-wrap: anywhere; }
.q-label { display: block; font-weight: 700; margin-bottom: 10px; }
.q-input {
  display: block; width: 100%; min-height: 132px; padding: 14px 16px; resize: vertical;
  background: #090817; border: 1px solid var(--line); border-radius: 12px;
  font-family: var(--font-mono); font-size: 15.5px; line-height: 1.7; color: var(--text);
  transition: border-color .2s, box-shadow .2s;
}
.q-input::placeholder { color: #605b8f; }
.q-input:hover { border-color: #3d388a; }
.q-input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 4px rgba(63, 227, 255, .14); }
.q-feedback { min-height: 1.5em; margin-top: 8px; font-size: 14px; font-weight: 500; }
.q-feedback.is-ok { color: var(--ok); }
.q-feedback.is-bad { color: #ff8fa1; }
.q-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 6px; }
.q-hint { margin-right: auto; font-size: 13px; color: var(--faint); }
kbd { display: inline-block; padding: 1px 7px; background: var(--raise); border: 1px solid #3d388a; border-bottom-width: 2px; border-radius: 5px; font-size: .82em; color: var(--text); }
.q-empty { padding: 44px 16px; text-align: center; color: var(--muted); font-weight: 700; border: 1px dashed var(--line); border-radius: 18px; }

.q.shake { animation: shake .45s ease-in-out; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

.q-history { margin-top: 20px; padding-top: 14px; border-top: 1px dashed var(--line); }
.h-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.h-toggle { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 6px; margin-left: -6px; border-radius: 6px; color: var(--muted); font-weight: 700; font-size: 14px; }
.h-toggle:hover { color: var(--text); }
.h-toggle .ico:last-child { transition: transform .25s; }
.h-toggle[aria-expanded="false"] .ico:last-child { transform: rotate(-90deg); }
.h-count { font-family: var(--font-display); color: var(--gold); padding: 0 8px; background: rgba(255, 200, 61, .12); border-radius: 999px; }
.h-list { display: grid; gap: 8px; margin-top: 12px; max-height: 340px; overflow-y: auto; padding-right: 4px; }
.h-item { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border: 1px solid var(--line-soft); border-left-width: 3px; border-radius: 8px; background: rgba(11, 10, 26, .5); }
.h-item.is-ok { border-left-color: var(--ok); }
.h-item.is-bad { border-left-color: var(--bad); }
.h-item.is-new { animation: slide-in .4s var(--ease); }
@keyframes slide-in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
.h-mark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; margin-top: 1px; }
.is-ok > .h-mark { color: var(--ink); background: var(--ok); }
.is-bad > .h-mark { color: #fff; background: var(--bad); }
.h-meta { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
.is-ok .h-meta b { color: var(--ok); }
.is-bad .h-meta b { color: #ff8fa1; }
.h-meta time { color: var(--faint); font-family: var(--font-mono); font-size: 12px; }
.h-body pre { margin-top: 4px; font-size: 13.5px; line-height: 1.6; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- 前言 ---------- */
.doc { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; margin-bottom: 26px; }
.doc-sec { padding: 28px 30px 30px; }
.doc-sec > * + * { margin-top: 16px; }
.doc-sec h2 { display: flex; align-items: center; gap: 14px; font-family: var(--font-display); font-size: 1.35rem; font-weight: 900; line-height: 1.3; }
.doc-n { display: grid; place-items: center; width: 34px; height: 34px; flex: none; background: var(--gold); color: var(--ink); font-size: 18px; font-weight: 700; clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px); }
.doc-sec p, .doc-sec li { max-width: 74ch; color: #d9d5f5; }
.doc-sec strong { color: #fff; }
.doc-sec ul { display: grid; gap: 8px; padding-left: 1.3em; list-style: square; }
.doc-sec ul li::marker { color: var(--gold); }
.doc-sec code { padding: 1px 7px; background: rgba(63, 227, 255, .12); color: var(--cyan); border-radius: 5px; font-size: .92em; }
.doc-sec u { text-decoration-color: var(--gold); text-decoration-thickness: 2px; text-underline-offset: 4px; color: #fff; }
.steps { display: grid; gap: 10px; padding: 18px 20px 18px 46px; list-style: decimal; background: #090817; border: 1px solid var(--line-soft); border-radius: 12px; }
.steps li::marker { font-family: var(--font-display); font-weight: 700; color: var(--gold); }
.term { position: relative; padding: 14px 96px 14px 18px; background: #090817; border: 1px solid var(--line-soft); border-radius: 12px; font-family: var(--font-mono); font-size: 14.5px; color: #9ff0c9; overflow-x: auto; }
.term > div { white-space: nowrap; }
.term .pr { color: #605b8f; margin-right: 12px; user-select: none; }
.term-copy { position: absolute; top: 8px; right: 8px; }
.callout { padding: 20px 22px; background: rgba(63, 227, 255, .07); border: 1px solid rgba(63, 227, 255, .28); border-left-width: 4px; border-radius: 12px; }
.callout.is-warn { background: rgba(255, 200, 61, .07); border-color: rgba(255, 200, 61, .34); }
.callout > * + * { margin-top: 12px; }
.callout h3 { font-size: 1.05rem; color: var(--cyan); }
.callout.is-warn h3 { color: var(--gold); }
.callout-foot { padding-top: 12px; border-top: 1px solid rgba(255, 255, 255, .1); color: var(--muted) !important; font-size: 14.5px; }
.defs { list-style: none !important; padding-left: 0 !important; }
.defs li { padding-left: 16px; border-left: 2px solid var(--line); }
.defs strong { color: var(--gold); }
.feat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.feat { padding: 16px 18px; background: #090817; border: 1px solid var(--line-soft); border-top: 3px solid var(--c); border-radius: 0 0 12px 12px; }
.feat h3 { font-size: 1rem; color: var(--c); margin-bottom: 6px; }
.feat p { font-size: 14.5px; line-height: 1.7; color: var(--muted); }

/* ---------- 面板 ---------- */
.panel { min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 18px; border-bottom: 1px solid var(--line-soft); }
.panel-head h2 { font-family: var(--font-display); font-size: 1.1rem; font-weight: 900; }
.panel-hint { flex: 1 1 240px; font-size: 13px; color: var(--faint); line-height: 1.5; }
.panel-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
.lab { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
#lab-work { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.lab-dropmask { position: absolute; inset: -8px; z-index: 20; display: grid; place-items: center; background: rgba(11, 10, 26, .82); border: 2px dashed var(--gold); border-radius: 18px; pointer-events: none; }
.lab-dropmask div { display: grid; justify-items: center; gap: 10px; color: var(--gold); font-size: 1.3rem; }
.lab-dropmask .ico { width: 44px; height: 44px; }

/* 資料來源 */
.ds-list { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 18px 16px; }
.ds { display: flex; align-items: stretch; max-width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.ds.is-src { border-color: var(--gold); }
.ds-main { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 10px 8px 12px; background: none; border: 0; text-align: left; color: var(--muted); }
button.ds-main:hover { background: rgba(155, 123, 255, .12); }
.ds.is-src .ds-main > .ico { color: var(--gold); }
.ds-name { font-weight: 700; font-size: 14px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34ch; }
.ds-meta { font-family: var(--font-mono); font-size: 12px; color: var(--faint); white-space: nowrap; }
.ds-tag { font-size: 12px; font-weight: 700; color: var(--ink); background: var(--gold); padding: 1px 8px; line-height: 1.5; clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%); }
.ds-x { display: grid; place-items: center; width: 34px; background: none; border: 0; border-left: 1px solid var(--line-soft); color: var(--faint); }
.ds-x:hover { background: rgba(255, 86, 112, .16); color: var(--bad); }
.spin { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; flex: none; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.drop-hint { display: grid; justify-items: center; gap: 8px; margin: 18px; padding: 36px 20px; text-align: center; border: 2px dashed var(--line); border-radius: 14px; color: var(--muted); }
.drop-hint > .ico { width: 40px; height: 40px; color: var(--gold); }
.drop-hint b { color: var(--text); }
.drop-sub { font-size: 13.5px; color: var(--faint); max-width: 62ch; }

/* ---------- 積木編輯器 ---------- */
.editor-body { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 300px; }
.lab-editor.is-closed .editor-body { display: none; }
.lab-editor.is-closed .panel-head { border-bottom: 0; }
.lab-editor.is-closed [data-act="toggle-editor"] .ico { transform: rotate(180deg); }
.palette { position: relative; padding: 14px 14px 16px; border-right: 1px solid var(--line-soft); background: rgba(11, 10, 26, .35); border-radius: 0 0 0 16px; user-select: none; -webkit-user-select: none; }
.pal-group + .pal-group { margin-top: 12px; }
.pal-group h3 { font-size: 12.5px; font-weight: 500; color: var(--faint); margin-bottom: 6px; }
.pal-items { display: flex; flex-wrap: wrap; gap: 6px; }
.pal-item {
  min-height: 32px; padding: 0 12px 0 10px; border: 0; background: var(--c); color: var(--ink); font-weight: 700; font-size: 13.5px; line-height: 1;
  clip-path: polygon(0 0, 8px 0, 11px 3px, 19px 3px, 22px 0, 100% 0, 100% 100%, 0 100%);
  touch-action: pan-y; cursor: grab; transition: filter .15s, transform .15s;
}
.pal-item:hover { filter: brightness(1.14); transform: translateY(-1px); }
.pal-item:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 4px #fff; }
.pal-hint { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 12.5px; line-height: 1.6; color: var(--muted); min-height: 4.4em; }
.pal-hint b { color: var(--text); }
.pal-trash { position: absolute; inset: 0; display: none; place-items: center; align-content: center; gap: 8px; background: rgba(60, 8, 24, .92); border: 2px dashed var(--bad); border-radius: 0 0 0 16px; color: #ffc2cc; font-weight: 700; font-size: 14px; text-align: center; }
.pal-trash .ico { width: 34px; height: 34px; }
.palette.can-trash .pal-trash { display: grid; opacity: .55; }
.palette.is-trash .pal-trash { opacity: 1; }

.cat-src { --c: var(--b-src); }
.cat-rows { --c: var(--b-rows); }
.cat-order { --c: var(--b-order); }
.cat-cols { --c: var(--b-cols); }
.cat-calc { --c: var(--b-calc); }
.cat-text { --c: var(--b-text); }
.cat-stat { --c: var(--b-stat); }
.cat-multi { --c: var(--b-multi); }

.prog { padding: 18px 18px 20px; min-width: 0; }
.prog-stack { display: grid; grid-template-columns: minmax(0, 1fr); position: relative; }
.prog-stack.ran .blk-hat { animation: ran .5s var(--ease); }
@keyframes ran { 0% { filter: brightness(1.6); } 100% { filter: none; } }
.prog-tail { margin-top: 12px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 8px; font-size: 13px; color: var(--faint); }
.prog-empty { margin-top: 14px; padding: 18px 20px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 14.5px; }
.prog-empty b { color: var(--text); }
.prog-empty ol { margin-top: 8px; padding-left: 1.4em; list-style: decimal; display: grid; gap: 2px; }
.prog-empty ol li::marker { color: var(--gold); font-family: var(--font-display); font-weight: 700; }

/* 積木本體：上緣有凹口、下緣有凸榫，疊起來會卡在一起 */
.blk {
  --n: 6px;
  position: relative; margin-top: calc(2px - var(--n)); padding: calc(var(--n) + 9px) 10px calc(var(--n) + 7px) 6px;
  background: var(--c);
  background: linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 86%, #000));
  color: var(--ink);
  clip-path: polygon(0 0, 18px 0, 24px var(--n), 44px var(--n), 50px 0, 100% 0, 100% calc(100% - var(--n)), 50px calc(100% - var(--n)), 44px 100%, 24px 100%, 18px calc(100% - var(--n)), 0 calc(100% - var(--n)));
  transition: filter .2s, opacity .2s;
}
.blk-hat { margin-top: 0; padding-top: 12px; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - var(--n)), 50px calc(100% - var(--n)), 44px 100%, 24px 100%, 18px calc(100% - var(--n)), 0 calc(100% - var(--n)), 0 14px); }
.blk-hat .blk-in { padding-left: 8px; }
.blk-in { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 6px; }
.blk-hat .blk-in { grid-template-columns: minmax(0, 1fr); }
.blk-grip { display: grid; place-items: center; width: 26px; height: 32px; background: none; border: 0; border-radius: 6px; color: rgba(11, 10, 26, .6); cursor: grab; touch-action: none; font-size: 18px; }
.blk-grip:hover { background: rgba(11, 10, 26, .16); color: var(--ink); }
.blk-body { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; min-height: 32px; }
.blk-title { padding: 4px 11px; background: var(--ink); color: var(--c); font-weight: 900; font-size: 13px; line-height: 1.4; border-radius: 999px; white-space: nowrap; }
.blk .w { font-weight: 700; font-size: 14px; }
.blk .w em { font-style: normal; font-weight: 500; opacity: .72; }
.blk-rows { flex-basis: 100%; display: grid; gap: 6px; }
.blk-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-left: 10px; border-left: 3px solid rgba(11, 10, 26, .28); }
.blk-note { flex-basis: 100%; font-size: 12.5px; line-height: 1.5; color: rgba(11, 10, 26, .78); font-weight: 500; }
.blk-add { min-height: 28px; padding: 0 10px; background: rgba(11, 10, 26, .16); border: 1px dashed rgba(11, 10, 26, .5); border-radius: 6px; color: var(--ink); font-weight: 700; font-size: 12.5px; }
.blk-add:hover { background: rgba(11, 10, 26, .3); }
.blk-del { display: grid; place-items: center; width: 24px; height: 24px; background: rgba(11, 10, 26, .16); border: 0; border-radius: 50%; color: var(--ink); font-size: 15px; line-height: 1; }
.blk-del:hover { background: var(--ink); color: #fff; }
.blk-tools { display: flex; gap: 3px; }
.blk-tools button { display: grid; place-items: center; width: 28px; height: 28px; background: rgba(11, 10, 26, .14); border: 0; border-radius: 6px; color: var(--ink); font-size: 14px; }
.blk-tools button:hover:not(:disabled) { background: var(--ink); color: var(--c); }
.blk-tools button:disabled { opacity: .3; }
.blk-tools button[aria-pressed="true"] { background: var(--ink); color: var(--c); }
.blk :focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; box-shadow: 0 0 0 4px rgba(255, 255, 255, .7); }
.blk-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 6px 0 0 32px; min-height: 18px; font-size: 12px; line-height: 1.4; }
.blk-hat .blk-foot { margin-left: 8px; }
.blk-count { margin-left: auto; font-family: var(--font-mono); font-weight: 700; color: rgba(11, 10, 26, .78); }
.blk-msg { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; color: rgba(11, 10, 26, .8); }
.blk-msg.is-err { padding: 3px 9px; background: #4a0a1b; color: #ffd0d8; border-radius: 6px; }
.blk-msg.is-warn, .blk-msg.is-peek { padding: 3px 9px; background: rgba(11, 10, 26, .82); color: var(--c); border-radius: 6px; }
.blk.is-off { filter: saturate(.15) brightness(.72); }
.blk.is-skip { opacity: .5; }
.blk.is-err { background: linear-gradient(90deg, var(--bad) 0 6px, transparent 6px), linear-gradient(180deg, var(--c), color-mix(in srgb, var(--c) 86%, #000)); }
.blk.is-new { animation: blk-pop .38s var(--ease); }
@keyframes blk-pop { 0% { transform: scale(.94) translateY(-8px); opacity: 0; } 60% { transform: scale(1.012); } 100% { transform: none; opacity: 1; } }
.blk.is-dragging { opacity: .28; }
.blk-slot { height: 10px; margin: 5px 0 3px; background: #fff; box-shadow: 0 0 0 2px var(--bg), 0 0 22px 4px rgba(255, 255, 255, .7); border-radius: 5px; position: relative; z-index: 2; }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 400; margin: 0 !important; pointer-events: none; opacity: .92; transform-origin: 0 0; will-change: transform; }
body.is-dnd, body.is-dnd * { cursor: grabbing !important; user-select: none !important; -webkit-user-select: none !important; }

/* 積木裡的欄位 */
.f {
  height: 32px; max-width: 100%; padding: 0 9px; background: rgba(11, 10, 26, .9); border: 1px solid rgba(255, 255, 255, .16); border-radius: 7px;
  color: var(--text); font-size: 14px; line-height: 1;
}
select.f { padding-right: 4px; max-width: 26ch; text-overflow: ellipsis; cursor: pointer; }
.f-txt { width: calc(var(--w, 12ch) + 20px); }
.f-num { width: calc(var(--w, 6ch) + 24px); font-family: var(--font-mono); }
.f-code { font-family: var(--font-mono); font-size: 13.5px; flex: 1 1 260px; }
.f::placeholder { color: #7e79ad; }
.f-col { font-weight: 700; color: #fff; }
.f.is-miss { border-color: var(--bad); color: #ffb3c0; }
.f-mini { color: var(--muted); font-size: 13px; }
.f-op { font-weight: 900; font-size: 16px; }
.f-add { color: var(--muted); border-style: dashed; font-size: 13px; }
.f-chk { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.f-chk input { width: 17px; height: 17px; accent-color: var(--ink); cursor: pointer; }
.f-multi { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 32px; padding: 0 4px 0 11px; background: rgba(11, 10, 26, .9); border: 1px solid rgba(255, 255, 255, .16); border-radius: 999px; color: #fff; font-weight: 700; font-size: 13.5px; max-width: 30ch; white-space: nowrap; overflow: hidden; }
.chip.is-miss { border-color: var(--bad); color: #ffb3c0; }
.chip button { display: grid; place-items: center; width: 22px; height: 22px; flex: none; background: transparent; border: 0; border-radius: 50%; color: var(--muted); font-size: 16px; line-height: 1; }
.chip button:hover { background: var(--bad); color: #fff; }

/* ---------- 結果區 ---------- */
.res-head { gap: 10px 18px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { display: inline-flex; align-items: center; gap: 7px; min-height: 38px; padding: 0 14px; background: transparent; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font-weight: 700; font-size: 14.5px; transition: color .2s, border-color .2s, background .2s; }
.tab:hover { color: var(--text); background: rgba(155, 123, 255, .1); }
.tab.is-on { color: var(--gold); border-bottom-color: var(--gold); }
.res-size { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.res-size b { font-family: var(--font-display); font-size: 17px; color: var(--text); }
.res-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 18px 0; padding: 9px 14px; background: rgba(255, 200, 61, .1); border: 1px solid rgba(255, 200, 61, .4); border-radius: 8px; color: var(--gold); font-size: 14px; font-weight: 500; }
.res-banner.is-err { background: rgba(255, 86, 112, .1); border-color: rgba(255, 86, 112, .45); color: #ff9aab; }
.res-body { padding: 14px 18px 18px; min-width: 0; }

.grid-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 10px; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; flex: 0 1 300px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; color: var(--faint); }
.search:focus-within { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(63, 227, 255, .14); }
.search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: none; font-size: 14.5px; color: var(--text); }
.grid-hit { font-size: 13px; color: var(--gold); }
.grid-wrap { max-height: min(68vh, 760px); overflow: auto; background: #090817; border: 1px solid var(--line); border-radius: 10px; outline-offset: -2px; }
.grid { border-collapse: separate; border-spacing: 0; font-size: 13.5px; line-height: 1.45; font-variant-numeric: tabular-nums; user-select: none; -webkit-user-select: none; }
.grid th, .grid td { border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); white-space: nowrap; text-align: left; }
.grid td { padding: 6px 12px; max-width: 34ch; overflow: hidden; text-overflow: ellipsis; color: #dcd8f6; cursor: cell; }
.grid td.is-num { text-align: right; font-family: var(--font-mono); font-size: 13px; }
.grid thead th { position: sticky; top: 0; z-index: 2; padding: 0; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.g-h { display: flex; align-items: center; gap: 7px; width: 100%; max-width: 34ch; padding: 8px 8px 8px 12px; background: none; border: 0; color: var(--text); font-weight: 700; font-size: 13.5px; text-align: left; }
th.is-num .g-h { flex-direction: row; }
.g-h:hover { background: rgba(155, 123, 255, .18); }
.g-h i { font-style: normal; font-family: var(--font-display); font-size: 11px; font-weight: 600; color: var(--ink); background: var(--faint); padding: 0 5px; border-radius: 3px; line-height: 1.5; }
.g-h span { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.g-h .ico { color: var(--faint); font-size: 12px; }
.grid .g-corner, .grid .g-r { position: sticky; left: 0; z-index: 1; padding: 6px 10px; background: var(--panel); color: var(--faint); font-family: var(--font-mono); font-size: 12px; font-weight: 400; text-align: right; cursor: pointer; }
.grid .g-corner { z-index: 3; top: 0; background: var(--panel-2); cursor: default; padding: 8px 10px; }
.grid tbody tr:hover td { background: rgba(155, 123, 255, .07); }
.grid td.is-sel { background: rgba(255, 200, 61, .16) !important; color: #fff; }
.grid td.is-cur { box-shadow: inset 0 0 0 2px var(--gold); }
.g-none { padding: 28px 16px !important; color: var(--faint) !important; text-align: center !important; cursor: default !important; }
.grid-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-top: 10px; }
.sel-info { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; min-height: 32px; min-width: 0; font-size: 13px; color: var(--muted); }
.sel-tip { color: var(--faint); }
.sel-stat b { font-family: var(--font-mono); color: var(--gold); font-weight: 700; margin-left: 2px; }
.sel-cell { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.sel-cell i { font-style: normal; font-family: var(--font-display); font-weight: 700; color: var(--ink); background: var(--gold); padding: 0 7px; border-radius: 4px; }
.sel-val { font-family: var(--font-mono); color: var(--text); max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sel-info .mini-btn { border-color: var(--line); }
.pager { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-left: auto; }
.pager-range { margin-right: 6px; }
.pg { display: grid; place-items: center; width: 32px; height: 32px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 7px; color: var(--text); }
.pg:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
.pg:disabled { opacity: .35; }
.pager input, .pager select { height: 32px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 7px; padding: 0 6px; font-family: var(--font-mono); font-size: 13px; }
.pager input { width: 62px; text-align: center; }
.pager-size { margin-left: 8px; }

/* 圖表 */
.chart-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; margin-bottom: 14px; }
.chart-bar label { display: grid; gap: 4px; font-size: 12.5px; color: var(--faint); }
.chart-bar select { height: 38px; max-width: 24ch; padding: 0 8px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; color: var(--text); }
.chart-bar select:disabled { opacity: .4; }
.chart-bar .btn { margin-left: auto; }
.chart-box { position: relative; height: min(62vh, 520px); background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.chart-note { margin-top: 8px; font-size: 13px; color: var(--faint); min-height: 1.4em; }

/* 欄位摘要 */
.sum-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.sum { padding: 14px 16px 16px; background: var(--bg-2); border: 1px solid var(--line-soft); border-radius: 12px; min-width: 0; }
.sum.is-focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255, 200, 61, .2); }
.sum h3 { display: flex; align-items: center; gap: 8px; font-size: 15px; line-height: 1.4; }
.sum h3 i { font-style: normal; font-family: var(--font-display); font-size: 11px; color: var(--ink); background: var(--faint); padding: 0 5px; border-radius: 3px; flex: none; }
.sum h3 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sum-tags { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12.5px; color: var(--faint); }
.sum-tags b { color: var(--text); font-family: var(--font-mono); }
.tag { padding: 0 8px; border-radius: 999px; background: rgba(255, 166, 77, .16); color: var(--b-text); font-weight: 700; }
.tag.is-num { background: rgba(63, 227, 255, .14); color: var(--cyan); }
.sum-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 12px; }
.sum-stats div { display: flex; justify-content: space-between; gap: 8px; padding-bottom: 4px; border-bottom: 1px dashed var(--line); font-size: 13px; }
.sum-stats dt { color: var(--faint); }
.sum-stats dd { font-family: var(--font-mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; }
.sum-top { display: grid; gap: 5px; margin-top: 12px; }
.sum-top li { display: grid; grid-template-columns: minmax(0, 1fr) 70px auto; align-items: center; gap: 8px; font-size: 13px; }
.sum-k { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #dcd8f6; }
.sum-bar { height: 6px; background: var(--line-soft); }
.sum-bar i { display: block; height: 100%; background: var(--violet); }
.sum-n { font-family: var(--font-mono); font-size: 12px; color: var(--muted); min-width: 3ch; text-align: right; }

/* 程式碼 */
.code-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
.code-bar p { flex: 1 1 320px; font-size: 13.5px; color: var(--muted); line-height: 1.6; max-width: 72ch; }
.code { padding: 18px 20px; background: #090817; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; line-height: 1.75; overflow-x: auto; color: #dcd8f6; tab-size: 4; }
.code .c { color: #7f7ab0; }
.code .s { color: #9ff0c9; }

/* ---------- 浮動元件 ---------- */
#pop { position: fixed; z-index: 250; min-width: 220px; max-width: min(92vw, 440px); background: var(--panel-2); border: 1px solid #3d388a; border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, .6); overflow: hidden; }
.menu { display: grid; padding: 6px; }
.menu-h { padding: 8px 10px 6px; font-size: 12.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-f { padding: 8px 10px 4px; margin-top: 4px; border-top: 1px solid var(--line); font-size: 12px; color: var(--faint); }
.menu button { display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; background: none; border: 0; border-radius: 7px; color: var(--text); font-size: 14.5px; text-align: left; }
.menu button:hover, .menu button:focus-visible { background: rgba(255, 200, 61, .16); outline: none; }
.menu button .ico { color: var(--faint); }
.menu button span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu button em { font-style: normal; font-size: 12px; color: var(--ok); }
.menu-q { height: 36px; margin: 2px 4px 6px; padding: 0 10px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 7px; font-size: 14px; }
.menu-list { display: grid; max-height: min(56vh, 420px); overflow-y: auto; }

#toasts { position: fixed; left: 50%; bottom: 22px; z-index: 500; transform: translateX(-50%); display: grid; gap: 8px; justify-items: center; width: min(92vw, 560px); pointer-events: none; }
.toast { display: flex; align-items: center; gap: 10px; max-width: 100%; padding: 11px 16px; background: var(--raise); border: 1px solid #3d388a; border-left: 4px solid var(--cyan); border-radius: 8px; box-shadow: 0 14px 40px rgba(0, 0, 0, .5); font-size: 14.5px; line-height: 1.5; opacity: 0; transform: translateY(14px); transition: opacity .3s, transform .3s var(--ease); }
.toast.in { opacity: 1; transform: none; }
.toast .ico { color: var(--cyan); }
.toast.is-success { border-left-color: var(--ok); }
.toast.is-success .ico { color: var(--ok); }
.toast.is-error { border-left-color: var(--bad); }
.toast.is-error .ico { color: var(--bad); }

#celebrate { position: fixed; top: 24px; left: 50%; z-index: 480; transform: translate(-50%, -140%); opacity: 0; transition: transform .6s var(--ease), opacity .4s; pointer-events: none; }
#celebrate.in { transform: translate(-50%, 0); opacity: 1; }
.celebrate-card { display: flex; align-items: center; gap: 16px; padding: 16px 26px 16px 20px; background: linear-gradient(180deg, #ffd766, var(--gold) 60%, var(--gold-2)); color: var(--ink); clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); }
.celebrate-card svg { width: 46px; height: 46px; fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.celebrate-card strong { display: block; font-family: var(--font-display); font-size: 1.2rem; font-weight: 900; line-height: 1.3; }
.celebrate-card span { font-size: 14px; font-weight: 500; }

#to-top { position: fixed; right: 22px; bottom: 22px; z-index: 90; display: grid; place-items: center; width: 46px; height: 46px; background: var(--raise); border: 1px solid #3d388a; border-radius: 10px; color: var(--gold); font-size: 20px; opacity: 0; visibility: hidden; transform: translateY(10px); transition: opacity .3s, transform .3s, visibility .3s; }
#to-top.in { opacity: 1; visibility: visible; transform: none; }
#to-top:hover { background: var(--gold); color: var(--ink); }
#scrim { position: fixed; inset: 0; z-index: 110; background: rgba(5, 4, 14, .7); backdrop-filter: blur(3px); }

/* ======================================================================
 * 電競風格：切角面板、斜體標題、RGB 光條、十字游標、對話框與腳本庫
 * ==================================================================== */

/* 切角外框：用兩層假元素畫出邊線與底色，本體不裁切，所以發光效果可以沿著切角走 */
.panel, .q, .doc-sec, .modal-box { --cut: 18px; --edge: var(--line); position: relative; isolation: isolate; min-width: 0; }
.panel::before, .q::before, .doc-sec::before, .modal-box::before,
.panel::after, .q::after, .doc-sec::after, .modal-box::after {
  content: ""; position: absolute; z-index: -1; pointer-events: none;
  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
}
.panel::before, .q::before, .doc-sec::before, .modal-box::before { inset: 0; background: var(--edge); transition: background .25s; }
.panel::after, .q::after, .doc-sec::after, .modal-box::after { inset: 1px; background: linear-gradient(180deg, rgba(27, 24, 62, .92), rgba(17, 15, 40, .92)); }
.q { --rail: var(--line); }
.q::after { background: linear-gradient(90deg, var(--rail) 0 4px, transparent 4px), linear-gradient(180deg, rgba(27, 24, 62, .92), rgba(17, 15, 40, .92)); }
.q:hover { --edge: #4c46ab; }
.q.is-solved { --edge: rgba(255, 200, 61, .55); --rail: var(--gold); }
.q.shake { --edge: var(--bad); --rail: var(--bad); }
.q.flash-ok { animation: flash-ok 1.1s var(--ease); }
@keyframes flash-ok {
  0% { filter: brightness(1.6) drop-shadow(0 0 0 rgba(62, 230, 160, 0)); }
  30% { filter: brightness(1.12) drop-shadow(0 0 26px rgba(62, 230, 160, .85)); }
  100% { filter: brightness(1) drop-shadow(0 0 0 rgba(62, 230, 160, 0)); }
}
.palette { border-radius: 0; clip-path: polygon(0 0, 100% 0, 100% 100%, 18px 100%, 0 calc(100% - 18px)); }
.pal-trash { border-radius: 0; }

/* 頂端的 RGB 光條 */
#app::before {
  content: ""; position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 130; pointer-events: none;
  background: linear-gradient(90deg, var(--gold), var(--pink), var(--violet), var(--cyan), var(--gold)); background-size: 200% 100%;
  animation: rgb-slide 7s linear infinite;
}
@keyframes rgb-slide { to { background-position: -200% 0; } }

/* 斜體標題與故障感進場 */
.unit-title, .panel-head h2, .doc-sec h2, .modal-head h2, .brand-text strong, .q-no, .load-text, .celebrate-card strong, .tab, .empty-page h1 { font-style: italic; }
.unit-title { text-shadow: 0 0 26px rgba(255, 200, 61, .22); animation: glitch-in .6s steps(1, end) both; }
.unit-title::after {
  width: 120px; height: 6px;
  background: linear-gradient(90deg, var(--gold), var(--pink), var(--cyan)); background-size: 200% 100%;
  clip-path: polygon(0 0, 100% 0, calc(100% - 7px) 100%, 0 100%); animation: rgb-slide 5s linear infinite;
}
@keyframes glitch-in {
  0% { opacity: 0; transform: translateX(-16px) skewX(-16deg); text-shadow: -7px 0 var(--cyan), 7px 0 var(--pink); clip-path: inset(0 0 62% 0); }
  18% { opacity: 1; transform: translateX(8px) skewX(8deg); clip-path: inset(42% 0 18% 0); }
  36% { transform: translateX(-5px); text-shadow: 5px 0 var(--cyan), -5px 0 var(--pink); clip-path: inset(8% 0 54% 0); }
  54% { transform: translateX(3px); clip-path: inset(0 0 0 0); }
  72% { transform: none; text-shadow: -2px 0 var(--cyan), 2px 0 var(--pink); }
  100% { opacity: 1; transform: none; text-shadow: 0 0 26px rgba(255, 200, 61, .22); clip-path: inset(0 0 0 0); }
}
.unit-kicker { display: inline-block; padding: 2px 14px 2px 10px; background: var(--gold); color: var(--ink); font-style: italic; clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.panel-head { background: linear-gradient(90deg, rgba(255, 200, 61, .09), transparent 46%); }
.panel-head h2::before, .modal-head h2::before { content: ""; display: inline-block; width: 7px; height: .95em; margin-right: 10px; vertical-align: -.1em; background: var(--gold); transform: skewX(-18deg); box-shadow: 10px 0 0 -2px rgba(255, 200, 61, .45); }
.panel-head h2, .modal-head h2 { padding-right: 8px; }
.brand-mark { filter: drop-shadow(0 0 8px rgba(255, 200, 61, .55)); }
.nav-item.is-active { clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); background: linear-gradient(90deg, rgba(255, 200, 61, .22), rgba(255, 79, 163, .06) 70%, transparent); box-shadow: inset 3px 0 0 var(--gold); }
.tab.is-on { background: linear-gradient(180deg, transparent, rgba(255, 200, 61, .12)); text-shadow: 0 0 14px rgba(255, 200, 61, .5); }
.seg { border: 0; border-radius: 0; clip-path: polygon(8px 0, 100% 0, calc(100% - 8px) 100%, 0 100%); padding: 4px 12px; background: rgba(28, 25, 64, .9); }
.seg button { border-radius: 0; transform: skewX(-12deg); }
.seg button.is-on { box-shadow: 0 0 18px rgba(255, 200, 61, .45); }
.q-input:focus, .search:focus-within { box-shadow: 0 0 0 3px rgba(63, 227, 255, .16), 0 0 22px rgba(63, 227, 255, .22); }

/* 主要按鈕：滑過時掃過一道光 */
.btn-gold { position: relative; overflow: hidden; font-style: italic; letter-spacing: .02em; }
.btn-gold::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .65), transparent); transform: skewX(-22deg); pointer-events: none; }
.btn-gold:hover:not(:disabled)::after { animation: sheen .6s ease-out; }
@keyframes sheen { to { left: 130%; } }
.btn-line:hover:not(:disabled) { box-shadow: 0 0 16px rgba(155, 123, 255, .35); }

/* 段位 */
.overall-l { display: inline-flex; align-items: center; gap: 8px; }
.rank { padding: 1px 12px 1px 9px; font-family: var(--font-display); font-style: italic; font-weight: 700; font-size: 12.5px; line-height: 1.6; color: var(--ink); background: var(--faint); clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%); }
.rank.r-none { background: var(--line); color: var(--muted); }
.rank.r-bronze { background: #d08a55; }
.rank.r-silver { background: #cfd6e6; }
.rank.r-gold { background: var(--gold); }
.rank.r-diamond { background: var(--cyan); }
.rank.r-legend { background: linear-gradient(90deg, var(--gold), var(--pink), var(--cyan)); }
.fx-btn { width: 100%; }
.fx-btn[aria-pressed="true"] { color: var(--gold); border-color: rgba(255, 200, 61, .45); }

/* 十字游標 */
html.fx-cursor, html.fx-cursor * { cursor: none !important; }
#cur, #cur-ring { position: fixed; left: 0; top: 0; z-index: 10000; pointer-events: none; opacity: 0; transition: opacity .18s; will-change: transform; }
html.fx-cursor #cur.on, html.fx-cursor #cur-ring.on { opacity: 1; }
#cur i {
  position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; color: var(--gold);
  filter: drop-shadow(0 0 1px rgba(6, 5, 16, .95)) drop-shadow(0 0 1px rgba(6, 5, 16, .95)) drop-shadow(0 0 5px currentColor);
  transition: transform .2s var(--ease), color .2s;
}
#cur i::before, #cur i::after { content: ""; position: absolute; background: currentColor; transition: transform .2s var(--ease); }
#cur i::before { left: 0; right: 0; top: 11px; height: 2px; }
#cur i::after { top: 0; bottom: 0; left: 11px; width: 2px; }
#cur.is-hot i { transform: rotate(45deg) scale(1.35); color: var(--cyan); }
#cur.is-text i { transform: scale(.92); color: var(--cyan); }
#cur.is-text i::before { transform: scaleX(.34); }
#cur.is-down i { transform: scale(.76); }
#cur.is-hot.is-down i { transform: rotate(45deg) scale(1.05); color: var(--pink); }
#cur-ring i { position: absolute; left: -17px; top: -17px; width: 34px; height: 34px; border: 1px solid rgba(255, 200, 61, .5); transform: rotate(45deg); transition: transform .28s var(--ease), border-color .25s; }
#cur-ring.is-hot i { transform: rotate(0deg) scale(1.32); border-color: rgba(63, 227, 255, .85); }
#cur-ring.is-down i { transform: rotate(45deg) scale(.66); }

/* 新的積木分類 */
.cat-clean { --c: var(--b-clean); }
.cat-misc { --c: var(--b-misc); }
.f-note { flex: 1 1 300px; width: auto; font-style: italic; }
.prog-or { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }

/* 對話框 */
#modal { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; padding: 18px; background: rgba(4, 3, 12, .78); backdrop-filter: blur(5px); }
.modal-box { --cut: 22px; --edge: linear-gradient(135deg, var(--gold), var(--pink) 45%, var(--cyan)); display: flex; flex-direction: column; width: min(580px, 100%); max-height: min(88vh, 880px); animation: modal-in .3s var(--ease); }
.modal-box.is-wide { width: min(1120px, 100%); }
.modal-box::after { background: linear-gradient(180deg, #1b183e, #110f28); }
@keyframes modal-in { from { opacity: 0; transform: translateY(18px) scale(.97); } to { opacity: 1; transform: none; } }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 20px 14px 24px; border-bottom: 1px solid var(--line-soft); }
.modal-head h2 { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; line-height: 1.35; }
.modal-head p { margin-top: 4px; font-size: 14px; color: var(--muted); line-height: 1.6; max-width: 70ch; }
.modal-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 24px 18px; }
.modal-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 24px 18px 30px; border-top: 1px solid var(--line-soft); font-size: 13px; color: var(--faint); }
.modal-foot code, .res-banner code { color: var(--gold); }
.modal-loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 60px 20px; color: var(--muted); }
.lib-bar { padding: 14px 24px 0; }
.lib-bar .search { flex: none; width: min(460px, 100%); }
.lib-cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.lib-cat { display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 14px 0 12px; background: var(--bg-2); border: 0; color: var(--muted); font-weight: 700; font-size: 14px; clip-path: polygon(7px 0, 100% 0, calc(100% - 7px) 100%, 0 100%); transition: background .2s, color .2s; }
.lib-cat b { font-family: var(--font-display); font-size: 12px; color: var(--faint); }
.lib-cat:hover { color: var(--text); background: var(--raise); }
.lib-cat.is-on { background: var(--gold); color: var(--ink); }
.lib-cat.is-on b { color: rgba(11, 10, 26, .7); }
.lib-cat:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--cyan); }
.lib-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
.sc { display: flex; flex-direction: column; gap: 10px; padding: 16px 16px 14px; background: rgba(8, 7, 22, .7); border: 1px solid var(--line-soft); border-top: 3px solid var(--violet); transition: border-color .2s, transform .2s var(--ease); }
.sc:hover { border-color: var(--gold); transform: translateY(-2px); }
.sc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.sc h3 { font-size: 1.02rem; line-height: 1.45; }
.sc-cat { flex: none; padding: 1px 9px; font-size: 12px; color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.sc p { font-size: 13.5px; line-height: 1.65; color: var(--muted); }
.sc-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.sc-flow i { font-style: normal; color: var(--faint); }
.sc-b { padding: 3px 9px; background: var(--c); color: var(--ink); font-weight: 700; font-size: 12px; line-height: 1.45; clip-path: polygon(0 0, 100% 0, 100% 100%, 5px 100%, 0 calc(100% - 5px)); }
.sc-flow.is-big { margin-bottom: 18px; }
.sc-flow.is-big .sc-b { padding: 5px 12px; font-size: 13.5px; }
.sc-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; margin-top: auto; padding-top: 4px; }
.sc-need { display: inline-flex; align-items: center; gap: 6px; margin-right: auto; font-size: 12.5px; color: var(--gold-2); }
.form { display: grid; gap: 12px; }
.fld { display: grid; gap: 6px; font-size: 13.5px; font-weight: 500; color: var(--muted); }
.fld select, .fld input { height: 44px; padding: 0 12px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 0; color: var(--text); font-size: 15.5px; }
.fld select:focus, .fld input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(63, 227, 255, .16); }
.form-note { margin-top: 12px; font-size: 13px; color: var(--faint); line-height: 1.6; }
.choice { margin: 18px 0 0; padding: 12px 14px; border: 1px dashed var(--line); display: grid; gap: 8px; }
.choice legend { padding: 0 8px; font-size: 13px; color: var(--muted); }
.choice label { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
.choice input { width: 18px; height: 18px; accent-color: var(--gold); }

/* ---------- 窄螢幕 ---------- */
@media (max-width: 1080px) {
  .editor-body { grid-template-columns: minmax(0, 1fr); }
  .palette { border-right: 0; border-bottom: 1px solid var(--line-soft); border-radius: 0; display: flex; gap: 14px; overflow-x: auto; padding: 12px 14px; }
  .pal-group { flex: none; }
  .pal-group + .pal-group { margin-top: 0; }
  .pal-items { flex-wrap: nowrap; }
  .pal-item { touch-action: pan-x; white-space: nowrap; }
  .pal-hint { display: none; }
  .pal-trash { border-radius: 0; flex-direction: row; }
  .palette { clip-path: none; }
}
@media (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 56px minmax(0, 1fr); }
  .topbar { display: flex; align-items: center; gap: 8px; padding: 0 8px 0 6px; background: rgba(13, 11, 31, .92); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
  .topbar-title { font-family: var(--font-display); font-weight: 900; font-size: 17px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar-count { font-family: var(--font-display); font-weight: 700; color: var(--gold); padding: 0 10px; }
  #sidebar { position: fixed; inset: 0 auto 0 0; z-index: 120; width: min(var(--side-w), 86vw); transform: translateX(-102%); transition: transform .3s var(--ease); background: #0d0b1f; }
  #sidebar.is-open { transform: none; box-shadow: 20px 0 60px rgba(0, 0, 0, .6); }
  #close-side { display: grid; }
  #page { padding: 26px 14px 96px; }
  .q-ask, .q-answer { padding: 20px 18px 22px 22px; }
  .doc-sec { padding: 22px 18px 24px; }
  .term { padding-right: 18px; padding-top: 44px; }
  .blk-in { grid-template-columns: auto minmax(0, 1fr); }
  .blk-tools { grid-column: 1 / -1; justify-content: flex-end; }
  .blk-hat .blk-in { grid-template-columns: minmax(0, 1fr); }
  .pager { margin-left: 0; }
  .chart-bar .btn { margin-left: 0; }
}
@media (min-width: 901px) { #scrim { display: none !important; } }
@media (max-width: 640px) {
  #modal { padding: 8px; }
  .modal-head, .modal-body, .modal-foot, .lib-bar { padding-left: 16px; padding-right: 16px; }
  .lib-list { grid-template-columns: minmax(0, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
  .bg-beam, #bg-hex { display: none; }
}

  </style>
</head>
<body>
<div id="bg" aria-hidden="true">
  <div class="bg-glow"></div>
  <div class="bg-beam b1"></div>
  <div class="bg-beam b2"></div>
  <canvas id="bg-base"></canvas>
  <canvas id="bg-hex"></canvas>
  <div class="bg-scan"></div>
</div>

<!-- 載入中畫面 -->
<div id="loading" role="status" aria-live="polite">
  <div class="load-box">
    <svg class="load-mark" viewBox="0 0 48 48" aria-hidden="true">
      <rect x="6" y="26" width="8" height="16" /><rect x="20" y="16" width="8" height="26" /><rect x="34" y="6" width="8" height="36" />
    </svg>
    <p class="load-text">題庫載入中</p>
    <div class="load-bar"><i></i></div>
  </div>
</div>

<div id="app" hidden>
