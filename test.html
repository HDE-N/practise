<script>
(() => {
'use strict';
/* ======================================================================
 * 基礎工具（不碰 DOM 的部分）
 * ==================================================================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtInt = n => Number(n).toLocaleString('en-US');
const fmtNum = n => (Number.isFinite(n) ? n.toLocaleString('en-US', { maximumFractionDigits: 4 }) : '—');
const debounce = (fn, ms) => { let t; const g = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; g.cancel = () => clearTimeout(t); return g; };
/** 以本地時區產生 YYYYMMDD（toISOString 是 UTC，台灣早上 8 點前會差一天） */
const localStamp = () => { const d = new Date(); const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}`; };
const getPath = (obj, path) => path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
const setPath = (obj, path, val) => { const ks = path.split('.'); const last = ks.pop(); const o = ks.reduce((x, k) => x[k], obj); o[last] = val; };

/* ======================================================================
 * 資料引擎（純函式，不碰 DOM）
 * 表格格式：{ cols: [欄位名...], rows: [[值...], ...] }
 * 值可能是字串（來自檔案）或數字（計算結果）
 * ==================================================================== */

const NUM_RE = /^[-+]?(?:\d+\.?\d*|\.\d+)(?:[eE][-+]?\d+)?$/;
const NUM_COMMA_RE = /^[-+]?\d{1,3}(?:,\d{3})+(?:\.\d+)?$/;

/** 嚴格的數字判斷："12abc"、"2026/4/1" 都不算數字；"1,234" 算 */
function toNum(v) {
  if (typeof v === 'number') return Number.isFinite(v) ? v : NaN;
  if (v == null) return NaN;
  const s = String(v).trim();
  if (s === '') return NaN;
  if (NUM_RE.test(s)) return Number(s);
  if (NUM_COMMA_RE.test(s)) return Number(s.replace(/,/g, ''));
  return NaN;
}
const toStr = v => (v == null ? '' : typeof v === 'string' ? v : String(v));
const isBlank = v => v == null || (typeof v === 'string' && v.trim() === '');

/** 去掉浮點數雜訊（0.1+0.2 → 0.3） */
function tidy(x) {
  if (!Number.isFinite(x)) return '';
  if (Number.isInteger(x)) return x;
  return Number(x.toPrecision(15));
}

/** 四捨五入（遠離零），避開 1.005.toFixed(2) 這類誤差 */
function roundTo(x, d) {
  if (!Number.isFinite(x)) return NaN;
  const sign = x < 0 ? -1 : 1;
  const a = Math.abs(x);
  let r = Number(Math.round(Number(a + 'e' + d)) + 'e-' + d);
  if (Number.isNaN(r)) r = Number(a.toFixed(d));
  return sign * r;
}

const collator = new Intl.Collator('zh-Hant', { numeric: true, sensitivity: 'base' });

function colIdx(t, name) {
  const i = t.cols.indexOf(name);
  if (i === -1) throw new Error(name ? `找不到欄位「${name}」` : '還有欄位沒選');
  return i;
}

function uniqueName(name, used) {
  let n = name, k = 2;
  while (used.has(n)) n = `${name}_${k++}`;
  used.add(n);
  return n;
}

/** 新增欄位；若名稱已存在就覆寫那一欄 */
function withCol(t, name, fn) {
  const i = t.cols.indexOf(name);
  const n = t.rows.length;
  const rows = new Array(n);
  if (i === -1) {
    for (let k = 0; k < n; k++) { const o = t.rows[k].slice(); o.push(fn(t.rows[k], k)); rows[k] = o; }
    return { cols: [...t.cols, name], rows };
  }
  for (let k = 0; k < n; k++) { const o = t.rows[k].slice(); o[i] = fn(t.rows[k], k); rows[k] = o; }
  return { cols: t.cols, rows };
}

/**
 * 判斷欄位型態（取樣）：'num' 或 'text'
 * 像「0050」這種代號、或「20260401」這種日期雖然全是數字，但拿來加總沒有意義，歸類為文字
 */
function colKind(rows, i) {
  let seen = 0, num = 0, code = 0, date = 0;
  for (let r = 0; r < rows.length && seen < 300; r++) {
    const v = rows[r][i];
    if (isBlank(v)) continue;
    seen++;
    if (Number.isNaN(toNum(v))) continue;
    num++;
    if (typeof v === 'string') {
      const s = v.trim();
      if (/^0\d/.test(s)) code++;
      else if (/^(19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])$/.test(s)) date++;
    }
  }
  if (!seen || num / seen < 0.9) return 'text';
  if (code / seen > 0.3 || date / seen > 0.9) return 'text';
  return 'num';
}

function colLetter(i) {
  let s = '', n = i + 1;
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = (n - m - 1) / 26; }
  return s;
}

/* ---------- 比較 ---------- */

function eqVals(a, b) {
  const sa = toStr(a).trim(), sb = toStr(b).trim();
  if (sa === sb) return true;
  const na = toNum(sa);
  return !Number.isNaN(na) && na === toNum(sb);
}

/** 大小比較；無法比較（空白、數字對文字）時回傳 NaN */
function ordVals(a, b) {
  if (isBlank(a) || isBlank(b)) return NaN;
  const na = toNum(a), nb = toNum(b);
  const fa = !Number.isNaN(na), fb = !Number.isNaN(nb);
  if (fa && fb) return na - nb;
  if (fa !== fb) return NaN;
  return collator.compare(toStr(a).trim(), toStr(b).trim());
}

const COND_OPS = [
  ['=', '等於'], ['!=', '不等於'], ['>', '大於'], ['>=', '大於等於'], ['<', '小於'], ['<=', '小於等於'],
  ['between', '介於'], ['contains', '包含'], ['ncontains', '不包含'], ['starts', '開頭是'], ['ends', '結尾是'],
  ['in', '是其中之一'], ['empty', '是空白'], ['nempty', '不是空白']
];
const OPS_NOVAL = new Set(['empty', 'nempty']);
const OPS_COLOK = new Set(['=', '!=', '>', '>=', '<', '<=']);
const COND_STATS = [['avg', '平均'], ['median', '中位數'], ['max', '最大值'], ['min', '最小值'], ['sum', '加總']];
const COND_STAT_PY = { avg: 'mean', median: 'median', max: 'max', min: 'min', sum: 'sum' };
const splitList = s => String(s ?? '').split(/[,，、\n]/).map(x => x.trim()).filter(Boolean);

/** 把一個條件編譯成 row => boolean；條件還沒填完時回傳 null（暫不生效） */
function compileCond(t, c, ctx) {
  const i = colIdx(t, c.col);
  const op = c.op;
  if (op === 'empty') return r => isBlank(r[i]);
  if (op === 'nempty') return r => !isBlank(r[i]);
  const useCol = c.vt === 'col' && OPS_COLOK.has(op);
  if (useCol) {
    const j = colIdx(t, c.val);
    switch (op) {
      case '=': return r => eqVals(r[i], r[j]);
      case '!=': return r => !eqVals(r[i], r[j]);
      case '>': return r => ordVals(r[i], r[j]) > 0;
      case '>=': return r => ordVals(r[i], r[j]) >= 0;
      case '<': return r => ordVals(r[i], r[j]) < 0;
      case '<=': return r => ordVals(r[i], r[j]) <= 0;
    }
  }
  if (c.vt === 'stat' && OPS_COLOK.has(op)) {
    // 和「這一欄自己的統計值」比較，例如：大於平均的 1.2 倍
    const base = aggregate(c.stat || 'avg', t.rows, i);
    const mulRaw = String(c.mul ?? '').trim();
    const mul = mulRaw === '' ? 1 : toNum(mulRaw);
    if (typeof base !== 'number' || Number.isNaN(mul)) {
      if (ctx && ctx.warn) ctx.warn(typeof base !== 'number' ? '這一欄沒有數字，算不出統計值' : '倍數請填數字');
      return null;
    }
    const th = base * mul;
    if (ctx && ctx.warn) ctx.warn(`這裡的門檻是 ${fmtNum(tidy(th))}`);
    switch (op) {
      case '=': return r => toNum(r[i]) === th;
      case '!=': return r => { const x = toNum(r[i]); return x === x && x !== th; };
      case '>': return r => toNum(r[i]) > th;
      case '>=': return r => toNum(r[i]) >= th;
      case '<': return r => toNum(r[i]) < th;
      case '<=': return r => toNum(r[i]) <= th;
    }
  }
  const v = String(c.val ?? '').trim();
  const incomplete = () => { if (ctx && ctx.warn) ctx.warn('比較值還沒填，這個條件暫時不生效'); return null; };
  if (v === '') return incomplete();
  const low = v.toLowerCase();
  switch (op) {
    case '=': return r => eqVals(r[i], v);
    case '!=': return r => !eqVals(r[i], v);
    case '>': return r => ordVals(r[i], v) > 0;
    case '>=': return r => ordVals(r[i], v) >= 0;
    case '<': return r => ordVals(r[i], v) < 0;
    case '<=': return r => ordVals(r[i], v) <= 0;
    case 'between': {
      const hi = String(c.val2 ?? '').trim();
      if (hi === '') return incomplete();
      return r => ordVals(r[i], v) >= 0 && ordVals(r[i], hi) <= 0;
    }
    case 'contains': return r => toStr(r[i]).toLowerCase().includes(low);
    case 'ncontains': return r => !toStr(r[i]).toLowerCase().includes(low);
    case 'starts': return r => toStr(r[i]).trim().toLowerCase().startsWith(low);
    case 'ends': return r => toStr(r[i]).trim().toLowerCase().endsWith(low);
    case 'in': {
      const list = splitList(c.val);
      const strs = new Set(list);
      const nums = new Set(list.map(toNum).filter(x => !Number.isNaN(x)));
      return r => { const s = toStr(r[i]).trim(); if (strs.has(s)) return true; const x = toNum(s); return !Number.isNaN(x) && nums.has(x); };
    }
  }
  throw new Error('不認得的比較方式');
}

/* ---------- 統計 ---------- */

const AGG = {
  sum: { label: '加總', py: 'sum' },
  avg: { label: '平均', py: 'mean' },
  count: { label: '筆數', py: 'size' },
  nunique: { label: '相異數', py: 'nunique' },
  max: { label: '最大值', py: 'max' },
  min: { label: '最小值', py: 'min' },
  median: { label: '中位數', py: 'median' },
  std: { label: '標準差', py: 'std' }
};

function aggregate(fn, rows, i) {
  if (fn === 'count') return rows.length;
  if (fn === 'nunique') {
    const s = new Set();
    for (const r of rows) if (!isBlank(r[i])) s.add(toStr(r[i]).trim());
    return s.size;
  }
  const nums = [];
  for (const r of rows) { const x = toNum(r[i]); if (!Number.isNaN(x)) nums.push(x); }
  const n = nums.length;
  switch (fn) {
    case 'sum': { let s = 0; for (const x of nums) s += x; return tidy(s); }
    case 'avg': { if (!n) return ''; let s = 0; for (const x of nums) s += x; return tidy(s / n); }
    case 'max':
    case 'min': {
      if (n) { let m = nums[0]; for (const x of nums) if (fn === 'max' ? x > m : x < m) m = x; return m; }
      let best = null;
      for (const r of rows) {
        if (isBlank(r[i])) continue;
        const s = toStr(r[i]).trim();
        if (best === null || (fn === 'max' ? collator.compare(s, best) > 0 : collator.compare(s, best) < 0)) best = s;
      }
      return best === null ? '' : best;
    }
    case 'median': {
      if (!n) return '';
      nums.sort((a, b) => a - b);
      return tidy(n % 2 ? nums[(n - 1) / 2] : (nums[n / 2 - 1] + nums[n / 2]) / 2);
    }
    case 'std': {
      if (n < 2) return '';
      let s = 0; for (const x of nums) s += x;
      const m = s / n; let q = 0;
      for (const x of nums) q += (x - m) * (x - m);
      return tidy(Math.sqrt(q / (n - 1)));
    }
  }
  throw new Error('不認得的統計方式');
}

/* ---------- 日期 ---------- */

/** 支援 20260401、1150407（民國）、2026/4/1、115-04-07、2026年4月1日、ISO 字串 */
function parseDate(v) {
  const s = toStr(v).trim();
  if (!s) return null;
  let y, m, d, k;
  if ((k = /^(\d{4})(\d{2})(\d{2})$/.exec(s))) { y = +k[1]; m = +k[2]; d = +k[3]; }
  else if ((k = /^(\d{3})(\d{2})(\d{2})$/.exec(s))) { y = +k[1] + 1911; m = +k[2]; d = +k[3]; }
  else if ((k = /^(\d{2,4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/.exec(s))) { y = +k[1]; if (y < 1000) y += 1911; m = +k[2]; d = +k[3]; }
  else {
    const ms = Date.parse(s);
    if (Number.isNaN(ms)) return null;
    const dt = new Date(ms);
    y = dt.getFullYear(); m = dt.getMonth() + 1; d = dt.getDate();
  }
  if (m < 1 || m > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, m - 1, d);
  if (dt.getMonth() !== m - 1) return null;
  return { y, m, d, wd: dt.getDay() };
}

const WEEK = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
const pad2 = n => String(n).padStart(2, '0');
const DATE_PARTS = {
  year: { label: '西元年', f: o => o.y },
  roc: { label: '民國年', f: o => o.y - 1911 },
  month: { label: '月（數字）', f: o => o.m },
  month_zh: { label: '月（例：9月）', f: o => o.m + '月' },
  day: { label: '日', f: o => o.d },
  md: { label: '月/日（例：9/1）', f: o => o.m + '/' + o.d },
  ym: { label: '年-月（例：2025-09）', f: o => o.y + '-' + pad2(o.m) },
  iso: { label: '標準日期（例：2025-09-01）', f: o => o.y + '-' + pad2(o.m) + '-' + pad2(o.d) },
  quarter: { label: '季（例：Q4）', f: o => 'Q' + Math.ceil(o.m / 3) },
  weekday: { label: '星期（例：週六）', f: o => WEEK[o.wd] },
  weekend: { label: '平日或週末', f: o => (o.wd === 0 || o.wd === 6 ? '週末' : '平日') }
};

/* ---------- 公式解析（不使用 eval） ---------- */

const FULLWIDTH = { '（': '(', '）': ')', '＋': '+', '－': '-', '×': '*', '＊': '*', '÷': '/', '／': '/', '，': ',', '％': '%', '＾': '^' };
const FORMULA_FNS = {
  round: { n: [1, 2], f: (x, d = 0) => roundTo(x, d), py: a => `round(${a.join(', ')})` },
  abs: { n: [1, 1], f: Math.abs, py: a => `abs(${a[0]})` },
  floor: { n: [1, 1], f: Math.floor, py: a => `np.floor(${a[0]})`, np: true },
  ceil: { n: [1, 1], f: Math.ceil, py: a => `np.ceil(${a[0]})`, np: true },
  sqrt: { n: [1, 1], f: Math.sqrt, py: a => `np.sqrt(${a[0]})`, np: true },
  min: { n: [2, 2], f: Math.min, py: a => `np.minimum(${a.join(', ')})`, np: true },
  max: { n: [2, 2], f: Math.max, py: a => `np.maximum(${a.join(', ')})`, np: true },
  pow: { n: [2, 2], f: Math.pow, py: a => `np.power(${a.join(', ')})`, np: true }
};

function tokenizeFormula(src) {
  const out = [];
  let i = 0;
  const n = src.length;
  while (i < n) {
    let ch = src[i];
    if (ch === '[' || ch === '［') {
      const close = ch === '[' ? ']' : '］';
      let j = src.indexOf(close, i + 1);
      if (j === -1 && ch === '[') j = src.indexOf('］', i + 1);
      if (j === -1) throw new Error('欄位名稱少了右括號 ]');
      out.push({ t: 'col', v: src.slice(i + 1, j).trim() });
      i = j + 1;
      continue;
    }
    if (FULLWIDTH[ch]) ch = FULLWIDTH[ch];
    if (/\s/.test(ch) || ch === '\u3000') { i++; continue; }
    if (/[0-9.]/.test(ch) || (ch >= '０' && ch <= '９')) {
      let j = i, s = '';
      while (j < n) {
        let c = src[j];
        if (c >= '０' && c <= '９') c = String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
        if (!/[0-9.]/.test(c)) break;
        s += c; j++;
      }
      if (!NUM_RE.test(s)) throw new Error(`看不懂的數字「${s}」`);
      out.push({ t: 'num', v: Number(s) });
      i = j;
      continue;
    }
    if ('+-*/%^(),'.includes(ch)) { out.push({ t: ch }); i++; continue; }
    // 名稱（函式或沒加括號的欄位名）
    let j = i;
    while (j < n) {
      const c = FULLWIDTH[src[j]] || src[j];
      if (/\s/.test(c) || '+-*/%^(),[]'.includes(c) || c === '［' || c === '］') break;
      j++;
    }
    if (j === i) throw new Error(`這裡不應該出現「${src[i]}」`);
    out.push({ t: 'id', v: src.slice(i, j) });
    i = j;
  }
  return out;
}

function parseFormula(src) {
  const toks = tokenizeFormula(String(src ?? ''));
  if (!toks.length) throw new Error('公式是空的');
  let p = 0;
  const peek = () => toks[p];
  const eat = t => { if (toks[p] && toks[p].t === t) return toks[p++]; return null; };
  const need = (t, msg) => { const k = eat(t); if (!k) throw new Error(msg); return k; };

  function expr() {
    let a = term();
    for (;;) {
      if (eat('+')) a = { t: 'bin', op: '+', a, b: term() };
      else if (eat('-')) a = { t: 'bin', op: '-', a, b: term() };
      else return a;
    }
  }
  function term() {
    let a = unary();
    for (;;) {
      if (eat('*')) a = { t: 'bin', op: '*', a, b: unary() };
      else if (eat('/')) a = { t: 'bin', op: '/', a, b: unary() };
      else if (eat('%')) a = { t: 'bin', op: '%', a, b: unary() };
      else return a;
    }
  }
  function unary() {
    if (eat('-')) return { t: 'neg', a: unary() };
    if (eat('+')) return unary();
    return power();
  }
  function power() {
    const a = primary();
    if (eat('^')) return { t: 'bin', op: '^', a, b: unary() };
    return a;
  }
  function primary() {
    const k = peek();
    if (!k) throw new Error('公式還沒寫完');
    if (k.t === 'num') { p++; return { t: 'num', v: k.v }; }
    if (k.t === 'col') { p++; return { t: 'col', name: k.v }; }
    if (k.t === '(') { p++; const a = expr(); need(')', '少了右括號 )'); return a; }
    if (k.t === 'id') {
      p++;
      if (eat('(')) {
        const fn = FORMULA_FNS[k.v.toLowerCase()];
        if (!fn) throw new Error(`沒有「${k.v}」這個函式（可用：${Object.keys(FORMULA_FNS).join('、')}）`);
        const args = [];
        if (!eat(')')) {
          do { args.push(expr()); } while (eat(','));
          need(')', '少了右括號 )');
        }
        if (args.length < fn.n[0] || args.length > fn.n[1]) throw new Error(`${k.v}() 的參數數量不對`);
        return { t: 'call', fn: k.v.toLowerCase(), args };
      }
      return { t: 'col', name: k.v };
    }
    throw new Error(`這裡不應該出現「${k.t}」`);
  }
  const ast = expr();
  if (p < toks.length) throw new Error('公式後面多了看不懂的內容');
  return ast;
}

function compileFormula(ast, t) {
  switch (ast.t) {
    case 'num': { const v = ast.v; return () => v; }
    case 'col': { const i = colIdx(t, ast.name); return r => toNum(r[i]); }
    case 'neg': { const a = compileFormula(ast.a, t); return r => -a(r); }
    case 'bin': {
      const a = compileFormula(ast.a, t), b = compileFormula(ast.b, t);
      switch (ast.op) {
        case '+': return r => a(r) + b(r);
        case '-': return r => a(r) - b(r);
        case '*': return r => a(r) * b(r);
        case '/': return r => { const y = b(r); return y === 0 ? NaN : a(r) / y; };
        case '%': return r => { const y = b(r); return y === 0 ? NaN : a(r) % y; };
        case '^': return r => Math.pow(a(r), b(r));
      }
      break;
    }
    case 'call': {
      const f = FORMULA_FNS[ast.fn].f;
      const args = ast.args.map(x => compileFormula(x, t));
      return r => f(...args.map(g => g(r)));
    }
  }
  throw new Error('公式有問題');
}

const pyStr = s => JSON.stringify(String(s ?? ''));
function pyVal(v) {
  const s = String(v ?? '').trim();
  if (NUM_RE.test(s) && !/^[-+]?0\d/.test(s)) return s;
  if (NUM_COMMA_RE.test(s)) return s.replace(/,/g, '');
  return pyStr(s);
}

function pyFormula(ast, flags) {
  switch (ast.t) {
    case 'num': return String(ast.v);
    case 'col': return `df[${pyStr(ast.name)}]`;
    case 'neg': return `-${pyFormula(ast.a, flags)}`;
    case 'bin': return `(${pyFormula(ast.a, flags)} ${ast.op === '^' ? '**' : ast.op} ${pyFormula(ast.b, flags)})`;
    case 'call': {
      const fn = FORMULA_FNS[ast.fn];
      if (fn.np) flags.np = true;
      return fn.py(ast.args.map(a => pyFormula(a, flags)));
    }
  }
  return '';
}

/* ---------- 檔案解析 ---------- */

function detectDelimiter(text) {
  const sample = text.slice(0, 20000);
  const counts = { ',': 0, '\t': 0, ';': 0, '|': 0 };
  let inQ = false;
  for (let i = 0; i < sample.length; i++) {
    const ch = sample[i];
    if (ch === '"') inQ = !inQ;
    else if (!inQ && ch in counts) counts[ch]++;
  }
  let best = ',', max = 0;
  for (const d of [',', '\t', ';', '|']) if (counts[d] > max) { max = counts[d]; best = d; }
  return best;
}

/** RFC 4180 CSV 解析（支援引號、引號內換行、"" 跳脫） */
function parseCSV(text, delim) {
  const D = (delim || detectDelimiter(text)).charCodeAt(0);
  const n = text.length;
  const rows = [];
  let row = [];
  let i = text.charCodeAt(0) === 0xFEFF ? 1 : 0;
  const stop = k => { while (k < n) { const c = text.charCodeAt(k); if (c === D || c === 10 || c === 13) break; k++; } return k; };
  while (i < n) {
    if (text.charCodeAt(i) === 34) {
      let j = i + 1, buf = '';
      for (;;) {
        const q = text.indexOf('"', j);
        if (q === -1) { buf += text.slice(j); j = n; break; }
        buf += text.slice(j, q);
        if (text.charCodeAt(q + 1) === 34) { buf += '"'; j = q + 2; continue; }
        j = q + 1;
        break;
      }
      const k = stop(j);
      if (k > j) buf += text.slice(j, k);
      row.push(buf);
      i = k;
    } else {
      const k = stop(i);
      row.push(text.slice(i, k));
      i = k;
    }
    if (i >= n) break;
    const c = text.charCodeAt(i);
    if (c === D) { i++; if (i >= n) row.push(''); continue; }
    i += c === 13 && text.charCodeAt(i + 1) === 10 ? 2 : 1;
    rows.push(row);
    row = [];
  }
  if (row.length) rows.push(row);
  return rows;
}

function toCSV(cols, rows) {
  const q = v => {
    const s = v == null ? '' : String(v);
    return /[",\r\n]/.test(s) || /^\s|\s$/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const out = [cols.map(q).join(',')];
  for (const r of rows) out.push(r.map(q).join(','));
  return out.join('\r\n');
}

/** 自動判斷編碼：UTF-8（含 BOM）→ UTF-16 → Big5（政府開放資料常見） */
function decodeBuffer(buf) {
  const u8 = new Uint8Array(buf);
  if (u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return { text: new TextDecoder('utf-8').decode(u8), enc: 'UTF-8' };
  if (u8[0] === 0xFF && u8[1] === 0xFE) return { text: new TextDecoder('utf-16le').decode(u8), enc: 'UTF-16' };
  if (u8[0] === 0xFE && u8[1] === 0xFF) return { text: new TextDecoder('utf-16be').decode(u8), enc: 'UTF-16' };
  try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(u8), enc: 'UTF-8' }; }
  catch (e) { /* 不是 UTF-8 */ }
  try { return { text: new TextDecoder('big5').decode(u8), enc: 'Big5' }; }
  catch (e) { return { text: new TextDecoder('utf-8').decode(u8), enc: 'UTF-8' }; }
}

function flattenRecord(obj, prefix, out) {
  for (const k of Object.keys(obj)) {
    const v = obj[k];
    const key = prefix ? prefix + '.' + k : k;
    if (v && typeof v === 'object' && !Array.isArray(v)) flattenRecord(v, key, out);
    else if (Array.isArray(v)) out[key] = JSON.stringify(v);
    else out[key] = v == null ? '' : typeof v === 'boolean' ? String(v) : v;
  }
  return out;
}

function findRecordArray(data, depth) {
  if (Array.isArray(data)) return data;
  if (!data || typeof data !== 'object' || depth > 4) return null;
  let fallback = null;
  for (const k of Object.keys(data)) {
    const v = data[k];
    if (Array.isArray(v) && v.length && typeof v[0] === 'object' && v[0] !== null) return v;
    if (Array.isArray(v) && !fallback) fallback = v;
  }
  for (const k of Object.keys(data)) {
    const hit = findRecordArray(data[k], depth + 1);
    if (hit && hit.length) return hit;
  }
  return fallback;
}

/** JSON → 二維陣列（第一列是標題） */
function jsonToMatrix(data) {
  let arr = findRecordArray(data, 0);
  if (!arr) arr = [data];
  if (!arr.length) return [];
  if (arr.every(Array.isArray)) return arr.map(r => r.map(v => (v == null ? '' : typeof v === 'object' ? JSON.stringify(v) : v)));
  const header = [];
  const seen = new Map();
  const recs = arr.map(o => {
    const rec = o && typeof o === 'object' ? flattenRecord(o, '', {}) : { 值: o };
    for (const k of Object.keys(rec)) if (!seen.has(k)) { seen.set(k, header.length); header.push(k); }
    return rec;
  });
  const out = [header];
  for (const rec of recs) {
    const row = new Array(header.length).fill('');
    for (const k of Object.keys(rec)) row[seen.get(k)] = rec[k];
    out.push(row);
  }
  return out;
}

function parseJSONText(text) {
  const s = text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
  try { return jsonToMatrix(JSON.parse(s)); }
  catch (e) {
    // JSON Lines：每行一個物件
    const lines = s.split(/\r?\n/).filter(l => l.trim());
    if (lines.length > 1) {
      try { return jsonToMatrix(lines.map(l => JSON.parse(l))); } catch (e2) { /* fallthrough */ }
    }
    throw new Error('JSON 格式有誤，無法解析');
  }
}

/** 二維陣列 → 表格：第一列當標題、補齊欄數、去掉全空的列、欄名去重 */
function matrixToTable(matrix) {
  const m = matrix.filter(r => r && r.some(v => !isBlank(v)));
  if (!m.length) throw new Error('檔案裡沒有資料');
  let w = 0;
  for (const r of m) if (r.length > w) w = r.length;
  const used = new Set();
  const cols = [];
  for (let i = 0; i < w; i++) {
    const raw = toStr(m[0][i]).trim().replace(/\s+/g, ' ');
    cols.push(uniqueName(raw || `欄位${i + 1}`, used));
  }
  const rows = m.slice(1);
  for (const r of rows) { while (r.length < w) r.push(''); }
  return { cols, rows };
}

/* 一次選一批欄位：手動挑，或用欄名規則（包含／開頭／結尾） */
const COL_MODES = [['pick', '我挑的'], ['contains', '名稱包含'], ['starts', '名稱開頭是'], ['ends', '名稱結尾是']];
function pickCols(t, p, ctx) {
  const mode = p.mode || 'pick';
  if (mode === 'pick') {
    if (!p.cols.length) { if (ctx && ctx.warn) ctx.warn('還沒選欄位，這塊積木暫時不生效'); return []; }
    return p.cols.map(c => colIdx(t, c));
  }
  const pat = String(p.pat ?? '').trim();
  if (!pat) { if (ctx && ctx.warn) ctx.warn('還沒填欄名規則，這塊積木暫時不生效'); return []; }
  const test = mode === 'contains' ? c => c.includes(pat) : mode === 'starts' ? c => c.startsWith(pat) : c => c.endsWith(pat);
  const idx = t.cols.map((c, i) => (test(c) ? i : -1)).filter(i => i >= 0);
  if (!idx.length) throw new Error(`沒有任何欄位的名稱符合「${pat}」`);
  if (ctx && ctx.warn) ctx.warn(`用到 ${idx.length} 個欄位：${idx.slice(0, 4).map(i => t.cols[i]).join('、')}${idx.length > 4 ? '…' : ''}`);
  return idx;
}
const colPickUI = (p, cols) => F.sel('mode', p.mode || 'pick', COL_MODES, { rr: true, cls: 'f-mini', label: '怎麼選欄位' }) +
  ((p.mode || 'pick') === 'pick' ? F.multi('cols', p.cols, cols) : F.txt('pat', p.pat, { ph: '例：小計', w: 9, label: '欄名規則' })) + F.w('欄位');
function pyColPick(p) {
  const mode = p.mode || 'pick';
  if (mode === 'pick') return `[${p.cols.map(pyStr).join(', ')}]`;
  if (mode === 'contains') return `[c for c in df.columns if ${pyStr(p.pat)} in c]`;
  return `[c for c in df.columns if c.${mode === 'starts' ? 'startswith' : 'endswith'}(${pyStr(p.pat)})]`;
}
const outName = (type, p) => String(p.name ?? '').trim() || autoName[type](p);
const nameUI = (type, p) => F.w('存到欄位') + F.txt('name', p.name, { ph: autoName[type](p), w: 12, label: '新欄位名稱' });

function aggNames(p) {
  const used = new Set(p.keys);
  return p.aggs.map(a => uniqueName(a.fn === 'count' ? '筆數' : `${a.col}_${AGG[a.fn].label}`, used));
}

const BLOCK_CATS = [
  ['rows', '挑選列'],
  ['order', '排序與排名'],
  ['cols', '欄位'],
  ['calc', '計算'],
  ['text', '文字與日期'],
  ['stat', '統計'],
  ['multi', '多份資料'],
  ['clean', '清理'],
  ['misc', '其他']
];

const BLOCKS = {
  /* ===================== 挑選列 ===================== */
  filter: {
    cat: 'rows', label: '篩選', hint: '只留下符合條件的列',
    make: cols => ({ mode: 'all', conds: [newCond(cols)] }),
    ui(p, cols) {
      const many = p.conds.length > 1;
      let h = F.w('只留下') + (many ? F.sel('mode', p.mode, [['all', '每個條件都符合'], ['any', '符合任一條件']], { label: '條件關係' }) + F.w('的列') : F.w('符合條件的列'));
      h += '<div class="blk-rows">' + p.conds.map((c, i) => `<div class="blk-row">${condUI('conds.' + i, c, cols)}${many ? F.del('del-cond', i, '移除這個條件') : ''}</div>`).join('') + '</div>';
      return h + F.add('add-cond', '再加一個條件');
    },
    acts: {
      'add-cond': (p, i, cols) => { p.conds.push(newCond(cols)); },
      'del-cond': (p, i) => { p.conds.splice(i, 1); }
    },
    run(t, p, ctx) {
      const fns = [];
      for (const c of p.conds) { const f = compileCond(t, c, ctx); if (f) fns.push(f); }
      if (!fns.length) return t;
      const test = p.mode === 'any' ? r => fns.some(f => f(r)) : r => fns.every(f => f(r));
      return { cols: t.cols, rows: t.rows.filter(test) };
    },
    py(p) {
      const cs = p.conds.filter(condReady).map(pyCond);
      if (!cs.length) return [];
      return [`df = df[${cs.length === 1 ? cs[0] : cs.map(c => `(${c})`).join(p.mode === 'any' ? ' | ' : ' & ')}]`];
    }
  },

  head: {
    cat: 'rows', label: '取前幾列', hint: '只留最前面或最後面幾列',
    make: () => ({ from: 'top', n: 10 }),
    ui: p => F.w('只留下') + F.sel('from', p.from, [['top', '最前面'], ['bottom', '最後面']], { label: '位置' }) + F.num('n', p.n, { min: 0, label: '列數' }) + F.w('列'),
    run(t, p) {
      const n = Math.floor(toNum(p.n));
      if (!(n >= 0)) throw new Error('請填要留幾列');
      return { cols: t.cols, rows: p.from === 'bottom' ? (n === 0 ? [] : t.rows.slice(-n)) : t.rows.slice(0, n) };
    },
    py: p => [`df = df.${p.from === 'bottom' ? 'tail' : 'head'}(${Math.floor(toNum(p.n)) || 0})`]
  },

  skip: {
    cat: 'rows', label: '略過前幾列', hint: '丟掉最上面幾列（例如多出來的說明列）',
    make: () => ({ n: 1 }),
    ui: p => F.w('丟掉最前面') + F.num('n', p.n, { min: 0, label: '列數' }) + F.w('列'),
    run(t, p) {
      const n = Math.floor(toNum(p.n));
      if (!(n >= 0)) throw new Error('請填要略過幾列');
      return { cols: t.cols, rows: t.rows.slice(n) };
    },
    py: p => [`df = df.iloc[${Math.floor(toNum(p.n)) || 0}:]`]
  },

  distinct: {
    cat: 'rows', label: '移除重複', hint: '重複的列只留第一筆',
    make: () => ({ cols: [] }),
    ui: (p, cols) => F.w('重複的列只留第一筆，判斷依據') + F.multi('cols', p.cols, cols) + (p.cols.length ? '' : F.w('<em>（沒選＝整列都一樣才算重複）</em>')),
    run(t, p) {
      const idx = p.cols.length ? p.cols.map(c => colIdx(t, c)) : t.cols.map((_, i) => i);
      const seen = new Set();
      const rows = [];
      for (const r of t.rows) {
        const k = idx.map(i => toStr(r[i]).trim()).join('\u0001');
        if (!seen.has(k)) { seen.add(k); rows.push(r); }
      }
      return { cols: t.cols, rows };
    },
    py: p => [`df = df.drop_duplicates(${p.cols.length ? `subset=[${p.cols.map(pyStr).join(', ')}]` : ''})`]
  },

  /* ===================== 排序與排名 ===================== */
  sort: {
    cat: 'order', label: '排序', hint: '依欄位由小到大或由大到小排',
    make: (cols, kinds) => ({ keys: [{ col: firstNum(cols, kinds), dir: 'desc' }] }),
    ui(p, cols) {
      const many = p.keys.length > 1;
      let h = '<div class="blk-rows">' + p.keys.map((k, i) => `<div class="blk-row">${F.w(i === 0 ? '依' : '同分再依')}${F.col(`keys.${i}.col`, k.col, cols)}${F.sel(`keys.${i}.dir`, k.dir, [['asc', '由小到大'], ['desc', '由大到小']], { label: '方向' })}${F.w('排')}${many ? F.del('del-key', i, '移除這個排序條件') : ''}</div>`).join('') + '</div>';
      return h + F.add('add-key', '同分時的排序條件');
    },
    acts: {
      'add-key': (p, i, cols) => { p.keys.push({ col: cols.find(c => !p.keys.some(k => k.col === c)) || cols[0] || '', dir: 'asc' }); },
      'del-key': (p, i) => { p.keys.splice(i, 1); }
    },
    run(t, p) {
      const n = t.rows.length;
      const K = p.keys.map(k => {
        const i = colIdx(t, k.col);
        const blank = new Uint8Array(n), num = new Float64Array(n), str = new Array(n);
        for (let r = 0; r < n; r++) {
          const v = t.rows[r][i];
          if (isBlank(v)) { blank[r] = 1; num[r] = NaN; continue; }
          const x = toNum(v);
          num[r] = x;
          if (Number.isNaN(x)) str[r] = toStr(v).trim();
        }
        return { blank, num, str, d: k.dir === 'desc' ? -1 : 1 };
      });
      const idx = new Array(n);
      for (let i = 0; i < n; i++) idx[i] = i;
      idx.sort((a, b) => {
        for (const k of K) {
          if (k.blank[a] || k.blank[b]) { if (k.blank[a] && k.blank[b]) continue; return k.blank[a] ? 1 : -1; }
          const x = k.num[a], y = k.num[b];
          const fx = x === x, fy = y === y;
          const c = fx && fy ? x - y : fx !== fy ? (fx ? -1 : 1) : collator.compare(k.str[a], k.str[b]);
          if (c) return c * k.d;
        }
        return a - b;
      });
      return { cols: t.cols, rows: idx.map(i => t.rows[i]) };
    },
    py: p => [`df = df.sort_values([${p.keys.map(k => pyStr(k.col)).join(', ')}], ascending=[${p.keys.map(k => (k.dir === 'desc' ? 'False' : 'True')).join(', ')}])`]
  },

  window: {
    cat: 'order', label: '排名與累計', hint: '排名、累計加總、佔比、和上一列比較',
    make: (cols, kinds) => ({ col: firstNum(cols, kinds), fn: 'rank_desc', name: '' }),
    ui: (p, cols) => F.w('對') + F.col('col', p.col, cols) + F.w('算出') + F.sel('fn', p.fn, Object.entries(WINDOW_FNS).map(([k, v]) => [k, v.label]), { rr: true, label: '計算方式' }) +
      (p.fn === 'ma' ? F.w('最近') + F.num('n', p.n ?? 3, { min: 2, w: 5, label: '列數' }) + F.w('列') : '') + nameUI('window', p),
    run(t, p) {
      const i = colIdx(t, p.col);
      const nums = t.rows.map(r => toNum(r[i]));
      let out;
      if (p.fn === 'rank_desc' || p.fn === 'rank_asc') {
        const sorted = nums.filter(x => x === x).sort((a, b) => (p.fn === 'rank_desc' ? b - a : a - b));
        const rank = new Map();
        sorted.forEach((x, k) => { if (!rank.has(x)) rank.set(x, k + 1); });
        out = nums.map(x => (x === x ? rank.get(x) : ''));
      } else if (p.fn === 'cumsum') {
        let s = 0;
        out = nums.map(x => (x === x ? tidy((s += x)) : ''));
      } else if (p.fn === 'lag' || p.fn === 'lead') {
        const d = p.fn === 'lag' ? -1 : 1;
        out = t.rows.map((r, k) => { const o = t.rows[k + d]; return o ? o[i] : ''; });
      } else if (p.fn === 'ma') {
        const n = Math.floor(toNum(p.n ?? 3));
        if (!(n >= 2)) throw new Error('移動平均至少要算 2 列');
        out = nums.map((x, k) => {
          if (k < n - 1) return '';
          let sum = 0;
          for (let j = k - n + 1; j <= k; j++) { if (nums[j] !== nums[j]) return ''; sum += nums[j]; }
          return tidy(sum / n);
        });
      } else if (p.fn === 'pct') {
        let s = 0;
        for (const x of nums) if (x === x) s += x;
        out = nums.map(x => (x === x && s !== 0 ? tidy((x / s) * 100) : ''));
      } else {
        out = nums.map((x, k) => {
          const prev = k > 0 ? nums[k - 1] : NaN;
          if (x !== x || prev !== prev) return '';
          if (p.fn === 'diff') return tidy(x - prev);
          return prev === 0 ? '' : tidy(((x - prev) / prev) * 100);
        });
      }
      return withCol(t, outName('window', p), (r, k) => out[k]);
    },
    py(p) {
      const L = `df[${pyStr(p.col)}]`, N = `df[${pyStr(outName('window', p))}]`;
      switch (p.fn) {
        case 'rank_desc': return [`${N} = ${L}.rank(ascending=False, method="min").astype("Int64")`];
        case 'rank_asc': return [`${N} = ${L}.rank(ascending=True, method="min").astype("Int64")`];
        case 'cumsum': return [`${N} = ${L}.cumsum()`];
        case 'pct': return [`${N} = ${L} / ${L}.sum() * 100`];
        case 'diff': return [`${N} = ${L}.diff()`];
        case 'lag': return [`${N} = ${L}.shift(1)`];
        case 'lead': return [`${N} = ${L}.shift(-1)`];
        case 'ma': return [`${N} = ${L}.rolling(${Math.floor(toNum(p.n ?? 3)) || 3}).mean()`];
        default: return [`${N} = ${L}.pct_change() * 100`];
      }
    }
  },

  /* ===================== 欄位 ===================== */
  select: {
    cat: 'cols', label: '挑欄位', hint: '只保留或移除某些欄位',
    make: () => ({ mode: 'keep', cols: [] }),
    ui: (p, cols) => F.sel('mode', p.mode, [['keep', '只保留'], ['drop', '移除']], { label: '保留或移除' }) + F.w('這些欄位') + F.multi('cols', p.cols, cols),
    run(t, p, ctx) {
      if (!p.cols.length) { ctx.warn('還沒選欄位，這塊積木暫時不生效'); return t; }
      const pick = p.cols.map(c => colIdx(t, c));
      const idx = p.mode === 'keep' ? pick : t.cols.map((_, i) => i).filter(i => !pick.includes(i));
      return { cols: idx.map(i => t.cols[i]), rows: t.rows.map(r => idx.map(i => r[i])) };
    },
    py(p) {
      if (!p.cols.length) return [];
      const list = `[${p.cols.map(pyStr).join(', ')}]`;
      return [p.mode === 'keep' ? `df = df[${list}]` : `df = df.drop(columns=${list})`];
    }
  },

  rename: {
    cat: 'cols', label: '改欄位名稱', hint: '幫欄位換一個好懂的名字',
    make: cols => ({ pairs: [{ from: cols[0] || '', to: '' }] }),
    ui(p, cols) {
      const many = p.pairs.length > 1;
      return '<div class="blk-rows">' + p.pairs.map((x, i) => `<div class="blk-row">${F.w('把')}${F.col(`pairs.${i}.from`, x.from, cols)}${F.w('改叫')}${F.txt(`pairs.${i}.to`, x.to, { ph: '新名稱', w: 14 })}${many ? F.del('del-pair', i) : ''}</div>`).join('') + '</div>' + F.add('add-pair', '再改一個');
    },
    acts: {
      'add-pair': (p, i, cols) => { p.pairs.push({ from: cols.find(c => !p.pairs.some(x => x.from === c)) || cols[0] || '', to: '' }); },
      'del-pair': (p, i) => { p.pairs.splice(i, 1); }
    },
    run(t, p) {
      const cols = t.cols.slice();
      for (const x of p.pairs) {
        const to = String(x.to ?? '').trim();
        if (!to) continue;
        cols[colIdx(t, x.from)] = to;
      }
      const dup = cols.find((c, i) => cols.indexOf(c) !== i);
      if (dup) throw new Error(`欄位名稱「${dup}」重複了，請換一個名字`);
      return { cols, rows: t.rows };
    },
    py(p) {
      const ps = p.pairs.filter(x => String(x.to ?? '').trim());
      return ps.length ? [`df = df.rename(columns={${ps.map(x => `${pyStr(x.from)}: ${pyStr(String(x.to).trim())}`).join(', ')}})`] : [];
    }
  },

  /* ===================== 計算 ===================== */
  compute: {
    cat: 'calc', label: '加減乘除', hint: '兩欄（或欄位和數字）相加減乘除，存成新欄位',
    make(cols, kinds) {
      const nums = cols.filter((c, i) => kinds && kinds[i] === 'num');
      return { a: { t: 'col', v: nums[0] || cols[0] || '' }, op: '-', b: { t: 'col', v: nums[1] || nums[0] || cols[0] || '' }, digits: '', name: '' };
    },
    ui: (p, cols) => F.w('新欄位') + F.txt('name', p.name, { ph: '計算結果', w: 10, label: '新欄位名稱' }) + F.w('＝') + operandUI('a', p.a, cols) +
      F.sel('op', p.op, [['+', '＋'], ['-', '－'], ['*', '×'], ['/', '÷']], { cls: 'f-op', label: '運算' }) + operandUI('b', p.b, cols) +
      F.w('小數') + F.sel('digits', p.digits, [['', '不處理'], ['0', '0 位'], ['1', '1 位'], ['2', '2 位'], ['3', '3 位'], ['4', '4 位']], { label: '小數位數' }),
    run(t, p) {
      const A = operand(t, p.a), B = operand(t, p.b), f = ARITH[p.op];
      const d = p.digits === '' || p.digits == null ? null : Number(p.digits);
      return withCol(t, outName('compute', p), r => {
        const x = A(r), y = B(r);
        if (x !== x || y !== y) return '';
        const v = f(x, y);
        if (!Number.isFinite(v)) return '';
        return d == null ? tidy(v) : roundTo(v, d);
      });
    },
    py(p) {
      const e = `${pyOperand(p.a)} ${p.op} ${pyOperand(p.b)}`;
      return [`df[${pyStr(outName('compute', p))}] = ${p.digits === '' || p.digits == null ? e : `(${e}).round(${p.digits})`}`];
    }
  },

  formula: {
    cat: 'calc', label: '自訂公式', hint: '自己寫算式，例：([收盤價] - [開盤價]) / [開盤價] * 100',
    make: () => ({ name: '', expr: '' }),
    ui: (p, cols) => F.w('新欄位') + F.txt('name', p.name, { ph: '公式結果', w: 10, label: '新欄位名稱' }) + F.w('＝') +
      F.txt('expr', p.expr, { ph: '例：([收盤價] - [開盤價]) / [開盤價] * 100', w: 38, cls: 'f-code', label: '公式' }) +
      `<select class="f f-add" data-insert="expr" aria-label="插入欄位"><option value="">＋ 插入欄位</option>${cols.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select>` +
      `<div class="blk-note">可用 + - * / ( )，以及 round(x, 位數)、abs、floor、ceil、sqrt、min、max、pow。欄位名稱請用 [ ] 包起來。</div>`,
    run(t, p, ctx) {
      if (!String(p.expr ?? '').trim()) { ctx.warn('公式還沒寫，這塊積木暫時不生效'); return t; }
      const f = compileFormula(parseFormula(p.expr), t);
      return withCol(t, outName('formula', p), r => { const v = f(r); return Number.isFinite(v) ? tidy(v) : ''; });
    },
    py(p, ctx) {
      if (!String(p.expr ?? '').trim()) return [];
      try { return [`df[${pyStr(outName('formula', p))}] = ${pyFormula(parseFormula(p.expr), ctx.flags)}`]; }
      catch (e) { return [`# 公式有誤：${e.message}`]; }
    }
  },

  round: {
    cat: 'calc', label: '四捨五入', hint: '把數字整理成固定的小數位數',
    make: (cols, kinds) => ({ col: firstNum(cols, kinds), digits: 2, pad: true }),
    ui: (p, cols) => F.w('把') + F.col('col', p.col, cols) + F.w('四捨五入到小數') + F.num('digits', p.digits, { min: 0, w: 5, label: '小數位數' }) + F.w('位') + F.chk('pad', p.pad, '不足的位數補 0（例：24 → 24.00）'),
    run(t, p) {
      const i = colIdx(t, p.col);
      const d = Math.floor(toNum(p.digits));
      if (!(d >= 0 && d <= 10)) throw new Error('小數位數請填 0 到 10');
      return withCol(t, p.col, r => {
        const x = toNum(r[i]);
        if (x !== x) return r[i];
        const v = roundTo(x, d);
        return p.pad ? v.toFixed(d) : v;
      });
    },
    py(p) {
      const L = `df[${pyStr(p.col)}]`, d = Math.floor(toNum(p.digits)) || 0;
      return [p.pad ? `${L} = ${L}.round(${d}).map("{:.${d}f}".format)` : `${L} = ${L}.round(${d})`];
    }
  },

  ifelse: {
    cat: 'calc', label: '如果…就…', hint: '依條件在新欄位填入不同的字',
    make: cols => ({ cond: newCond(cols), then: '是', else: '否', name: '' }),
    ui: (p, cols) => `<div class="blk-rows"><div class="blk-row">${F.w('如果')}${condUI('cond', p.cond, cols)}</div><div class="blk-row">${F.w('就填')}${F.txt('then', p.then, { ph: '符合時', w: 8 })}${F.w('，否則填')}${F.txt('else', p.else, { ph: '不符合時', w: 8 })}${nameUI('ifelse', p)}</div></div>`,
    run(t, p, ctx) {
      const f = compileCond(t, p.cond, ctx);
      if (!f) return t;
      return withCol(t, outName('ifelse', p), r => (f(r) ? p.then : p.else));
    },
    py(p, ctx) {
      if (!condReady(p.cond)) return [];
      ctx.flags.np = true;
      return [`df[${pyStr(outName('ifelse', p))}] = np.where(${pyCond(p.cond)}, ${pyVal(p.then)}, ${pyVal(p.else)})`];
    }
  },

  /* ===================== 文字與日期 ===================== */
  text: {
    cat: 'text', label: '文字處理', hint: '擷取、切開、取代文字',
    make: (cols, kinds) => ({ col: firstText(cols, kinds), fn: 'substr', start: 1, len: 3, sep: ',', part: 1, find: '', rep: '', name: '' }),
    ui(p, cols) {
      let h = F.w('把') + F.col('col', p.col, cols) + F.sel('fn', p.fn, Object.entries(TEXT_FNS).map(([k, v]) => [k, v.label]), { rr: true, label: '處理方式' });
      if (p.fn === 'substr') h += F.w('從第') + F.num('start', p.start, { min: 1, w: 5, label: '起點' }) + F.w('個字開始，取') + F.num('len', p.len, { min: 1, w: 5, label: '長度' }) + F.w('個字');
      if (p.fn === 'split') h += F.w('分隔符號') + F.txt('sep', p.sep, { ph: ',', w: 5 }) + F.w('取第') + F.num('part', p.part, { w: 5, label: '第幾段' }) + F.w('段（-1 是最後一段）');
      if (p.fn === 'replace') h += F.w('把') + F.txt('find', p.find, { ph: '原本的字', w: 9 }) + F.w('換成') + F.txt('rep', p.rep, { ph: '（留空＝刪掉）', w: 11 });
      return h + nameUI('text', p);
    },
    run(t, p, ctx) {
      const i = colIdx(t, p.col);
      let f;
      if (p.fn === 'substr') {
        const s = Math.floor(toNum(p.start)), l = Math.floor(toNum(p.len));
        if (!(s >= 1) || !(l >= 1)) throw new Error('起點和長度都要填大於 0 的整數');
        f = v => toStr(v).substring(s - 1, s - 1 + l);
      } else if (p.fn === 'split') {
        const k = Math.floor(toNum(p.part));
        if (!p.sep) throw new Error('請填分隔符號');
        if (!k) throw new Error('第幾段請填 1、2、3…（或 -1 代表最後一段）');
        f = v => { const a = toStr(v).split(p.sep); const x = k > 0 ? a[k - 1] : a[a.length + k]; return x == null ? '' : x.trim(); };
      } else if (p.fn === 'replace') {
        if (!p.find) { ctx.warn('還沒填要換掉的字，這塊積木暫時不生效'); return t; }
        f = v => toStr(v).split(p.find).join(p.rep ?? '');
      } else if (p.fn === 'trim') f = v => toStr(v).trim();
      else if (p.fn === 'upper') f = v => toStr(v).toUpperCase();
      else if (p.fn === 'lower') f = v => toStr(v).toLowerCase();
      else f = v => toStr(v).length;
      return withCol(t, outName('text', p), r => f(r[i]));
    },
    py(p) {
      const S = `df[${pyStr(p.col)}].astype(str).str`, N = `df[${pyStr(outName('text', p))}]`;
      const s = Math.floor(toNum(p.start)) || 1, l = Math.floor(toNum(p.len)) || 1, k = Math.floor(toNum(p.part)) || 1;
      switch (p.fn) {
        case 'substr': return [`${N} = ${S}[${s - 1}:${s - 1 + l}]`];
        case 'split': return [`${N} = ${S}.split(${pyStr(p.sep)}).str[${k > 0 ? k - 1 : k}].str.strip()`];
        case 'replace': return p.find ? [`${N} = ${S}.replace(${pyStr(p.find)}, ${pyStr(p.rep)}, regex=False)`] : [];
        case 'trim': return [`${N} = ${S}.strip()`];
        case 'upper': return [`${N} = ${S}.upper()`];
        case 'lower': return [`${N} = ${S}.lower()`];
        default: return [`${N} = ${S}.len()`];
      }
    }
  },

  datepart: {
    cat: 'text', label: '拆日期', hint: '從日期取出年、月、日、星期（看得懂 20260401、2026/4/1、民國 115/4/1）',
    make: cols => ({ col: cols.find(c => /日期|date|時間|time|日$/i.test(c)) || cols[0] || '', part: 'month_zh', name: '' }),
    ui: (p, cols) => F.w('從日期欄') + F.col('col', p.col, cols) + F.w('取出') + F.sel('part', p.part, Object.entries(DATE_PARTS).map(([k, v]) => [k, v.label]), { rr: true, label: '要取出的部分' }) + nameUI('datepart', p),
    run(t, p, ctx) {
      const i = colIdx(t, p.col);
      const f = DATE_PARTS[p.part].f;
      let bad = 0;
      const out = withCol(t, outName('datepart', p), r => { const o = parseDate(r[i]); if (!o) { if (!isBlank(r[i])) bad++; return ''; } return f(o); });
      if (bad) ctx.warn(`有 ${fmtInt(bad)} 列看不出日期，已留空`);
      return out;
    },
    py(p, ctx) {
      const N = `df[${pyStr(outName('datepart', p))}]`;
      const head = `_d = pd.to_datetime(df[${pyStr(p.col)}].astype(str), errors="coerce")  # 民國年需先自行轉成西元`;
      const map = {
        year: '_d.dt.year', roc: '_d.dt.year - 1911', month: '_d.dt.month', day: '_d.dt.day',
        month_zh: '_d.dt.month.astype(str) + "月"',
        md: '_d.dt.month.astype(str) + "/" + _d.dt.day.astype(str)',
        ym: '_d.dt.strftime("%Y-%m")', iso: '_d.dt.strftime("%Y-%m-%d")',
        quarter: '"Q" + _d.dt.quarter.astype(str)',
        weekday: '_d.dt.dayofweek.map(dict(enumerate(["週一", "週二", "週三", "週四", "週五", "週六", "週日"])))',
        weekend: 'np.where(_d.dt.dayofweek >= 5, "週末", "平日")'
      };
      if (p.part === 'weekend') ctx.flags.np = true;
      return [head, `${N} = ${map[p.part]}`];
    }
  },

  /* ===================== 統計 ===================== */
  group: {
    cat: 'stat', label: '分組統計', hint: '依類別分組，算加總、平均、筆數…（沒選分組欄位＝整份合計）',
    make: (cols, kinds, ctx) => ({ keys: [bestGroupCol(cols, kinds, ctx.table)].filter(Boolean), aggs: [{ fn: 'sum', col: firstNum(cols, kinds) }] }),
    ui(p, cols) {
      const many = p.aggs.length > 1;
      let h = F.w('依') + F.multi('keys', p.keys, cols) + F.w(p.keys.length ? '分組，每組算出' : '<em>（沒選＝整份資料合計）</em>算出');
      h += '<div class="blk-rows">' + p.aggs.map((a, i) => `<div class="blk-row">${a.fn === 'count' ? '' : F.col(`aggs.${i}.col`, a.col, cols) + F.w('的')}${F.sel(`aggs.${i}.fn`, a.fn, Object.entries(AGG).map(([k, v]) => [k, v.label]), { rr: true, label: '統計方式' })}${many ? F.del('del-agg', i, '移除這個統計項目') : ''}</div>`).join('') + '</div>';
      return h + F.add('add-agg', '再算一項');
    },
    acts: {
      'add-agg': (p, i, cols, kinds) => { p.aggs.push({ fn: 'avg', col: (p.aggs[p.aggs.length - 1] || {}).col || firstNum(cols, kinds) }); },
      'del-agg': (p, i) => { p.aggs.splice(i, 1); }
    },
    run(t, p) {
      const ki = p.keys.map(c => colIdx(t, c));
      const ai = p.aggs.map(a => (a.fn === 'count' ? -1 : colIdx(t, a.col)));
      if (!p.aggs.length) throw new Error('至少要有一個統計項目');
      const names = aggNames(p);
      const groups = new Map();
      for (const r of t.rows) {
        const k = ki.map(i => toStr(r[i]).trim()).join('\u0001');
        let g = groups.get(k);
        if (!g) groups.set(k, (g = { key: ki.map(i => (isBlank(r[i]) ? '(空白)' : toStr(r[i]).trim())), rows: [] }));
        g.rows.push(r);
      }
      if (!ki.length && !groups.size) groups.set('', { key: [], rows: [] });
      const rows = [];
      for (const g of groups.values()) rows.push([...g.key, ...p.aggs.map((a, j) => aggregate(a.fn, g.rows, ai[j]))]);
      return { cols: [...p.keys, ...names], rows };
    },
    py(p) {
      const names = aggNames(p);
      if (!p.keys.length) {
        return [`df = pd.DataFrame([{${p.aggs.map((a, i) => `${pyStr(names[i])}: ${a.fn === 'count' ? 'len(df)' : `df[${pyStr(a.col)}].${AGG[a.fn].py}()`}`).join(', ')}}])`];
      }
      return [
        `df = df.groupby([${p.keys.map(pyStr).join(', ')}], as_index=False, sort=False).agg(**{`,
        ...p.aggs.map((a, i) => `    ${pyStr(names[i])}: (${pyStr(a.fn === 'count' ? p.keys[0] : a.col)}, ${pyStr(AGG[a.fn].py)}),`),
        '})'
      ];
    }
  },

  pivot: {
    cat: 'stat', label: '交叉表', hint: '樞紐分析：一個欄位當列、一個欄位攤開成欄',
    make(cols, kinds) {
      const texts = cols.filter((c, i) => kinds && kinds[i] === 'text');
      return { row: texts[0] || cols[0] || '', col: texts[1] || cols[1] || cols[0] || '', fn: 'sum', val: firstNum(cols, kinds) };
    },
    ui: (p, cols) => F.w('列放') + F.col('row', p.row, cols) + F.w('，欄放') + F.col('col', p.col, cols) + F.w('，格子裡算') +
      (p.fn === 'count' ? '' : F.col('val', p.val, cols) + F.w('的')) + F.sel('fn', p.fn, Object.entries(AGG).map(([k, v]) => [k, v.label]), { rr: true, label: '統計方式' }),
    run(t, p) {
      const ri = colIdx(t, p.row), ci = colIdx(t, p.col), vi = p.fn === 'count' ? -1 : colIdx(t, p.val);
      const rowKeys = new Map(), colKeys = new Set();
      for (const r of t.rows) {
        const rk = isBlank(r[ri]) ? '(空白)' : toStr(r[ri]).trim();
        const ck = isBlank(r[ci]) ? '(空白)' : toStr(r[ci]).trim();
        colKeys.add(ck);
        if (colKeys.size > 200) throw new Error('「欄」的種類超過 200 種，太多了；請換一個種類較少的欄位');
        let m = rowKeys.get(rk);
        if (!m) rowKeys.set(rk, (m = new Map()));
        let cell = m.get(ck);
        if (!cell) m.set(ck, (cell = []));
        cell.push(r);
      }
      const cks = [...colKeys].sort((a, b) => { const x = ordVals(a, b); return Number.isNaN(x) ? collator.compare(a, b) : x; });
      const used = new Set([p.row]);
      const cols = [p.row, ...cks.map(c => uniqueName(c, used))];
      const rows = [];
      for (const [rk, m] of rowKeys) rows.push([rk, ...cks.map(ck => (m.has(ck) ? aggregate(p.fn, m.get(ck), vi) : ''))]);
      return { cols, rows };
    },
    py: p => [`df = df.pivot_table(index=${pyStr(p.row)}, columns=${pyStr(p.col)}, values=${pyStr(p.fn === 'count' ? p.row : p.val)}, aggfunc=${pyStr(AGG[p.fn].py)}, sort=False).reset_index()`]
  },

  /* ===================== 多份資料 ===================== */
  join: {
    cat: 'multi', label: '左右合併', hint: '用共同的欄位（例如代號）把另一份資料的欄位接到右邊',
    make: (cols, kinds, ctx) => {
      const others = ctx.datasets.filter(d => d.id !== ctx.srcId);
      // 挑和目前表格「共同欄名最多」的那一份
      const shared_n = d => d.cols.filter(c => cols.includes(c)).length;
      const other = others.slice().sort((a, b) => shared_n(b) - shared_n(a))[0];
      const shared = other ? cols.find(c => other.cols.includes(c)) : '';
      return { ds: other ? other.id : '', left: shared || cols[0] || '', right: shared || (other ? other.cols[0] : ''), how: 'inner' };
    },
    ui(p, cols, ctx) {
      const other = ctx.datasets.find(d => d.id === p.ds);
      const dsOpts = [['', '選一份資料…'], ...ctx.datasets.map(d => [d.id, d.name])];
      if (p.ds && !other) dsOpts.push([p.ds, '⚠ ' + p.ds.slice(2) + '（尚未載入）']);
      return F.w('和') + F.sel('ds', p.ds, dsOpts, { rr: true, label: '另一份資料' }) + F.w('合併：這邊的') + F.col('left', p.left, cols) + F.w('對上它的') +
        F.col('right', p.right, other ? other.cols : [], { label: '另一份資料的欄位' }) + F.sel('how', p.how, [['inner', '只留兩邊都有的列'], ['left', '這邊的列全部保留']], { label: '合併方式' }) +
        (ctx.datasets.length < 2 ? '<div class="blk-note">需要先在上方「資料」區再載入一份檔案。</div>' : '');
    },
    run(t, p, ctx) {
      const R = ctx.dataset(p.ds);
      if (!R) throw new Error('請先選要合併的另一份資料');
      const li = colIdx(t, p.left), ri = colIdx(R, p.right);
      const index = new Map();
      for (const r of R.rows) {
        const k = toStr(r[ri]).trim();
        if (k === '') continue;
        const a = index.get(k);
        if (a) a.push(r); else index.set(k, [r]);
      }
      const rIdx = R.cols.map((_, i) => i).filter(i => i !== ri);
      const used = new Set(t.cols);
      const cols = [...t.cols, ...rIdx.map(i => uniqueName(R.cols[i], used))];
      const blanks = rIdx.map(() => '');
      const rows = [];
      for (const l of t.rows) {
        const hit = index.get(toStr(l[li]).trim());
        if (hit) { for (const m of hit) rows.push([...l, ...rIdx.map(i => m[i])]); }
        else if (p.how === 'left') rows.push([...l, ...blanks]);
        if (rows.length > 2000000) throw new Error('合併後超過 200 萬列，對應欄位可能選錯了');
      }
      return { cols, rows };
    },
    py(p, ctx) {
      if (!p.ds) return [];
      const v = ctx.dsVar(p.ds);
      const on = p.left === p.right ? `on=${pyStr(p.left)}` : `left_on=${pyStr(p.left)}, right_on=${pyStr(p.right)}`;
      return [`df = df.merge(${v}, ${on}, how=${pyStr(p.how)}, suffixes=("", "_2"))`];
    }
  },

  append: {
    cat: 'multi', label: '上下串接', hint: '把其他檔案的列接在下面（例如每個月一份的資料）',
    make: (cols, kinds, ctx) => ({ ds: ctx.datasets.filter(d => d.id !== ctx.srcId && d.cols.length === cols.length && d.cols.every(c => cols.includes(c))).map(d => d.id), tag: true }),
    ui(p, cols, ctx) {
      const ids = ctx.datasets.filter(d => d.id !== ctx.srcId).map(d => d.id);
      const name = id => { const d = ctx.datasets.find(x => x.id === id); return d ? d.name : id.slice(2) + '（尚未載入）'; };
      return F.w('把') + F.multi('ds', p.ds, ids, { name, add: '＋ 資料' }) + F.w('的列接在下面') + F.chk('tag', p.tag, '加一欄「來源檔案」標示每列來自哪個檔') +
        (ctx.datasets.length < 2 ? '<div class="blk-note">需要先在上方「資料」區再載入一份檔案。</div>' : '');
    },
    run(t, p, ctx) {
      if (!p.ds.length) { ctx.warn('還沒選要串接的資料，這塊積木暫時不生效'); return t; }
      const others = p.ds.map(id => { const d = ctx.dataset(id); if (!d) throw new Error(`「${id.slice(2)}」還沒載入`); return d; });
      const cols = t.cols.slice();
      const TAG = '來源檔案';
      let tagIdx = cols.indexOf(TAG);
      const tagNew = p.tag && tagIdx === -1;
      if (tagNew) { tagIdx = cols.length; cols.push(TAG); }
      const pos = new Map(cols.map((c, i) => [c, i]));
      for (const d of others) for (const c of d.cols) if (!pos.has(c)) { pos.set(c, cols.length); cols.push(c); }
      const w = cols.length;
      const rows = [];
      for (const r of t.rows) {
        const o = r.slice();
        while (o.length < w) o.push('');
        if (tagNew) o[tagIdx] = ctx.sourceName;
        rows.push(o);
      }
      for (const d of others) {
        const map = d.cols.map(c => pos.get(c));
        for (const r of d.rows) {
          const o = new Array(w).fill('');
          for (let i = 0; i < map.length; i++) o[map[i]] = r[i];
          if (p.tag) o[tagIdx] = d.name;
          rows.push(o);
        }
      }
      return { cols, rows };
    },
    py(p, ctx) {
      if (!p.ds.length) return [];
      const parts = p.tag
        ? [`df.assign(來源檔案=${pyStr(ctx.sourceName)})`, ...p.ds.map(id => `${ctx.dsVar(id)}.assign(來源檔案=${pyStr(ctx.dsName(id))})`)]
        : ['df', ...p.ds.map(id => ctx.dsVar(id))];
      return [`df = pd.concat([${parts.join(', ')}], ignore_index=True)`];
    }
  },

  /* ===================== 新增：每組前幾名／組內統計 ===================== */
  grouptop: {
    cat: 'stat', label: '每組前幾名', hint: '分組後，每組只留數值最大（或最小）的幾列。例：每個月人數最多的那一天',
    make: (cols, kinds, ctx) => ({ keys: [bestGroupCol(cols, kinds, ctx.table)].filter(Boolean), col: firstNum(cols, kinds), dir: 'desc', n: 1 }),
    ui: (p, cols) => F.w('依') + F.multi('keys', p.keys, cols) + F.w(p.keys.length ? '分組，每組留下' : '<em>（沒選＝整份資料）</em>留下') + F.col('col', p.col, cols) +
      F.sel('dir', p.dir, [['desc', '最大'], ['asc', '最小']], { label: '最大或最小' }) + F.w('的') + F.num('n', p.n, { min: 1, w: 5, label: '列數' }) + F.w('列'),
    run(t, p) {
      const ki = p.keys.map(c => colIdx(t, c)), ci = colIdx(t, p.col);
      const n = Math.floor(toNum(p.n));
      if (!(n >= 1)) throw new Error('請填每組要留幾列');
      const groups = new Map();
      for (const r of t.rows) {
        const k = ki.map(i => toStr(r[i]).trim()).join('\u0001');
        const g = groups.get(k);
        if (g) g.push(r); else groups.set(k, [r]);
      }
      const d = p.dir === 'asc' ? 1 : -1;
      const rows = [];
      for (const g of groups.values()) {
        const list = [];
        g.forEach((r, i) => { const x = toNum(r[ci]); if (x === x) list.push({ r, x, i }); });
        list.sort((a, b) => (a.x - b.x) * d || a.i - b.i);
        for (let k = 0; k < n && k < list.length; k++) rows.push(list[k].r);
      }
      return { cols: t.cols, rows };
    },
    py(p) {
      const n = Math.floor(toNum(p.n)) || 1;
      const sorted = `df.sort_values(${pyStr(p.col)}, ascending=${p.dir === 'asc' ? 'True' : 'False'})`;
      return [p.keys.length ? `df = ${sorted}.groupby([${p.keys.map(pyStr).join(', ')}], sort=False).head(${n})` : `df = ${sorted}.head(${n})`];
    }
  },

  transform: {
    cat: 'stat', label: '組內統計', hint: '在每一列旁邊補上「它那一組」的加總、平均、最大值…。例：補上當月最高值，再篩選出等於它的那一天',
    make: (cols, kinds, ctx) => ({ keys: [bestGroupCol(cols, kinds, ctx.table)].filter(Boolean), col: firstNum(cols, kinds), fn: 'max', name: '' }),
    ui: (p, cols) => F.w('依') + F.multi('keys', p.keys, cols) + F.w(p.keys.length ? '分組，每一列補上同組' : '<em>（沒選＝整份資料）</em>每一列補上全部') +
      (p.fn === 'count' ? '' : F.col('col', p.col, cols) + F.w('的')) + F.sel('fn', p.fn, Object.entries(AGG).map(([k, v]) => [k, v.label]), { rr: true, label: '統計方式' }) + nameUI('transform', p),
    run(t, p) {
      const ki = p.keys.map(c => colIdx(t, c)), ci = p.fn === 'count' ? -1 : colIdx(t, p.col);
      const keyOf = r => ki.map(i => toStr(r[i]).trim()).join('\u0001');
      const groups = new Map();
      for (const r of t.rows) { const k = keyOf(r); const g = groups.get(k); if (g) g.push(r); else groups.set(k, [r]); }
      const val = new Map();
      for (const [k, g] of groups) val.set(k, aggregate(p.fn, g, ci));
      return withCol(t, outName('transform', p), r => val.get(keyOf(r)));
    },
    py(p) {
      const N = `df[${pyStr(outName('transform', p))}]`;
      if (!p.keys.length) return [`${N} = ${p.fn === 'count' ? 'len(df)' : `df[${pyStr(p.col)}].${AGG[p.fn].py}()`}`];
      return [`${N} = df.groupby([${p.keys.map(pyStr).join(', ')}])[${pyStr(p.fn === 'count' ? p.keys[0] : p.col)}].transform(${pyStr(AGG[p.fn].py)})`];
    }
  },

  /* ===================== 新增：橫向統計／分級 ===================== */
  rowcalc: {
    cat: 'calc', label: '橫向統計', hint: '同一列裡，把好幾個欄位加總或平均。可以用「名稱結尾是 小計」一次選一批欄位',
    make: () => ({ mode: 'pick', cols: [], pat: '', fn: 'sum', name: '' }),
    ui: (p, cols) => F.w('每一列把') + colPickUI(p, cols) + F.sel('fn', p.fn, [['sum', '加總'], ['avg', '平均'], ['max', '取最大'], ['min', '取最小'], ['n', '數有幾格是數字']], { rr: true, label: '算法' }) + nameUI('rowcalc', p),
    run(t, p, ctx) {
      const name = outName('rowcalc', p);
      const idx = pickCols(t, p, ctx).filter(i => t.cols[i] !== name);
      if (!idx.length) return t;
      return withCol(t, name, r => {
        let n = 0, s = 0, mx = -Infinity, mn = Infinity;
        for (const i of idx) { const x = toNum(r[i]); if (x === x) { n++; s += x; if (x > mx) mx = x; if (x < mn) mn = x; } }
        if (p.fn === 'n') return n;
        if (!n) return '';
        return p.fn === 'sum' ? tidy(s) : p.fn === 'avg' ? tidy(s / n) : p.fn === 'max' ? mx : mn;
      });
    },
    py(p) {
      const f = { sum: 'sum', avg: 'mean', max: 'max', min: 'min', n: 'count' }[p.fn];
      return [`_cols = ${pyColPick(p)}`, `df[${pyStr(outName('rowcalc', p))}] = df[_cols].${f}(axis=1)`];
    }
  },

  bin: {
    cat: 'calc', label: '分級', hint: '依數字大小分成幾級。例：50 以下「良好」、51 到 100「普通」、超過 100「不佳」',
    make: (cols, kinds) => ({ col: firstNum(cols, kinds), cuts: '', labels: '', name: '' }),
    ui: (p, cols) => F.w('依') + F.col('col', p.col, cols) + F.w('分級，分界點') + F.txt('cuts', p.cuts, { ph: '例：50,100', w: 11, label: '分界點' }) + F.w('各級名稱') +
      F.txt('labels', p.labels, { ph: '例：良好,普通,不佳（可留空）', w: 24, label: '各級名稱' }) + nameUI('bin', p),
    run(t, p, ctx) {
      const i = colIdx(t, p.col);
      const cuts = splitList(p.cuts).map(toNum);
      if (!cuts.length) { ctx.warn('分界點還沒填，這塊積木暫時不生效'); return t; }
      if (cuts.some(Number.isNaN)) throw new Error('分界點請填數字，用逗號分隔');
      cuts.sort((a, b) => a - b);
      let labels = splitList(p.labels);
      if (labels.length && labels.length !== cuts.length + 1) throw new Error(`${cuts.length} 個分界點會分成 ${cuts.length + 1} 級，名稱也要填 ${cuts.length + 1} 個`);
      if (!labels.length) labels = [`${cuts[0]} 以下`, ...cuts.slice(1).map((c, k) => `${cuts[k]}~${c}`), `超過 ${cuts[cuts.length - 1]}`];
      return withCol(t, outName('bin', p), r => {
        const x = toNum(r[i]);
        if (x !== x) return '';
        let k = 0;
        while (k < cuts.length && x > cuts[k]) k++;
        return labels[k];
      });
    },
    py(p, ctx) {
      const cuts = splitList(p.cuts).map(toNum).filter(x => x === x).sort((a, b) => a - b);
      if (!cuts.length) return [];
      ctx.flags.np = true;
      const labels = splitList(p.labels);
      return [`df[${pyStr(outName('bin', p))}] = pd.cut(df[${pyStr(p.col)}], bins=[-np.inf, ${cuts.join(', ')}, np.inf]${labels.length === cuts.length + 1 ? `, labels=[${labels.map(pyStr).join(', ')}]` : ''})`];
    }
  },

  /* ===================== 新增：欄轉列／合併文字／編號 ===================== */
  melt: {
    cat: 'cols', label: '欄轉列', hint: '把一排欄位「攤直」成兩欄（項目、數值），方便接著分組統計。例：把各機場的欄位轉成「機場、人數」',
    make: () => ({ mode: 'pick', cols: [], pat: '', key: '項目', val: '數值' }),
    ui: (p, cols) => F.w('把') + colPickUI(p, cols) + F.w('攤直成兩欄：欄名放進') + F.txt('key', p.key, { ph: '項目', w: 7, label: '放欄名的新欄位' }) + F.w('，內容放進') + F.txt('val', p.val, { ph: '數值', w: 7, label: '放內容的新欄位' }),
    run(t, p, ctx) {
      const idx = pickCols(t, p, ctx);
      if (!idx.length) return t;
      const keep = t.cols.map((_, i) => i).filter(i => !idx.includes(i));
      const key = String(p.key ?? '').trim() || '項目', val = String(p.val ?? '').trim() || '數值';
      const names = keep.map(i => t.cols[i]);
      if (key === val || names.includes(key) || names.includes(val)) throw new Error('新欄位的名稱和現有欄位重複了，請換一個名字');
      if (t.rows.length * idx.length > 2000000) throw new Error('攤直後會超過 200 萬列，請先篩選或少選幾欄');
      const rows = [];
      for (const r of t.rows) { const base = keep.map(i => r[i]); for (const i of idx) rows.push([...base, t.cols[i], r[i]]); }
      return { cols: [...names, key, val], rows };
    },
    py(p) {
      const key = String(p.key ?? '').trim() || '項目', val = String(p.val ?? '').trim() || '數值';
      return [`_cols = ${pyColPick(p)}`, `df = df.melt(id_vars=[c for c in df.columns if c not in _cols], value_vars=_cols, var_name=${pyStr(key)}, value_name=${pyStr(val)})`];
    }
  },

  concat: {
    cat: 'text', label: '合併文字', hint: '把幾個欄位的內容接成一欄。例：縣市＋行政區',
    make: () => ({ cols: [], sep: '', name: '' }),
    ui: (p, cols) => F.w('把') + F.multi('cols', p.cols, cols) + F.w('的內容接起來，中間放') + F.txt('sep', p.sep, { ph: '（可留空）', w: 7, label: '分隔符號' }) + nameUI('concat', p),
    run(t, p, ctx) {
      if (!p.cols.length) { ctx.warn('還沒選欄位，這塊積木暫時不生效'); return t; }
      const idx = p.cols.map(c => colIdx(t, c));
      const sep = p.sep ?? '';
      return withCol(t, outName('concat', p), r => idx.map(i => toStr(r[i]).trim()).join(sep));
    },
    py: p => (p.cols.length ? [`df[${pyStr(outName('concat', p))}] = ${p.cols.map(c => `df[${pyStr(c)}].astype(str)`).join(` + ${pyStr(p.sep ?? '')} + `)}`] : [])
  },

  rowno: {
    cat: 'order', label: '加上編號', hint: '在最前面加一欄 1、2、3…（排序之後再加，就是名次）',
    make: () => ({ name: '編號' }),
    ui: p => F.w('在最前面加一欄') + F.txt('name', p.name, { ph: '編號', w: 7, label: '編號欄的名稱' }) + F.w('，從 1 開始編號'),
    run(t, p) {
      const name = String(p.name ?? '').trim() || '編號';
      if (t.cols.includes(name)) throw new Error(`已經有「${name}」這個欄位了，請換一個名字`);
      return { cols: [name, ...t.cols], rows: t.rows.map((r, i) => [i + 1, ...r]) };
    },
    py: p => [`df.insert(0, ${pyStr(String(p.name ?? '').trim() || '編號')}, range(1, len(df) + 1))`]
  },

  /* ===================== 新增：清理 ===================== */
  clean: {
    cat: 'clean', label: '清成數字', hint: '去掉單位、逗號、百分比等符號，只留數字。例：「1,234 元」→ 1234、「45%」→ 45',
    make: (cols, kinds) => ({ col: firstText(cols, kinds) }),
    ui: (p, cols) => F.w('把') + F.col('col', p.col, cols) + F.w('裡的單位和符號去掉，只留數字'),
    run(t, p, ctx) {
      const i = colIdx(t, p.col);
      let bad = 0;
      const out = withCol(t, p.col, r => {
        const v = r[i];
        if (isBlank(v)) return '';
        if (typeof v === 'number') return v;
        const s = toStr(v).replace(/[０-９．－]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0)).replace(/[^\d.\-]/g, '');
        const x = s === '' ? NaN : Number(s);
        if (x !== x) { bad++; return ''; }
        return x;
      });
      if (bad) ctx.warn(`有 ${fmtInt(bad)} 格清不出數字，已留空`);
      return out;
    },
    py: p => [`df[${pyStr(p.col)}] = pd.to_numeric(df[${pyStr(p.col)}].astype(str).str.replace(r"[^\\d.\\-]", "", regex=True), errors="coerce")`]
  },

  fill: {
    cat: 'clean', label: '補空白', hint: '把空白的格子補上固定的值，或沿用上一列的值（有合併儲存格的報表常用）',
    make: cols => ({ col: cols[0] || '', how: 'value', val: '0' }),
    ui: (p, cols) => F.w('把') + F.col('col', p.col, cols) + F.w('的空白') + F.sel('how', p.how, [['value', '填入'], ['prev', '沿用上一列的值'], ['next', '沿用下一列的值']], { rr: true, label: '補法' }) +
      (p.how === 'value' ? F.txt('val', p.val, { ph: '要填的值', w: 8 }) : ''),
    run(t, p) {
      const i = colIdx(t, p.col);
      const n = t.rows.length;
      const out = new Array(n);
      if (p.how === 'value') for (let k = 0; k < n; k++) out[k] = isBlank(t.rows[k][i]) ? (p.val ?? '') : t.rows[k][i];
      else if (p.how === 'prev') { let last = ''; for (let k = 0; k < n; k++) { if (!isBlank(t.rows[k][i])) last = t.rows[k][i]; out[k] = last; } }
      else { let last = ''; for (let k = n - 1; k >= 0; k--) { if (!isBlank(t.rows[k][i])) last = t.rows[k][i]; out[k] = last; } }
      return withCol(t, p.col, (r, k) => out[k]);
    },
    py(p) {
      const L = `df[${pyStr(p.col)}]`;
      return [p.how === 'value' ? `${L} = ${L}.fillna(${pyVal(p.val)})` : `${L} = ${L}.${p.how === 'prev' ? 'ffill' : 'bfill'}()`];
    }
  },

  /* ===================== 新增：註解 ===================== */
  note: {
    cat: 'misc', label: '註解', hint: '寫給自己或別人看的說明，不會影響結果',
    make: () => ({ text: '' }),
    ui: p => F.txt('text', p.text, { ph: '寫下這一段在做什麼…', w: 46, cls: 'f-note', label: '註解內容' }),
    run: t => t,
    py: p => (String(p.text ?? '').trim() ? [`# ${String(p.text).trim().replace(/\s+/g, ' ')}`] : [])
  }
};

/* ---------- 執行整個程式 ---------- */

/**
 * @param src      來源表格 {name, cols, rows}
 * @param blocks   [{id, type, off, p}]
 * @param getDs    id => 資料集
 * @param cursor   預覽到哪一塊積木（null = 全部執行）
 * @returns {table, info: Map(id → {inCols, rows, ncols, error, warn, skipped}), stop}
 */
function runProgram(src, blocks, getDs, cursor) {
  let t = { cols: src.cols, rows: src.rows };
  const info = new Map();
  let stop = null;
  for (const b of blocks) {
    const it = { inCols: t.cols, inKinds: null };
    info.set(b.id, it);
    if (stop) { it.skipped = true; continue; }
    if (!b.off) {
      const warns = [];
      const ctx = { dataset: getDs, sourceName: src.name, warn: m => warns.push(m) };
      try {
        t = BLOCKS[b.type].run(t, b.p, ctx);
        it.rows = t.rows.length;
        it.ncols = t.cols.length;
        if (warns.length) it.warn = warns[0];
      } catch (e) {
        it.error = (e && e.message) || String(e);
        stop = { why: 'error', id: b.id };
        continue;
      }
    }
    if (cursor === b.id) stop = { why: 'cursor', id: b.id };
  }
  return { table: t, info, stop };
}

/* ---------- 產生 pandas 程式碼 ---------- */

function pyReader(name) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  const base = name.split(' › ')[0];
  if (ext === 'json') return `pd.read_json(${pyStr(base)})`;
  if (/^xls/.test(ext) || name.includes(' › ')) {
    const sheet = name.includes(' › ') ? `, sheet_name=${pyStr(name.split(' › ')[1])}` : '';
    return `pd.read_excel(${pyStr(base)}${sheet})`;
  }
  if (ext === 'tsv') return `pd.read_csv(${pyStr(base)}, sep="\\t", thousands=",")`;
  return `pd.read_csv(${pyStr(base)}, thousands=",")`;
}

function toPython(src, blocks, datasets) {
  const flags = { np: false };
  const vars = new Map();
  const ctx = {
    flags,
    sourceName: src.name,
    dsName: id => { const d = datasets.find(x => x.id === id); return d ? d.name : id.slice(2); },
    dsVar: id => { if (!vars.has(id)) vars.set(id, `df${vars.size + 2}`); return vars.get(id); }
  };
  const body = [];
  for (const b of blocks) {
    if (b.off) continue;
    let lines;
    try { lines = BLOCKS[b.type].py(b.p, ctx); } catch (e) { lines = [`# 這塊積木還沒設定好`]; }
    if (lines.length) body.push(`# ${BLOCKS[b.type].label}`, ...lines);
  }
  const out = ['import pandas as pd'];
  if (flags.np) out.push('import numpy as np');
  out.push('', `df = ${pyReader(src.name)}`);
  for (const [id, v] of vars) out.push(`${v} = ${pyReader(ctx.dsName(id))}`);
  if (body.length) out.push('', ...body);
  out.push('', 'print(df)');
  return out.join('\n');
}
