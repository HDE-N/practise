/* ---------- 提示訊息 ---------- */
function toast(msg, type = 'info', ms = 3400) {
  const layer = $('#toasts');
  const el = document.createElement('div');
  el.className = `toast is-${type}`;
  if (type === 'error') el.setAttribute('role', 'alert');
  el.innerHTML = `${type === 'success' ? ICON.check : type === 'error' ? ICON.alert : ICON.info}<span>${esc(msg)}</span>`;
  layer.appendChild(el);
  while (layer.children.length > 4) layer.firstChild.remove();
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 350); }, ms);
}

/* ---------- 彈出選單 ---------- */
const pop = { anchor: null, onPick: null, at: 0 };
function openPop(anchor, html, onPick) {
  const el = $('#pop');
  el.innerHTML = html;
  el.hidden = false;
  pop.anchor = anchor;
  pop.onPick = onPick;
  pop.at = performance.now();
  const a = anchor.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = Math.min(a.left, window.innerWidth - w - 8);
  let top = a.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, a.top - h - 6);
  el.style.left = Math.max(8, left) + 'px';
  el.style.top = top + 'px';
  const first = el.querySelector('input, button');
  if (first) first.focus({ preventScroll: true });
}
function closePop(refocus) {
  const el = $('#pop');
  if (!el || el.hidden) return;
  el.hidden = true;
  el.innerHTML = '';
  if (refocus && pop.anchor && document.contains(pop.anchor)) pop.anchor.focus({ preventScroll: true });
  pop.anchor = null;
  pop.onPick = null;
}
function initPop() {
  const el = $('#pop');
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-v]');
    if (!b || !pop.onPick) return;
    const fn = pop.onPick;
    const v = b.dataset.v;
    closePop();
    fn(v);
  });
  document.addEventListener('pointerdown', e => {
    if (el.hidden) return;
    if (el.contains(e.target) || (pop.anchor && pop.anchor.contains(e.target))) return;
    closePop();
  }, true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !el.hidden) { e.stopPropagation(); closePop(true); } }, true);
  window.addEventListener('resize', () => closePop());
}

/* ---------- 剪貼簿與下載 ---------- */
async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* 改用舊方法 */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

function download(name, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const htmlToEl = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 對話框（不用 <dialog>，自訂游標才不會被蓋住） ---------- */
const modal = { prev: null };
function openModal(html, label, cls) {
  closePop();
  const m = $('#modal');
  if (m.hidden) modal.prev = document.activeElement;
  m.innerHTML = `<div class="modal-box${cls ? ' ' + cls : ''}" role="dialog" aria-modal="true" aria-label="${esc(label || '')}">${html}</div>`;
  m.hidden = false;
  const f = m.querySelector('[data-autofocus]') || m.querySelector('input, select, button');
  if (f) f.focus({ preventScroll: true });
}
function closeModal() {
  const m = $('#modal');
  if (m.hidden) return;
  m.hidden = true;
  m.innerHTML = '';
  if (modal.prev && document.contains(modal.prev)) modal.prev.focus({ preventScroll: true });
  modal.prev = null;
}
function initModal() {
  const m = $('#modal');
  m.addEventListener('pointerdown', e => { if (e.target === m) closeModal(); });
  m.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModal(); });
  document.addEventListener('keydown', e => {
    if (m.hidden) return;
    if (e.key === 'Escape') { e.stopPropagation(); closeModal(); return; }
    if (e.key !== 'Tab') return;
    const list = $$('button:not(:disabled), input, select, textarea, [tabindex="0"]', m).filter(x => x.offsetParent !== null);
    if (!list.length) return;
    const first = list[0], last = list[list.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    else if (!m.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
  }, true);
}

/* ======================================================================
 * 特效：十字游標、會跟著滑鼠發光的蜂巢背景
 * 側欄下方可以關掉；觸控裝置不啟用游標
 * ==================================================================== */
const fx = {
  on: store.get('fx') !== 'off',
  ripple() {},          // 由背景提供：fx.ripple(x, y, 'ok' | 'bad' | 'gold', 強度)
  start() {},
  stop() {}
};

function initCursor() {
  if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  const cur = $('#cur'), ring = $('#cur-ring');
  const root = document.documentElement;
  const HOT = 'a[href], button, select, summary, [role="tab"], input[type="checkbox"], input[type="radio"], label.f-chk, .ds-main, [data-grip], .pal-item';
  const TEXT = 'textarea, input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="button"])';
  let x = 0, y = 0, rx = 0, ry = 0, raf = 0, lastTarget = null;

  const setMode = t => {
    lastTarget = t;
    const el = t && t.closest ? t : null;
    const text = el && el.closest(TEXT);
    const hotEl = !text && el ? el.closest(HOT) : null;
    const hot = !!hotEl && !hotEl.disabled;
    cur.classList.toggle('is-text', !!text);
    cur.classList.toggle('is-hot', hot);
    ring.classList.toggle('is-hot', hot);
  };
  const show = on => { cur.classList.toggle('on', on); ring.classList.toggle('on', on); };
  const loop = () => {
    rx += (x - rx) * 0.22; ry += (y - ry) * 0.22;
    ring.style.transform = `translate3d(${rx}px, ${ry}px, 0)`;
    raf = Math.abs(x - rx) + Math.abs(y - ry) > 0.3 ? requestAnimationFrame(loop) : 0;
  };

  window.addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || !fx.on) return;
    x = e.clientX; y = e.clientY;
    cur.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    if (!cur.classList.contains('on')) { rx = x; ry = y; show(true); }   // 以 class 為準：特效關掉再打開後也能重新出現
    if (e.target !== lastTarget) setMode(e.target);
    if (!raf) raf = requestAnimationFrame(loop);
  }, { passive: true });
  window.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || !fx.on) return;
    cur.classList.add('is-down'); ring.classList.add('is-down');
    // 原生下拉選單打開後收不到滑鼠事件，先把十字藏起來，免得停在原地
    if (e.target.tagName === 'SELECT') show(false);
  }, true);
  window.addEventListener('pointerup', () => { cur.classList.remove('is-down'); ring.classList.remove('is-down'); }, true);
  root.addEventListener('mouseleave', () => show(false));
  window.addEventListener('blur', () => show(false));
  // 畫面重畫後，游標底下的元素可能換了
  new MutationObserver(() => { lastTarget = null; }).observe(document.body, { childList: true, subtree: true });
}

function initBackdrop() {
  const baseCv = $('#bg-base'), cv = $('#bg-hex');
  if (!cv || !cv.getContext) return;
  const bctx = baseCv.getContext('2d'), ctx = cv.getContext('2d');
  const R = 30;                       // 六角形半徑
  const WAVE = [[255, 200, 61], [255, 79, 163], [155, 123, 255], [63, 227, 255]];
  const TINT = { ok: [62, 230, 160], bad: [255, 86, 112], gold: [255, 200, 61] };
  let W = 0, H = 0, dpr = 1, pts = new Float32Array(0), heat = new Float32Array(0), tint = [], raf = 0, last = 0;
  const mouse = { x: -9999, y: -9999 };
  let ripples = [];

  const hexPath = (c, x, y, r) => {
    c.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = (Math.PI / 180) * (60 * k - 30);
      const px = x + r * Math.cos(a), py = y + r * Math.sin(a);
      if (k) c.lineTo(px, py); else c.moveTo(px, py);
    }
    c.closePath();
  };
  const waveColor = (x, y, t) => {
    const u = (((x + y) / 900 + t / 9000) % 1 + 1) % 1 * WAVE.length;
    const i = Math.floor(u), f = u - i, a = WAVE[i % WAVE.length], b = WAVE[(i + 1) % WAVE.length];
    return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, a[2] + (b[2] - a[2]) * f];
  };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    for (const c of [baseCv, cv]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
    const w = Math.sqrt(3) * R, h = 1.5 * R, list = [];
    for (let row = 0, y = 0; y < H + R; row++, y = row * h) for (let x = row & 1 ? w / 2 : 0; x < W + w; x += w) list.push(x, y);
    pts = new Float32Array(list);
    heat = new Float32Array(list.length / 2);
    tint = new Array(list.length / 2).fill(null);
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bctx.clearRect(0, 0, W, H);
    bctx.lineWidth = 1;
    bctx.strokeStyle = 'rgba(155, 123, 255, .11)';
    for (let i = 0; i < pts.length; i += 2) { hexPath(bctx, pts[i], pts[i + 1], R - 2.5); bctx.stroke(); }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
  }

  function frame(t) {
    raf = 0;
    if (!fx.on || document.hidden) return;
    raf = requestAnimationFrame(frame);
    if (t - last < 32) return;          // 約 30 fps 就夠了
    last = t;
    ctx.clearRect(0, 0, W, H);
    ripples = ripples.filter(r => (t - r.t0) * r.speed < r.max);
    if (Math.random() < 0.3 && heat.length) { const k = (Math.random() * heat.length) | 0; if (heat[k] < 0.3) { heat[k] = 0.3 + Math.random() * 0.25; tint[k] = null; } }
    for (let i = 0, n = heat.length; i < n; i++) {
      const x = pts[2 * i], y = pts[2 * i + 1];
      let hv = heat[i] * 0.93;
      const dx = x - mouse.x, dy = y - mouse.y, d2 = dx * dx + dy * dy;
      if (d2 < 19600) { const f = 1 - Math.sqrt(d2) / 140; if (f * f > hv) { hv = f * f; tint[i] = null; } }
      for (const r of ripples) {
        const front = (t - r.t0) * r.speed;
        const k = 1 - Math.abs(Math.hypot(x - r.x, y - r.y) - front) / 70;
        if (k > 0) { const v = k * r.power * (1 - front / r.max); if (v > hv) { hv = v; tint[i] = r.color; } }
      }
      heat[i] = hv;
      if (hv < 0.03) continue;
      const c = tint[i] || waveColor(x, y, t);
      hexPath(ctx, x, y, R - 2.5);
      ctx.fillStyle = `rgba(${c[0] | 0}, ${c[1] | 0}, ${c[2] | 0}, ${Math.min(0.42, hv * 0.42)})`;
      ctx.fill();
      ctx.strokeStyle = `rgba(${c[0] | 0}, ${c[1] | 0}, ${c[2] | 0}, ${Math.min(0.95, hv)})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }

  fx.start = () => { if (!raf && fx.on && !reduceMotion()) raf = requestAnimationFrame(frame); };
  fx.stop = () => { cancelAnimationFrame(raf); raf = 0; ctx.clearRect(0, 0, W, H); heat.fill(0); };
  fx.ripple = (x, y, color = 'gold', power = 1) => {
    if (!fx.on || reduceMotion()) return;
    ripples.push({ x, y, t0: performance.now(), speed: 0.9, max: Math.hypot(W, H) * (0.35 + 0.4 * Math.min(1, power)), power: Math.min(1.4, power), color: TINT[color] || null });
    if (ripples.length > 6) ripples.shift();
  };

  window.addEventListener('resize', debounce(resize, 150));
  window.addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  document.documentElement.addEventListener('mouseleave', () => { mouse.x = mouse.y = -9999; });
  window.addEventListener('pointerdown', e => fx.ripple(e.clientX, e.clientY, null, 0.45), true);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fx.start(); });
  resize();
  fx.start();
}

function setFx(on) {
  fx.on = on;
  store.set('fx', on ? 'on' : 'off');
  document.documentElement.classList.toggle('fx-off', !on);
  document.documentElement.classList.toggle('fx-cursor', on && window.matchMedia('(hover: hover) and (pointer: fine)').matches);
  const btn = $('#fx-btn');
  if (btn) { btn.setAttribute('aria-pressed', String(on)); btn.querySelector('span').textContent = on ? '特效：開' : '特效：關'; }
  if (on) fx.start(); else { fx.stop(); $('#cur').classList.remove('on'); $('#cur-ring').classList.remove('on'); }
}

/* ======================================================================
 * 題庫練習
 * ==================================================================== */
const state = {
  catId: null,
  subs: [],                                   // 作答紀錄（新的在前）
  filter: store.get('preferredFilter') || 'all',
  cloud: 'off',                               // off：只存本機｜on：雲端同步中｜error：雲端失敗、改存本機
  loadError: ''
};
let CATS = [];
const cards = new Map();                      // 目前頁面上的題目卡：questionId → { el, refresh }

/* ---------- 本機儲存（IndexedDB） ---------- */
const DB_NAME = 'QuizPracticeDB';
const STORE_NAME = 'submissions';
let idb = null;

function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { idb = req.result; resolve(idb); };
    req.onupgradeneeded = e => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id' });
    };
  });
}
function idbTx(mode, fn) {
  return new Promise(resolve => {
    if (!idb) return resolve(undefined);
    try {
      const tx = idb.transaction(STORE_NAME, mode);
      const req = fn(tx.objectStore(STORE_NAME));
      tx.oncomplete = () => resolve(req ? req.result : undefined);
      tx.onerror = tx.onabort = () => { console.error('本機儲存失敗：', tx.error); resolve(undefined); };
    } catch (e) { console.error('本機儲存失敗：', e); resolve(undefined); }
  });
}
const idbPut = sub => idbTx('readwrite', s => s.put(sub));   // put：同 id 會覆寫，重複匯入不會出錯
const idbAll = async () => (await idbTx('readonly', s => s.getAll())) || [];
const idbDelete = id => idbTx('readwrite', s => s.delete(id));

/* ---------- 雲端同步（有 Firebase 設定時才載入） ---------- */
const cloud = { api: null, db: null, user: null, appId: 'default-quiz-app-id' };
const cloudOn = () => state.cloud === 'on' && cloud.db && cloud.user;
const subsRef = () => cloud.api.collection(cloud.db, 'artifacts', cloud.appId, 'users', cloud.user.uid, 'submissions');
const subDoc = id => cloud.api.doc(cloud.db, 'artifacts', cloud.appId, 'users', cloud.user.uid, 'submissions', id);

async function initCloud() {
  if (typeof __firebase_config === 'undefined') return;
  try {
    const cfg = JSON.parse(__firebase_config);
    if (!cfg) return;
    const base = 'https://www.gstatic.com/firebasejs/11.6.1/';
    const [A, U, S] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    cloud.api = S;
    if (typeof __app_id !== 'undefined') cloud.appId = __app_id;
    const app = A.initializeApp(cfg);
    const auth = U.getAuth(app);
    cloud.db = S.getFirestore(app);
    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await U.signInWithCustomToken(auth, __initial_auth_token);
    else await U.signInAnonymously(auth);
    U.onAuthStateChanged(auth, user => {
      cloud.user = user;
      if (!user) return;
      state.cloud = 'on';
      renderStatus();
      S.onSnapshot(subsRef(), snap => {
        const rows = snap.docs.map(d => {
          const x = d.data();
          // serverTimestamp 剛寫入時可能還是空的，先用現在時間
          const ms = x.timestamp ? (x.timestamp.toMillis ? x.timestamp.toMillis() : x.timestamp) : Date.now();
          return { id: d.id, ...x, _t: ms };
        });
        rows.sort((a, b) => b._t - a._t);
        state.subs = rows;
        refreshAllCards();
        renderSidebar();
      }, err => {
        console.error('雲端紀錄讀取失敗：', err);
        state.cloud = 'error';
        renderStatus();
      });
    });
  } catch (e) {
    console.error('雲端同步初始化失敗：', e);
    state.cloud = 'error';
    renderStatus();
  }
}

/* ---------- 判題 ---------- */
const subTime = s => (s.timestamp && s.timestamp.toMillis ? s.timestamp.toMillis() : s.timestamp) || s._t || 0;

function isSubmissionValidToday(sub, qId) {
  if (!sub.isCorrect) return false;
  if (qId === 'preface_q1') {   // 這題的答案是「今天的日期」，隔天就要重答
    const d = new Date(subTime(sub)), t = new Date();
    return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate();
  }
  return true;
}
const isSolved = qId => state.subs.some(s => s.questionId === qId && isSubmissionValidToday(s, qId));
const solvedCount = cat => (cat.questions || []).filter(q => isSolved(q.id)).length;
const isCatDone = cat => !!cat && (cat.questions || []).length > 0 && solvedCount(cat) === cat.questions.length;
const currentCat = () => CATS.find(c => c.id === state.catId) || CATS[0] || null;

const normalizeText = str => {
  if (!str) return '';
  return String(str).replace(/\r\n/g, '\n').split('\n').map(line => line.trim().replace(/\s+/g, ' ')).filter(line => line.length > 0).join('\n');
};
const todayROC = () => { const t = new Date(); return `${t.getFullYear() - 1911}/${t.getMonth() + 1}/${t.getDate()}`; };

async function verifyAnswer(questionId, userInput, correctAnswer) {
  if (questionId === 'preface_q1') return normalizeText(userInput) === normalizeText(todayROC());
  if (!correctAnswer) return false;
  return normalizeText(userInput) === normalizeText(correctAnswer);
}

/* ---------- 側欄 ---------- */
// 段位：答對比例達到門檻（%）就升級
const RANKS = [[100, '傳說', 'legend'], [75, '鑽石', 'diamond'], [50, '黃金', 'gold'], [25, '白銀', 'silver'], [1, '青銅', 'bronze'], [0, '未定級', 'none']];
function toggleSidebar(open) {
  const side = $('#sidebar');
  side.classList.toggle('is-open', open);
  $('#scrim').hidden = !open;
  $('#menu-btn').setAttribute('aria-expanded', String(open));
}

function renderSidebar() {
  const nav = $('#nav');
  if (!CATS.length) { nav.innerHTML = '<p class="nav-empty">尚無題庫資料</p>'; return; }
  let all = 0, done = 0;
  nav.innerHTML = CATS.map(c => {
    const total = (c.questions || []).length;
    const ok = solvedCount(c);
    all += total; done += ok;
    const active = c.id === state.catId;
    const complete = total > 0 && ok === total;
    const icon = complete ? ICON.check : c.isPreface ? ICON.book : c.isDataViewer ? ICON.blocks : '<i class="nav-dot"></i>';
    return `<button type="button" class="nav-item${active ? ' is-active' : ''}${complete ? ' is-done' : ''}" data-id="${esc(c.id)}"${active ? ' aria-current="page"' : ''}>
      <span class="nav-ico">${icon}</span>
      <span class="nav-main">
        <span class="nav-title">${c.title ?? ''}</span>
        ${total ? `<span class="nav-bar"><i style="width:${(ok / total) * 100}%"></i></span>` : ''}
      </span>
      ${total ? `<span class="nav-count">${ok}/${total}</span>` : ''}
    </button>`;
  }).join('');
  $('#overall').hidden = all === 0;
  $('#all-done').textContent = done;
  $('#all-total').textContent = all;
  const pct = all ? Math.round((done / all) * 100) : 0;
  const bar = $('#all-bar');
  bar.setAttribute('aria-valuenow', pct);
  bar.firstElementChild.style.width = pct + '%';
  $('#topbar-count').textContent = all ? `${done}/${all}` : '';
  const exact = all ? (done / all) * 100 : 0;
  const rank = RANKS.find(r => (r[0] === 0 || done > 0) && (r[0] === 1 ? done >= 1 : exact >= r[0])) || RANKS[RANKS.length - 1];
  const rk = $('#rank');
  rk.textContent = rank[1];
  rk.className = 'rank r-' + rank[2];
  rk.title = `段位依答對比例而定：${RANKS.slice().reverse().map(r => r[1]).join(' → ')}`;
}

function renderStatus() {
  const el = $('#sync-status');
  if (state.cloud === 'on') { el.className = 'sync is-on'; el.innerHTML = '<i></i>作答紀錄自動同步到雲端'; }
  else if (state.cloud === 'error') { el.className = 'sync is-warn'; el.innerHTML = '<i></i>雲端連不上，紀錄先存在這台裝置'; }
  else { el.className = 'sync'; el.innerHTML = '<i></i>作答紀錄存在這個瀏覽器裡'; }
}

function openCategory(id) {
  if (state.catId === id) { toggleSidebar(false); return; }
  state.catId = id;
  toggleSidebar(false);
  renderSidebar();
  renderPage();
  const main = $('#main');
  main.scrollTop = 0;
}

/* ---------- 主內容 ---------- */
function renderPage() {
  const page = $('#page');
  cards.clear();
  closePop();
  const cat = currentCat();
  if (!cat) {
    page.innerHTML = `<div class="empty-page"><h1>題庫沒有載入成功</h1><p>${esc(state.loadError || '找不到任何單元。')}</p><p>請確認網站目錄下有 <code>config/title.json</code>，並且是用網頁伺服器開啟（直接點兩下 HTML 檔會被瀏覽器擋下）。</p></div>`;
    return;
  }
  if (cat.isDataViewer) { mountLab(page, cat); return; }

  const title = cat.fullName || cat.title || '';
  const showKicker = cat.title && cat.title !== title;
  page.innerHTML = `
    <header class="unit-head">
      ${showKicker ? `<p class="unit-kicker">${cat.title}</p>` : ''}
      <h1 class="unit-title">${esc(title)}</h1>
      ${cat.isPreface ? '' : `<p class="unit-desc">請仔細閱讀題目，將程式執行或人工計算的結果填入下方。答案必須完全一致才能判對。</p>
      <div class="unit-tools">
        <div class="seg" role="group" aria-label="篩選題目">
          <button type="button" data-filter="all">全部題目</button>
          <button type="button" data-filter="unsolved">未答對</button>
          <button type="button" data-filter="solved">已答對</button>
        </div>
        <span class="unit-progress" id="unit-progress"></span>
      </div>`}
    </header>
    ${cat.isPreface ? prefaceHTML() : ''}
    <div id="q-list" class="q-list"></div>`;

  const list = $('#q-list');
  (cat.questions || []).forEach((q, i) => list.appendChild(buildCard(cat, q, i)));
  if (cat.isPreface) bindTermCopy(page);
  else {
    $$('.seg button', page).forEach(b => b.addEventListener('click', () => applyQuestionFilter(b.dataset.filter)));
    applyQuestionFilter(state.filter);
  }
  refreshAllCards();
}

function refreshUnitProgress() {
  const cat = currentCat();
  const el = $('#unit-progress');
  if (!el || !cat) return;
  const total = (cat.questions || []).length;
  el.innerHTML = total ? `已答對 <b>${solvedCount(cat)}</b> / ${total} 題` : '';
}

function applyQuestionFilter(type) {
  state.filter = type;
  store.set('preferredFilter', type);
  const cat = currentCat();
  if (!cat || cat.isPreface || cat.isDataViewer) return;
  let visible = 0;
  for (const q of cat.questions || []) {
    const c = cards.get(q.id);
    if (!c) continue;
    const ok = isSolved(q.id);
    const show = type === 'unsolved' ? !ok : type === 'solved' ? ok : true;
    c.el.hidden = !show;
    if (show) visible++;
  }
  $$('.seg button').forEach(b => { const on = b.dataset.filter === type; b.classList.toggle('is-on', on); b.setAttribute('aria-pressed', String(on)); });
  let msg = $('#empty-filter-msg');
  if (visible === 0) {
    if (!msg) { msg = document.createElement('p'); msg.id = 'empty-filter-msg'; msg.className = 'q-empty'; $('#q-list').appendChild(msg); }
    msg.textContent = type === 'unsolved' ? '這個單元的題目都答對了。' : type === 'solved' ? '這個單元還沒有答對的題目。' : '這個單元目前沒有題目。';
  } else if (msg) msg.remove();
}

function buildCard(cat, q, index) {
  const el = document.createElement('article');
  el.className = 'q';
  const inputId = 'input-' + String(q.id).replace(/[^\w-]/g, '_');
  const hasExample = q.example != null && String(q.example) !== '';
  el.innerHTML = `
    <div class="q-ask">
      <div class="q-top">
        <span class="q-no">Q${index + 1}</span>
        <span class="q-state"></span>
      </div>
      <div class="q-text">${q.text ?? ''}</div>
      ${hasExample ? `<div class="q-example">
        <div class="q-example-h">
          <span>範例輸出參考</span>
          <button type="button" class="mini-btn copy-btn">${ICON.copy}<span>複製</span></button>
        </div>
        <pre>${q.example}</pre>
      </div>` : ''}
    </div>
    <div class="q-answer">
      <label class="q-label" for="${inputId}">您的答案</label>
      <textarea id="${inputId}" class="q-input" rows="4" placeholder="請在此輸入與範例格式完全一致的答案…" spellcheck="false" autocomplete="off"></textarea>
      <p class="q-feedback" aria-live="polite"></p>
      <div class="q-actions">
        <span class="q-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> 送出</span>
        <button type="button" class="btn btn-quiet q-clear">清空作答區</button>
        <button type="button" class="btn btn-gold q-submit" disabled>${ICON.send}<span>送出答案</span></button>
      </div>
      <div class="q-history" hidden>
        <div class="h-head">
          <button type="button" class="h-toggle" aria-expanded="true">${ICON.clock}<span>作答紀錄</span><b class="h-count">0</b>${ICON.down}</button>
          <button type="button" class="mini-btn h-clear">${ICON.trash}<span>清空紀錄</span></button>
        </div>
        <ol class="h-list"></ol>
      </div>
    </div>`;

  const ta = $('.q-input', el), btn = $('.q-submit', el), feedback = $('.q-feedback', el);
  const hist = $('.q-history', el), hList = $('.h-list', el), hToggle = $('.h-toggle', el), hClear = $('.h-clear', el);
  const draftKey = `draft_${q.id}`;
  let busy = false, lastTopId = null;

  const autosize = () => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; };
  ta.value = store.get(draftKey) || '';
  btn.disabled = !ta.value.trim();
  if (ta.value) requestAnimationFrame(autosize);

  ta.addEventListener('input', () => {
    btn.disabled = busy || !ta.value.trim();
    store.set(draftKey, ta.value);
    autosize();
  });
  ta.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); if (!btn.disabled) btn.click(); }
  });
  $('.q-clear', el).addEventListener('click', () => {
    ta.value = ''; btn.disabled = true; store.del(draftKey); feedback.textContent = ''; feedback.className = 'q-feedback';
    autosize(); ta.focus();
  });

  const copyBtn = $('.copy-btn', el);
  if (copyBtn) copyBtn.addEventListener('click', async () => {
    const label = copyBtn.querySelector('span');
    const ok = await copyText($('.q-example pre', el).textContent);   // 先把按鈕存成變數，避免非同步後 e.currentTarget 變成 null
    if (ok) { label.textContent = '已複製'; toast('已複製範例格式', 'success'); setTimeout(() => { label.textContent = '複製'; }, 1500); }
    else toast('複製失敗，請手動選取複製', 'error');
  });

  hToggle.addEventListener('click', () => {
    const open = hToggle.getAttribute('aria-expanded') !== 'true';
    hToggle.setAttribute('aria-expanded', String(open));
    hList.hidden = !open;
  });

  let confirmTimer;
  const resetClear = () => { hClear.dataset.confirm = ''; hClear.classList.remove('is-confirm'); hClear.querySelector('span').textContent = '清空紀錄'; };
  hClear.addEventListener('click', async () => {
    if (hClear.dataset.confirm !== '1') {
      hClear.dataset.confirm = '1'; hClear.classList.add('is-confirm'); hClear.querySelector('span').textContent = '確定清空？';
      clearTimeout(confirmTimer); confirmTimer = setTimeout(resetClear, 3000);
      return;
    }
    clearTimeout(confirmTimer); resetClear();
    const gone = state.subs.filter(s => s.questionId === q.id);
    state.subs = state.subs.filter(s => s.questionId !== q.id);
    if (cloudOn()) gone.forEach(s => cloud.api.deleteDoc(subDoc(s.id)).catch(e => console.error('雲端刪除失敗：', e)));
    else await Promise.all(gone.map(s => idbDelete(s.id)));
    refresh(); renderSidebar(); refreshUnitProgress();
    toast('已清空這一題的作答紀錄', 'success');
  });

  btn.addEventListener('click', async () => {
    const val = ta.value;
    if (busy || !val.trim()) return;
    busy = true; btn.disabled = true; ta.disabled = true;
    btn.querySelector('span').textContent = '驗證中…';
    let ok = false;
    try {
      ok = await verifyAnswer(q.id, val, q.answer);
      el.classList.remove('flash-ok', 'shake'); void el.offsetWidth; el.classList.add(ok ? 'flash-ok' : 'shake');
      const br = btn.getBoundingClientRect();
      fx.ripple(br.left + br.width / 2, br.top + br.height / 2, ok ? 'ok' : 'bad', ok ? 1 : 0.7);
      await handleSubmit(cat, q.id, val, ok);
    } catch (e) { console.error('送出失敗：', e); toast('送出時發生問題，請再試一次', 'error'); }
    if (ok) {
      store.del(draftKey); ta.value = ''; autosize();
      feedback.className = 'q-feedback is-ok'; feedback.textContent = '答對了！';
    } else {
      // 答錯時保留內容，方便直接修改再送出
      feedback.className = 'q-feedback is-bad'; feedback.textContent = '答案不符。請對照範例的格式（換行、空白、小數位數）再試一次。';
    }
    busy = false; ta.disabled = false; btn.disabled = !ta.value.trim();
    btn.querySelector('span').textContent = '送出答案';
    if (!ok) ta.focus();
  });

  function refresh() {
    const subs = state.subs.filter(s => s.questionId === q.id);
    const solved = isSolved(q.id);
    el.classList.toggle('is-solved', solved);
    $('.q-state', el).innerHTML = solved ? `${ICON.check}已答對` : '';
    hist.hidden = subs.length === 0;
    $('.h-count', el).textContent = subs.length;
    const topId = subs.length ? subs[0].id : null;
    hList.innerHTML = subs.map((s, i) => {
      const ms = subTime(s);
      const time = ms ? new Date(ms).toLocaleString('zh-TW', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '剛剛';
      const isNew = i === 0 && lastTopId !== null && topId !== lastTopId;
      return `<li class="h-item ${s.isCorrect ? 'is-ok' : 'is-bad'}${isNew ? ' is-new' : ''}">
        <span class="h-mark">${s.isCorrect ? ICON.check : ICON.x}</span>
        <div class="h-body">
          <div class="h-meta"><b>${s.isCorrect ? '正確' : '錯誤'}</b><time>${esc(time)}</time></div>
          <pre>${esc(s.submittedAnswer)}</pre>
        </div>
      </li>`;
    }).join('');
    lastTopId = topId === null ? '' : topId;
  }

  cards.set(q.id, { el, refresh });
  return el;
}

function refreshAllCards() {
  for (const c of cards.values()) c.refresh();
  refreshUnitProgress();
}

async function handleSubmit(cat, questionId, answer, isCorrect) {
  const sub = { id: Date.now().toString(), questionId, categoryId: cat.id, submittedAnswer: answer || '', isCorrect, timestamp: Date.now() };
  const wasDone = isCatDone(cat);
  state.subs = [sub, ...state.subs];           // 先更新畫面，再背景儲存
  const card = cards.get(questionId);
  if (card) card.refresh();
  refreshUnitProgress();
  renderSidebar();
  if (!wasDone && isCatDone(cat)) celebrate();
  if (cloudOn()) {
    cloud.api.addDoc(subsRef(), { questionId, categoryId: cat.id, submittedAnswer: sub.submittedAnswer, isCorrect, timestamp: cloud.api.serverTimestamp() })
      .catch(e => { console.error('雲端寫入失敗：', e); toast('這筆紀錄沒有同步到雲端', 'error'); });
  } else {
    await idbPut(sub);
  }
}

function celebrate() {
  if (typeof confetti === 'function' && !reduceMotion()) {
    confetti({ particleCount: 160, spread: 85, origin: { y: 0.6 }, zIndex: 9999, colors: ['#ffc83d', '#ff9f1c', '#3fe3ff', '#ff4fa3', '#edeaff'] });
  }
  fx.ripple(window.innerWidth / 2, window.innerHeight / 2, 'gold', 1.4);
  const el = $('#celebrate');
  el.classList.add('in');
  setTimeout(() => el.classList.remove('in'), 4200);
}

function exportRecords() {
  // 直接匯出畫面上的紀錄（雲端模式下 IndexedDB 是空的，原本會誤判成「沒有紀錄」）
  const data = state.subs.map(s => ({ id: String(s.id), questionId: s.questionId, categoryId: s.categoryId, submittedAnswer: s.submittedAnswer, isCorrect: !!s.isCorrect, timestamp: subTime(s) }));
  if (!data.length) { toast('目前沒有任何作答紀錄可供匯出', 'info'); return; }
  download(`資料分析練習紀錄_${localStamp()}.json`, new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  toast('匯出成功，請妥善保存 JSON 備份檔', 'success');
}

async function importRecords(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { toast('檔案格式錯誤，請確認匯入的是原本匯出的 JSON 檔', 'error'); return; }
  if (!Array.isArray(data)) { toast('這個檔案不是作答紀錄備份', 'error'); return; }
  const valid = data.filter(s => s && s.id != null && typeof s.questionId === 'string' && typeof s.categoryId === 'string')
    .map(s => ({ id: String(s.id), questionId: s.questionId, categoryId: s.categoryId, submittedAnswer: String(s.submittedAnswer ?? ''), isCorrect: !!s.isCorrect, timestamp: Number(s.timestamp) || Date.now() }));
  if (!valid.length) { toast('檔案內沒有有效的紀錄', 'error'); return; }
  const have = new Set(state.subs.map(s => String(s.id)));
  const fresh = valid.filter(s => !have.has(s.id));
  if (cloudOn()) {
    fresh.forEach(s => {
      const { id, ...rest } = s;
      cloud.api.setDoc(subDoc(id), rest).catch(e => console.error('雲端寫入失敗：', e));
    });
  } else {
    await Promise.all(valid.map(idbPut));
  }
  state.subs = [...fresh, ...state.subs].sort((a, b) => subTime(b) - subTime(a));
  refreshAllCards();
  renderSidebar();
  const cat = currentCat();
  if (cat && !cat.isPreface && !cat.isDataViewer) applyQuestionFilter(state.filter);
  toast(fresh.length ? `成功匯入 ${fresh.length} 筆作答紀錄` + (fresh.length < valid.length ? `（另有 ${valid.length - fresh.length} 筆已存在）` : '') : '這些紀錄都已經匯入過了', fresh.length ? 'success' : 'info');
}

const dsById = id => lab.ds.find(d => d.id === id) || null;

const blockCtx = () => ({ datasets: lab.ds.map(d => ({ id: d.id, name: d.name, cols: d.cols })), srcId: lab.src });

const saveLab = debounce(() => {
  store.set('lab_v1', JSON.stringify({
    src: lab.src, blocks: lab.blocks, chart: lab.chart, size: lab.size,
    server: [...new Set(lab.ds.filter(d => d.kind === 'server').map(d => d.name.split(' › ')[0]))]

function restoreLab() {
  if (lab.restored) return;
  lab.restored = true;
  try {
    const s = JSON.parse(store.get('lab_v1') || 'null');
    if (!s || typeof s !== 'object') return;
    if (Array.isArray(s.blocks)) {
      lab.blocks = s.blocks.filter(b => b && BLOCKS[b.type] && b.p && typeof b.p === 'object').map(b => ({ id: newBlockId(), type: b.type, off: !!b.off, p: b.p }));
    }
    if (typeof s.src === 'string') lab.src = s.src;
    if (s.chart && typeof s.chart === 'object') Object.assign(lab.chart, s.chart);
    if ([50, 100, 200, 500].includes(s.size)) lab.size = s.size;
    if (Array.isArray(s.server)) lab.pendingServer = s.server.filter(x => typeof x === 'string');
  } catch (e) { /* 存檔壞了就當作沒有 */ }
}

  if (window.XLSX) return Promise.resolve();
  if (!xlsxLoading) {
    xlsxLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = resolve;
      s.onerror = () => { xlsxLoading = null; s.remove(); reject(new Error('Excel 解析元件下載失敗。請檢查網路，或先把檔案另存成 CSV')); };
      document.head.appendChild(s);
    });
  }
  return xlsxLoading;
}

function fmtDateCell(d) {
  const t = new Date(Math.round(d.getTime() / 60000) * 60000);
  const day = `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}`;
  return t.getHours() || t.getMinutes() ? `${day} ${pad2(t.getHours())}:${pad2(t.getMinutes())}` : day;
}

/** 檔案內容 → [{name, matrix, enc}]（Excel 每個工作表各算一份） */
async function parseFile(name, buf) {
  const ext = (name.split('.').pop() || '').toLowerCase();
  if (['xlsx', 'xls', 'xlsm', 'ods'].includes(ext)) {
    await loadXLSX();
    const wb = XLSX.read(buf, { type: 'array', cellDates: true });
    const sheets = [];
    for (const sn of wb.SheetNames) {
      const m = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, defval: '', raw: true, blankrows: false });
      if (!m.length) continue;
      for (const r of m) {
        for (let i = 0; i < r.length; i++) {
          const v = r[i];
          if (v instanceof Date) r[i] = fmtDateCell(v);
          else if (typeof v === 'boolean') r[i] = String(v);
          else if (v == null) r[i] = '';
        }
      }
      sheets.push({ sn, m });
    }
    if (!sheets.length) throw new Error('活頁簿裡沒有資料');
    return sheets.map(s => ({ name: sheets.length > 1 ? `${name} › ${s.sn}` : name, matrix: s.m, enc: '' }));
  }
  const { text, enc } = decodeBuffer(buf);
  const head = text.slice(0, 200).replace(/^\uFEFF/, '').trimStart();
  const looksJson = head[0] === '[' || head[0] === '{';
  if (ext === 'json' || (looksJson && ext !== 'csv' && ext !== 'tsv')) return [{ name, matrix: parseJSONText(text), enc }];
  return [{ name, matrix: parseCSV(text, ext === 'tsv' ? '\t' : undefined), enc }];
}

function addTables(tables, kind, quiet) {
  for (const t of tables) {
    const tb = matrixToTable(t.matrix);
    const id = (kind === 'server' ? 's:' : 'u:') + t.name;
    const d = { id, name: t.name, kind, enc: t.enc, cols: tb.cols, rows: tb.rows };
    const i = lab.ds.findIndex(x => x.id === id);
    if (i >= 0) lab.ds[i] = d; else lab.ds.push(d);
    if (!dsById(lab.src) && !lab.holdSrc) lab.src = id;
    if (!quiet) toast(`已載入「${t.name}」：${fmtInt(tb.rows.length)} 列 × ${tb.cols.length} 欄${t.enc && t.enc !== 'UTF-8' ? `（${t.enc} 編碼）` : ''}`, 'success');
  }
}

const nextPaint = () => new Promise(r => setTimeout(r, 30));

async function handleFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  for (const f of files) {
    if (f.size > 200 * 1024 * 1024) { toast(`「${f.name}」超過 200 MB，瀏覽器處理不了這麼大的檔案`, 'error', 6000); continue; }
    lab.loading.add(f.name);
    renderData();
    await nextPaint();
    try { addTables(await parseFile(f.name, await f.arrayBuffer()), 'upload'); }
    catch (e) { console.error(e); toast(`讀不了「${f.name}」：${e.message}`, 'error', 6000); }
    lab.loading.delete(f.name);
  }
  renderData();
  labRun();
}

async function loadServerFile(name, quiet) {
  if (lab.loading.has(name) || lab.ds.some(d => d.kind === 'server' && d.name.split(' › ')[0] === name)) {
    if (!quiet) toast(`「${name}」已經載入了`, 'info');
    return;
  }
  lab.loading.add(name);
  renderData();
  try {
    const res = await fetch('./data/' + name.split('/').map(encodeURIComponent).join('/'));
    if (!res.ok) throw new Error(`伺服器回應 ${res.status}`);
    addTables(await parseFile(name, await res.arrayBuffer()), 'server', quiet);
  } catch (e) {
    console.error(e);
    toast(`載入「${name}」失敗：${e.message}`, 'error', 6000);
  }
  lab.loading.delete(name);
  renderData();
  labRun();
}

async function ensureFileList() {
  if (lab.files !== null || lab.filesLoading) return;
  lab.filesLoading = true;
  try {
    const res = await fetch('./config/file_list.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const arr = Array.isArray(j) ? j : j && Array.isArray(j.files) ? j.files : [];
    lab.files = arr.filter(f => typeof f === 'string' && f);
  } catch (e) {
    console.warn('讀不到 config/file_list.json：', e);
    lab.files = [];
    lab.filesErr = true;
  }
  lab.filesLoading = false;
  renderData();
  // 還原上次載入過的題庫檔；起點資料還在路上時，先不要讓別的檔案搶走「起點」
  const want = lab.pendingServer.filter(n => lab.files.includes(n));
  lab.pendingServer = [];
  if (!want.length) return;
  lab.holdSrc = want.some(n => lab.src === 's:' + n || lab.src.startsWith('s:' + n + ' › '));
  await Promise.all(want.map(n => loadServerFile(n, true)));
  lab.holdSrc = false;
  if (!dsById(lab.src) && lab.ds.length) { lab.src = lab.ds[0].id; renderData(); labRun(); }
}

function removeDataset(id) {
  lab.ds = lab.ds.filter(d => d.id !== id);
  if (lab.src === id) { lab.src = lab.ds.length ? lab.ds[0].id : ''; lab.cursor = null; }
  renderData();
  labRun();
}

function renderData() {

  if (!el) return;
  const none = !lab.ds.length && !lab.loading.size;
  const chips = lab.ds.map(d => `
    <li class="ds${d.id === lab.src ? ' is-src' : ''}">
      <button type="button" class="ds-main" data-act="ds-src" data-id="${esc(d.id)}" title="${d.id === lab.src ? '積木程式從這份資料開始' : '點一下，改從這份資料開始'}">
        ${ICON.file}
        <span class="ds-name">${esc(d.name)}</span>
        <span class="ds-meta">${fmtInt(d.rows.length)} 列 × ${d.cols.length} 欄${d.enc && d.enc !== 'UTF-8' ? ' · ' + esc(d.enc) : ''}</span>
        ${d.id === lab.src ? '<span class="ds-tag">起點</span>' : ''}
      </button>
      <button type="button" class="ds-x" data-act="ds-del" data-id="${esc(d.id)}" aria-label="移除 ${esc(d.name)}">${ICON.x}</button>
    </li>`).join('') +
    [...lab.loading].map(n => `<li class="ds is-loading"><span class="ds-main"><span class="spin"></span><span class="ds-name">${esc(n)}</span><span class="ds-meta">讀取中…</span></span></li>`).join('');
  el.innerHTML = `
    <div class="panel-head">
      <h2>資料</h2>
      <p class="panel-hint">${none ? '' : '可以同時載入多份。積木程式從標示「起點」的那一份開始讀。'}</p>
      <div class="panel-tools">
        <button type="button" class="btn btn-line" data-act="pick-server">${ICON.file}<span>題庫檔案</span>${ICON.down}</button>
        <button type="button" class="btn btn-gold" data-act="upload">${ICON.upload}<span>上傳檔案</span></button>
      </div>
    </div>
    ${none ? `<div class="drop-hint">
        ${ICON.upload}
        <p><b>先載入一份資料。</b>從「題庫檔案」挑一份，或把自己的檔案拖到這裡。</p>
        <p class="drop-sub">支援 CSV、TSV、JSON、Excel（.xlsx / .xls）。檔案只會在你的瀏覽器裡處理，不會上傳到任何伺服器；Big5 編碼的政府開放資料也會自動辨識。</p>
      </div>` : `<ul class="ds-list">${chips}</ul>`}`;

function openServerMenu(btn) {
  if (lab.files === null) { toast('檔案清單還在讀取，請稍等一下', 'info'); return; }
  if (!lab.files.length) {
    toast(lab.filesErr ? '讀不到 config/file_list.json，目前只能用「上傳檔案」' : '題庫檔案清單是空的', lab.filesErr ? 'error' : 'info', 5000);
    return;
  }
  const items = lab.files.map(f => {
    const on = lab.ds.some(d => d.kind === 'server' && d.name.split(' › ')[0] === f);
    return `<button type="button" data-v="${esc(f)}"${on ? ' class="is-on"' : ''}>${ICON.file}<span>${esc(f)}</span>${on ? '<em>已載入</em>' : ''}</button>`;
  }).join('');
  openPop(btn, `<div class="menu menu-files"><p class="menu-h">選一份題庫檔案</p>${lab.files.length > 8 ? '<input type="search" class="menu-q" placeholder="搜尋檔名…" aria-label="搜尋檔名">' : ''}<div class="menu-list">${items}</div></div>`, v => loadServerFile(v));
  const q = $('#pop .menu-q');
  if (q) q.addEventListener('input', () => {
    const s = q.value.trim().toLowerCase();
    $$('#pop .menu-list button').forEach(b => { b.hidden = !!s && !b.dataset.v.toLowerCase().includes(s); });
  });
}

/* ---------- 積木盒 ---------- */
function renderPalette() {
  const el = $('#lab-pal');
  if (!el) return;
  el.innerHTML = BLOCK_CATS.map(([cat, label]) => `
    <div class="pal-group">
      <h3>${label}</h3>
      <div class="pal-items">${Object.entries(BLOCKS).filter(([, d]) => d.cat === cat).map(([type, d]) => `<button type="button" class="pal-item cat-${cat}" data-type="${type}" data-hint="${esc(d.hint)}" title="${esc(d.hint)}">${d.label}</button>`).join('')}</div>
    </div>`).join('') + `<p class="pal-hint" id="pal-hint" aria-live="polite">把游標移到積木上可以看說明。</p><div class="pal-trash">${ICON.trash}<span>放開就刪除這塊積木</span></div>`;
}

/* ---------- 程式區 ---------- */
function footHTML(b, it) {
  let msg = '';
  if (it.error) msg = `<span class="blk-msg is-err">${ICON.alert}${esc(it.error)}</span>`;
  else if (b.off) msg = '<span class="blk-msg">已暫停，這一步不會執行</span>';
  else if (it.skipped) msg = `<span class="blk-msg">${lab.stop && lab.stop.why === 'cursor' ? '在預覽點之後，暫時沒有執行' : '前面的積木有問題，這一步還沒執行'}</span>`;
  else if (it.warn) msg = `<span class="blk-msg is-warn">${ICON.info}${esc(it.warn)}</span>`;
  const peek = lab.cursor === b.id ? `<span class="blk-msg is-peek">${ICON.flag}表格正在顯示這一步的結果</span>` : '';
  const count = it.rows != null && !b.off ? `<span class="blk-count">→ ${fmtInt(it.rows)} 列 × ${it.ncols} 欄</span>` : '';
  return msg + peek + count;
}

function blockClass(b, it) {
  const def = BLOCKS[b.type];
  return `blk cat-${def.cat}${b.off ? ' is-off' : ''}${it.error ? ' is-err' : ''}${it.skipped ? ' is-skip' : ''}${lab.cursor === b.id ? ' is-peek' : ''}`;
}

function blockHTML(b, i, n) {
  const def = BLOCKS[b.type];
  const it = lab.info.get(b.id) || {};
  const cols = it.inCols || (lab.result ? lab.result.cols : []);
  let body;
  try { body = def.ui(b.p, cols, blockCtx()); }
  catch (e) { console.error(e); body = F.w('這塊積木的設定壞了，請刪掉後重放一塊。'); }
  const peekOn = lab.cursor === b.id;
  return `<div class="${blockClass(b, it)}" data-id="${b.id}">
    <div class="blk-in">
      <button type="button" class="blk-grip" data-grip aria-label="拖曳調整「${def.label}」的順序">${ICON.grip}</button>
      <div class="blk-body"><span class="blk-title">${def.label}</span>${body}</div>
      <div class="blk-tools">
        <button type="button" data-act="blk-up" aria-label="往上移" title="往上移"${i === 0 ? ' disabled' : ''}>${ICON.up}</button>
        <button type="button" data-act="blk-down" aria-label="往下移" title="往下移"${i === n - 1 ? ' disabled' : ''}>${ICON.down}</button>
        <button type="button" data-act="blk-peek" aria-pressed="${peekOn}" aria-label="${peekOn ? '取消預覽' : '預覽到這一步'}" title="${peekOn ? '取消預覽，回到完整結果' : '只執行到這一步，看看中間結果'}">${ICON.flag}</button>
        <button type="button" data-act="blk-off" aria-pressed="${!!b.off}" aria-label="${b.off ? '恢復這塊積木' : '暫停這塊積木'}" title="${b.off ? '恢復這塊積木' : '暫停這塊積木（先跳過不執行）'}">${b.off ? ICON.eyeOff : ICON.eye}</button>
        <button type="button" data-act="blk-dup" aria-label="複製這塊積木" title="複製一份，接在下面">${ICON.copy}</button>
        <button type="button" data-act="blk-del" aria-label="刪除這塊積木" title="刪除">${ICON.x}</button>
      </div>
    </div>
    <div class="blk-foot">${footHTML(b, it)}</div>
  </div>`;
}

function hatHTML() {
  const src = dsById(lab.src);
  let opts = lab.ds.map(d => `<option value="${esc(d.id)}"${d.id === lab.src ? ' selected' : ''}>${esc(d.name)}</option>`).join('');
  if (!src) opts = `<option value="" selected>${lab.src ? '⚠ ' + esc(lab.src.slice(2)) + '（請重新載入）' : '選一份資料…'}</option>` + opts;
  return `<div class="blk blk-hat cat-src">
    <div class="blk-in"><div class="blk-body"><span class="blk-title">開始</span>${F.w('讀取資料')}<select class="f" data-src aria-label="起點資料">${opts}</select></div></div>
    <div class="blk-foot">${src ? `<span class="blk-count">→ ${fmtInt(src.rows.length)} 列 × ${src.cols.length} 欄</span>` : ''}</div>
  </div>`;
}

function renderProgram() {
  const el = $('#lab-prog');
  if (!el) return;
  const stack = $('#prog-stack', el);
  const n = lab.blocks.length;
  const ae = document.activeElement;

  // 正在打字時：只更新其他積木，正在輸入的那一塊保持原樣（否則注音／倉頡組字會被打斷）
  if (stack && ae && stack.contains(ae) && ae.matches('input[type="text"], input[type="number"]')) {
    const olds = $$('.blk[data-id]', stack);
    if (olds.length === n && olds.every((o, i) => o.dataset.id === lab.blocks[i].id)) {
      const keep = ae.closest('.blk');
      lab.blocks.forEach((b, i) => {
        if (olds[i] === keep) {
          const it = lab.info.get(b.id) || {};
          keep.className = blockClass(b, it);
          $('.blk-foot', keep).innerHTML = footHTML(b, it);
        } else olds[i].replaceWith(htmlToEl(blockHTML(b, i, n)));
      });
      const hat = $('.blk-hat', stack);
      if (hat) hat.replaceWith(htmlToEl(hatHTML()));
      return;
    }
  }

  // 完整重畫，並把焦點放回原本的位置
  let focusKey = null;
  if (stack && ae && stack.contains(ae)) {
    const blk = ae.closest('.blk[data-id]');
    if (blk) focusKey = { id: blk.dataset.id, sel: ae.dataset.path ? `[data-path="${ae.dataset.path}"]` : ae.dataset.act ? `[data-act="${ae.dataset.act}"]${ae.dataset.i != null ? `[data-i="${ae.dataset.i}"]` : ''}` : ae.dataset.madd ? `[data-madd="${ae.dataset.madd}"]` : null };
  }
  el.innerHTML = `
    <div class="prog-stack" id="prog-stack">${hatHTML()}${lab.blocks.map((b, i) => blockHTML(b, i, n)).join('')}</div>
    ${n ? '<p class="prog-tail">再點一塊積木，就會接在這裡。</p>' : `<div class="prog-empty">
      <p><b>還沒有積木。</b>從積木盒挑一塊開始，例如：</p>
      <ol><li>放「篩選」，只留下題目要的列</li><li>放「分組統計」，算出每一類的加總或平均</li><li>放「排序」和「取前幾列」，找出前三名</li></ol>
      <p class="prog-or">不知道怎麼排？<button type="button" class="btn btn-line" data-act="open-lib">${ICON.book}<span>從腳本庫挑一個現成的</span></button></p>
    </div>`}`;
  if (lab.justAdded) {
    const fresh = $(`.blk[data-id="${lab.justAdded}"]`, el);
    lab.justAdded = null;
    if (fresh) {
      fresh.classList.add('is-new');
      if (lab.reveal) {
        fresh.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
        const first = fresh.querySelector('.blk-body .f');
        if (first && window.matchMedia('(hover: hover)').matches) first.focus({ preventScroll: true });
      }
    }
  } else if (focusKey && focusKey.sel) {
    const target = $(`.blk[data-id="${focusKey.id}"] ${focusKey.sel}`, el);
    if (target && !target.disabled) target.focus({ preventScroll: true });
  }
}

/* ---------- 執行 ---------- */
function labRun() {
  if (lab.cursor && !findBlock(lab.cursor)) lab.cursor = null;
  const src = dsById(lab.src);
  if (!src) {
    lab.result = null; lab.info = new Map(); lab.stop = null; lab.kinds = []; lab.view = [];
  } else {
    const r = runProgram(src, lab.blocks, dsById, lab.cursor);
    lab.result = r.table; lab.info = r.info; lab.stop = r.stop;
    lab.kinds = r.table.cols.map((_, i) => colKind(r.table.rows, i));
  }
  lab.page = 0;
  lab.sel = null;
  computeView();
  renderProgram();
  renderResult();
  const stack = $('#prog-stack');
  if (stack && !reduceMotion()) { stack.classList.remove('ran'); void stack.offsetWidth; stack.classList.add('ran'); }
  if (!lab.noHist) pushHistory();
  renderUndoState();
  saveLab();
}
const runSoon = debounce(labRun, 260);

function computeView() {
  const t = lab.result;
  if (!t) { lab.view = []; return; }
  const q = lab.q.trim().toLowerCase();
  lab.view = q ? t.rows.filter(r => r.some(v => v != null && String(v).toLowerCase().includes(q))) : t.rows;
}

function tableBefore(index) {
  const src = dsById(lab.src);
  if (!src) return { cols: [], rows: [] };
  return runProgram(src, lab.blocks.slice(0, index), dsById, null).table;
}

function insertBlock(type, index, preset) {
  if (!dsById(lab.src)) { toast('請先載入一份資料', 'info'); return null; }
  const auto = index == null;
  if (auto) index = lab.cursor ? lab.blocks.findIndex(b => b.id === lab.cursor) + 1 : lab.blocks.length;
  let p = preset;
  if (!p) {
    const pre = tableBefore(index);
    p = BLOCKS[type].make(pre.cols, pre.cols.map((_, i) => colKind(pre.rows, i)), { ...blockCtx(), table: pre });
  }
  const b = { id: newBlockId(), type, off: false, p };
  lab.blocks.splice(index, 0, b);
  if (auto && lab.cursor) lab.cursor = b.id;
  lab.justAdded = b.id;
  lab.reveal = !preset;        // 從積木盒加的才捲到積木那邊；從表格加的（排序、篩選）留在原地，免得畫面跳走
  if (!lab.editorOpen && !preset) setEditorOpen(true);
  labRun();
  if (preset) toast(`已在程式${auto && lab.cursor ? '的預覽點後面' : '最後面'}加上「${BLOCKS[type].label}」積木`, 'success', 2400);
  return b;
}

function moveBlock(id, index) {
  const from = lab.blocks.findIndex(b => b.id === id);
  if (from === -1) return;
  const [b] = lab.blocks.splice(from, 1);
  lab.blocks.splice(Math.max(0, Math.min(index, lab.blocks.length)), 0, b);
  labRun();
}

function removeBlock(id) {
  lab.blocks = lab.blocks.filter(b => b.id !== id);
  if (lab.cursor === id) lab.cursor = null;
  labRun();
}

function setEditorOpen(open) {
  lab.editorOpen = open;
  const ed = $('#lab-editor');
  if (!ed) return;
  ed.classList.toggle('is-closed', !open);
  const btn = $('[data-act="toggle-editor"]', ed);
  btn.setAttribute('aria-expanded', String(open));
  btn.querySelector('span').textContent = open ? '收合' : '展開';
}

/* ---------- 結果區 ---------- */
function renderResult() {
  const el = $('#lab-result');
  if (!el) return;
  destroyChart();
  const t = lab.result;
  if (!t) { el.innerHTML = '<p class="empty">選好起點資料之後，結果會顯示在這裡。</p>'; return; }
  const tabs = [['table', '表格', ICON.table], ['chart', '圖表', ICON.chart], ['summary', '欄位摘要', ICON.list], ['code', 'pandas 程式碼', ICON.code]];

    banner = `<p class="res-banner is-err">${ICON.alert}<span>第 ${lab.blocks.findIndex(b => b.id === lab.stop.id) + 1} 塊積木有問題，下面顯示的是它之前的結果。</span></p>`;
  } else if (lab.cursor) {
    banner = `<p class="res-banner">${ICON.flag}<span>正在預覽第 ${lab.blocks.findIndex(b => b.id === lab.cursor) + 1} 塊積木的結果。</span><button type="button" class="link-btn" data-act="peek-off">回到完整結果</button></p>`;

    <div class="panel-head res-head">

      <p class="res-size"><b>${fmtInt(t.rows.length)}</b> 列 × <b>${t.cols.length}</b> 欄</p>

function renderTab() {
  const body = $('#res-body');
  if (!body) return;
  destroyChart();
  lab.sumToken++;
  if (lab.tab === 'chart') return renderChartTab(body);
  if (lab.tab === 'summary') return renderSummary(body);
  if (lab.tab === 'code') return renderCode(body);
  body.innerHTML = `
    <div class="grid-bar">
      <label class="search">${ICON.search}<input type="search" id="grid-q" placeholder="在結果裡搜尋…" value="${esc(lab.q)}" aria-label="在結果裡搜尋" autocomplete="off"></label>
      <span class="grid-hit" id="grid-hit"></span>
    </div>
    <div class="grid-wrap" id="grid-wrap" tabindex="0" aria-label="結果表格"></div>
    <div class="grid-foot"><div class="sel-info" id="sel-info"></div><div class="pager" id="pager"></div></div>`;
  renderGrid();
}

function renderGrid() {
  const wrap = $('#grid-wrap');
  if (!wrap) return;
  const t = lab.result, rows = lab.view, nC = t.cols.length;
  const pages = Math.max(1, Math.ceil(rows.length / lab.size));
  lab.page = Math.max(0, Math.min(lab.page, pages - 1));
  const start = lab.page * lab.size, end = Math.min(rows.length, start + lab.size);
  let h = '<table class="grid"><thead><tr><th class="g-corner" scope="col">#</th>';
  for (let c = 0; c < nC; c++) {
    h += `<th scope="col"${lab.kinds[c] === 'num' ? ' class="is-num"' : ''}><button type="button" class="g-h" data-act="col-menu" data-c="${c}" title="${esc(t.cols[c])}"><i>${colLetter(c)}</i><span>${esc(t.cols[c])}</span>${ICON.down}</button></th>`;
  }
  h += '</tr></thead><tbody>';
  if (start >= end) h += `<tr><td class="g-none" colspan="${nC + 1}">${lab.q.trim() ? '找不到符合的內容。' : '沒有任何列。'}</td></tr>`;
  for (let r = start; r < end; r++) {
    const row = rows[r];
    h += `<tr><th class="g-r" scope="row" data-r="${r}">${r + 1}</th>`;
    for (let c = 0; c < nC; c++) {
      const v = row[c];
      h += `<td data-r="${r}" data-c="${c}"${lab.kinds[c] === 'num' ? ' class="is-num"' : ''}>${v == null || v === '' ? '' : esc(v)}</td>`;
    }
    h += '</tr>';
  }
  wrap.innerHTML = h + '</tbody></table>';
  wrap.scrollTop = 0;
  const hit = $('#grid-hit');
  if (hit) hit.textContent = lab.q.trim() ? `符合 ${fmtInt(rows.length)} 列` : '';
  $('#pager').innerHTML = `
    <span class="pager-range">${rows.length ? `第 ${fmtInt(start + 1)}–${fmtInt(end)} 列，共 ${fmtInt(rows.length)} 列` : ''}</span>
    <button type="button" class="pg" data-act="page" data-to="first" aria-label="第一頁"${lab.page === 0 ? ' disabled' : ''}>${ICON.first}</button>
    <button type="button" class="pg" data-act="page" data-to="prev" aria-label="上一頁"${lab.page === 0 ? ' disabled' : ''}>${ICON.left}</button>
    <label class="pager-no">第 <input type="number" id="page-no" min="1" max="${pages}" value="${lab.page + 1}" aria-label="頁碼"> / ${fmtInt(pages)} 頁</label>
    <button type="button" class="pg" data-act="page" data-to="next" aria-label="下一頁"${lab.page >= pages - 1 ? ' disabled' : ''}>${ICON.right}</button>
    <button type="button" class="pg" data-act="page" data-to="last" aria-label="最後一頁"${lab.page >= pages - 1 ? ' disabled' : ''}>${ICON.last}</button>
    <label class="pager-size">每頁 <select id="page-size" aria-label="每頁列數">${[50, 100, 200, 500].map(s => `<option${s === lab.size ? ' selected' : ''}>${s}</option>`).join('')}</select> 列</label>`;
  paintSel();
}

function gotoPage(to) {
  const pages = Math.max(1, Math.ceil(lab.view.length / lab.size));
  if (to === 'first') lab.page = 0;
  else if (to === 'prev') lab.page--;
  else if (to === 'next') lab.page++;
  else if (to === 'last') lab.page = pages - 1;
  else lab.page = (Math.floor(Number(to)) || 1) - 1;
  renderGrid();
}

/* ---------- 選取儲存格（像試算表一樣） ---------- */
const normSel = () => {
  const s = lab.sel;
  return { r0: Math.min(s.r0, s.r1), r1: Math.max(s.r0, s.r1), c0: Math.min(s.c0, s.c1), c1: Math.max(s.c0, s.c1) };
};

function paintSel() {
  const wrap = $('#grid-wrap'), info = $('#sel-info');
  if (!wrap || !info) return;
  $$('.is-sel, .is-cur', wrap).forEach(td => td.classList.remove('is-sel', 'is-cur'));
  if (!lab.sel || !lab.result) { info.innerHTML = '<span class="sel-tip">點儲存格可以選取，拖曳可以選一個範圍；點欄位名稱可以快速排序或篩選。</span>'; return; }
  const s = normSel();
  for (const td of $$('td[data-r]', wrap)) {
    const r = +td.dataset.r, c = +td.dataset.c;
    if (r >= s.r0 && r <= s.r1 && c >= s.c0 && c <= s.c1) td.classList.add('is-sel');
    if (r === lab.sel.r0 && c === lab.sel.c0) td.classList.add('is-cur');
  }
  const cells = (s.r1 - s.r0 + 1) * (s.c1 - s.c0 + 1);
  if (cells === 1) {
    const v = lab.view[s.r0] ? lab.view[s.r0][s.c0] : '';
    const name = lab.result.cols[s.c0];
    info.innerHTML = `<span class="sel-cell"><i>${colLetter(s.c0)}${s.r0 + 1}</i><span class="sel-val">${isBlank(v) ? '（空白）' : esc(v)}</span></span>
      <button type="button" class="mini-btn" data-act="sel-filter">${ICON.filter}<span>只留下「${esc(name)}」${isBlank(v) ? '是空白' : '等於這個值'}的列</span></button>`;
    return;
  }
  if (cells > 500000) { info.innerHTML = `<span class="sel-stat">已選取 <b>${fmtInt(cells)}</b> 格</span>`; return; }
  let n = 0, sum = 0, min = Infinity, max = -Infinity, filled = 0;
  for (let r = s.r0; r <= s.r1; r++) {
    const row = lab.view[r];
    if (!row) continue;
    for (let c = s.c0; c <= s.c1; c++) {
      if (!isBlank(row[c])) filled++;
      const x = toNum(row[c]);
      if (x === x) { n++; sum += x; if (x < min) min = x; if (x > max) max = x; }
    }
  }
  info.innerHTML = `<span class="sel-stat">選取 <b>${fmtInt(cells)}</b> 格</span><span class="sel-stat">有值 <b>${fmtInt(filled)}</b></span>` +
    (n ? `<span class="sel-stat">加總 <b>${fmtNum(tidy(sum))}</b></span><span class="sel-stat">平均 <b>${fmtNum(tidy(sum / n))}</b></span><span class="sel-stat">最小 <b>${fmtNum(min)}</b></span><span class="sel-stat">最大 <b>${fmtNum(max)}</b></span>` : '') +
    '<span class="sel-tip">Ctrl + C 複製</span>';
}

async function copySelection() {
  if (!lab.sel || !lab.result) return;
  const s = normSel();
  if ((s.r1 - s.r0 + 1) * (s.c1 - s.c0 + 1) > 500000) { toast('選取範圍太大，請改用「匯出 CSV」', 'info'); return; }
  const lines = [];
  for (let r = s.r0; r <= s.r1; r++) {
    const row = lab.view[r];
    if (!row) continue;
    const cells = [];
    for (let c = s.c0; c <= s.c1; c++) cells.push(row[c] == null ? '' : String(row[c]).replace(/[\t\r\n]+/g, ' '));
    lines.push(cells.join('\t'));
  }
  const ok = await copyText(lines.join('\n'));
  toast(ok ? `已複製 ${fmtInt(lines.length)} 列，可以直接貼到作答區` : '複製失敗', ok ? 'success' : 'error');
}

/* ---------- 欄位摘要 ---------- */
function colStats(rows, i) {
  let blank = 0, over = false;
  const nums = [], freq = new Map();
  for (const r of rows) {
    const v = r[i];
    if (isBlank(v)) { blank++; continue; }
    const x = toNum(v);
    if (x === x) nums.push(x);
    const s = toStr(v).trim();
    if (freq.has(s)) freq.set(s, freq.get(s) + 1);
    else if (freq.size < 50000) freq.set(s, 1);
    else over = true;
  }
  const filled = rows.length - blank;
  const top = [...freq.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
  let num = null;
  if (nums.length && nums.length >= filled * 0.9) {
    const fake = nums.map(x => [x]);
    num = { sum: aggregate('sum', fake, 0), avg: aggregate('avg', fake, 0), median: aggregate('median', fake, 0), min: aggregate('min', fake, 0), max: aggregate('max', fake, 0), std: aggregate('std', fake, 0) };
  }
  return { blank, filled, distinct: freq.size, over, top, num };
}

function renderSummary(body) {
  const t = lab.result;
  const token = ++lab.sumToken;
  body.innerHTML = `<div class="sum-grid" id="sum-grid">${t.cols.map((c, i) => `<section class="sum" data-c="${i}"><h3><i>${colLetter(i)}</i><span>${esc(c)}</span></h3><div class="sum-body"><span class="spin"></span></div></section>`).join('')}</div>`;
  const grid = $('#sum-grid');
  const fill = i => {
    const st = colStats(t.rows, i);
    const stat = (l, v) => `<div><dt>${l}</dt><dd>${v === '' ? '—' : typeof v === 'number' ? fmtNum(v) : esc(v)}</dd></div>`;
    const maxN = st.top.length ? st.top[0][1] : 1;
    grid.children[i].querySelector('.sum-body').innerHTML = `
      <p class="sum-tags"><span class="tag ${st.num ? 'is-num' : ''}">${st.num ? '數字' : '文字'}</span><span>有值 <b>${fmtInt(st.filled)}</b></span><span>空白 <b>${fmtInt(st.blank)}</b></span><span>相異 <b>${fmtInt(st.distinct)}${st.over ? '+' : ''}</b></span></p>
      ${st.num ? `<dl class="sum-stats">${stat('加總', st.num.sum)}${stat('平均', st.num.avg)}${stat('中位數', st.num.median)}${stat('最小', st.num.min)}${stat('最大', st.num.max)}${stat('標準差', st.num.std)}</dl>` : ''}
      ${st.top.length && (!st.num || (st.distinct <= 50 && st.top[0][1] > 1)) ? `<ul class="sum-top" aria-label="最常出現的內容">${st.top.map(([k, n]) => `<li><span class="sum-k" title="${esc(k)}">${esc(k)}</span><span class="sum-bar"><i style="width:${(n / maxN) * 100}%"></i></span><span class="sum-n">${fmtInt(n)}</span></li>`).join('')}</ul>` : ''}`;
  };
  let i = 0;
  const step = () => {
    if (token !== lab.sumToken || !document.contains(grid)) return;
    const t0 = performance.now();
    while (i < t.cols.length && performance.now() - t0 < 24) fill(i++);
    if (i < t.cols.length) setTimeout(step, 0);
    else if (lab.sumFocus != null) {
      const card = grid.children[lab.sumFocus];
      lab.sumFocus = null;
      if (card) { card.classList.add('is-focus'); card.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' }); }
    }
  };
  step();
}

function hlPy(code) {
  return code.split('\n').map(line => {

    return esc(line).replace(/&quot;.*?&quot;/g, m => `<span class="s">${m}</span>`);
  }).join('\n');
}
const currentCode = () => toPython(dsById(lab.src), lab.blocks, lab.ds);
