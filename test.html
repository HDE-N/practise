/* ---------- 圖表 ---------- */
const CHART_COLORS = ['#ffc83d', '#3fe3ff', '#ff4fa3', '#9b7bff', '#3ee6a0', '#ff9f1c', '#46b6ff', '#ff7d6b', '#c7f04e', '#e08bff'];
function destroyChart() { if (lab.chartObj) { try { lab.chartObj.destroy(); } catch (e) { /* 忽略 */ } lab.chartObj = null; } }

function renderChartTab(body) {
  const t = lab.result, cfg = lab.chart;
  if (!t.cols.includes(cfg.x)) cfg.x = firstText(t.cols, lab.kinds);
  if (!t.cols.includes(cfg.y)) cfg.y = firstNum(t.cols, lab.kinds);
  const colOpts = v => t.cols.map(c => `<option value="${esc(c)}"${c === v ? ' selected' : ''}>${esc(c)}</option>`).join('');
  const opt = (list, v) => list.map(([k, l]) => `<option value="${k}"${k === String(v) ? ' selected' : ''}>${l}</option>`).join('');
  const scatter = cfg.type === 'scatter';
  body.innerHTML = `
    <div class="chart-bar">
      <label>圖表<select data-chart="type">${opt([['bar', '長條圖'], ['hbar', '橫條圖'], ['line', '折線圖'], ['pie', '圓餅圖'], ['doughnut', '甜甜圈圖'], ['scatter', '散佈圖']], cfg.type)}</select></label>
      <label>${scatter ? 'X 軸（數字）' : '分類'}<select data-chart="x">${colOpts(cfg.x)}</select></label>
      <label>${scatter ? 'Y 軸（數字）' : '數值'}<select data-chart="y"${!scatter && cfg.agg === 'count' ? ' disabled' : ''}>${colOpts(cfg.y)}</select></label>
      ${scatter ? '' : `<label>同一類的算法<select data-chart="agg">${opt([['sum', '加總'], ['avg', '平均'], ['max', '最大值'], ['min', '最小值'], ['count', '筆數']], cfg.agg)}</select></label>
      <label>順序<select data-chart="order">${opt([['desc', '數值大到小'], ['asc', '數值小到大'], ['orig', '照資料順序']], cfg.order)}</select></label>
      <label>顯示<select data-chart="top">${opt([['10', '前 10 項'], ['20', '前 20 項'], ['50', '前 50 項'], ['100', '前 100 項']], cfg.top)}</select></label>`}
      <button type="button" class="btn btn-line" data-act="chart-png">${ICON.download}<span>存成 PNG</span></button>
    </div>
    <div class="chart-box" id="chart-box"><canvas id="lab-chart" role="img" aria-label="依目前結果畫出的圖表"></canvas></div>
    <p class="chart-note" id="chart-note"></p>`;
  drawChart();
}

function drawChart() {
  destroyChart();
  const box = $('#chart-box'), note = $('#chart-note');
  if (!box) return;
  if (typeof Chart === 'undefined') { box.innerHTML = '<p class="empty">圖表元件沒有載入成功（可能是網路擋住了 cdn.jsdelivr.net）。其他功能不受影響。</p>'; return; }
  const t = lab.result, cfg = lab.chart;
  const xi = t.cols.indexOf(cfg.x), yi = t.cols.indexOf(cfg.y);
  const fail = msg => { box.innerHTML = `<p class="empty">${msg}</p>`; if (note) note.textContent = ''; };
  if (xi === -1 || (yi === -1 && cfg.agg !== 'count')) return fail('請先選好欄位。');
  const font = { family: getComputedStyle(document.body).fontFamily, size: 13 };
  const axis = { ticks: { color: '#aaa5d6', font }, grid: { color: 'rgba(155,123,255,.14)' }, border: { color: '#3a3580' } };
  const bg = { id: 'bg', beforeDraw(c) { c.ctx.save(); c.ctx.fillStyle = '#100e24'; c.ctx.fillRect(0, 0, c.width, c.height); c.ctx.restore(); } };
  const common = { responsive: true, maintainAspectRatio: false, animation: { duration: reduceMotion() ? 0 : 450 } };
  let config, msg = '';

  if (cfg.type === 'scatter') {
    const pts = [];
    for (const r of t.rows) { const x = toNum(r[xi]), y = toNum(r[yi]); if (x === x && y === y) pts.push({ x, y }); if (pts.length >= 5000) break; }
    if (!pts.length) return fail('這兩欄沒有可以畫的數字。散佈圖的兩個軸都要選數字欄位。');
    if (pts.length >= 5000) msg = '點太多了，只畫前 5,000 個。';
    config = {
      type: 'scatter',
      data: { datasets: [{ label: `${cfg.x} × ${cfg.y}`, data: pts, backgroundColor: 'rgba(63,227,255,.6)', borderColor: '#3fe3ff', pointRadius: 3 }] },
      options: { ...common, plugins: { legend: { display: false } }, scales: { x: { ...axis, title: { display: true, text: cfg.x, color: '#edeaff', font } }, y: { ...axis, title: { display: true, text: cfg.y, color: '#edeaff', font } } } }
    };
  } else {
    const groups = new Map();
    for (const r of t.rows) {
      const k = isBlank(r[xi]) ? '(空白)' : toStr(r[xi]).trim();
      let g = groups.get(k);
      if (!g) groups.set(k, (g = []));
      g.push(r);
    }
    let items = [...groups.entries()].map(([k, rows]) => [k, aggregate(cfg.agg, rows, yi)]).filter(([, v]) => typeof v === 'number');
    if (!items.length) return fail('「數值」這一欄沒有可以畫的數字，請換一個欄位，或把算法改成「筆數」。');
    if (cfg.order === 'desc') items.sort((a, b) => b[1] - a[1]);
    else if (cfg.order === 'asc') items.sort((a, b) => a[1] - b[1]);
    const total = items.length, top = Number(cfg.top) || 20;
    if (total > top) { items = items.slice(0, top); msg = `共有 ${fmtInt(total)} 種分類，只畫出前 ${top} 項。`; }
    const pie = cfg.type === 'pie' || cfg.type === 'doughnut';
    const label = cfg.agg === 'count' ? '筆數' : `${cfg.y}（${AGG[cfg.agg].label}）`;
    const colors = items.map((_, i) => CHART_COLORS[i % CHART_COLORS.length]);
    config = {
      type: cfg.type === 'hbar' ? 'bar' : cfg.type,
      data: {
        labels: items.map(x => x[0]),
        datasets: [{
          label, data: items.map(x => x[1]),
          backgroundColor: pie ? colors : cfg.type === 'line' ? 'rgba(255,200,61,.18)' : '#ffc83d',
          borderColor: pie ? '#100e24' : '#ffc83d', borderWidth: pie ? 2 : cfg.type === 'line' ? 2.5 : 0,
          borderRadius: pie ? 0 : 4, tension: 0.25, pointRadius: 3, pointBackgroundColor: '#ffc83d', fill: cfg.type === 'line'
        }]
      },
      options: {
        ...common, indexAxis: cfg.type === 'hbar' ? 'y' : 'x',
        plugins: { legend: { display: pie, position: 'right', labels: { color: '#edeaff', font } }, title: { display: true, text: `${label}，依「${cfg.x}」`, color: '#edeaff', font: { ...font, size: 15, weight: '700' }, padding: { bottom: 14 } } },
        scales: pie ? {} : { x: axis, y: axis }
      }
    };
  }
  if (!$('#lab-chart')) box.innerHTML = '<canvas id="lab-chart" role="img" aria-label="依目前結果畫出的圖表"></canvas>';
  config.plugins = [bg];
  try { lab.chartObj = new Chart($('#lab-chart'), config); }
  catch (e) { console.error(e); return fail('圖表畫不出來，請換一種圖表或欄位試試。'); }
  if (note) note.textContent = msg + (lab.cursor ? ' 圖表畫的是預覽中那一步的結果。' : '');
}

/* ---------- 拖放積木 ---------- */
function startBlockDrag(e, d) {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const sx = e.clientX, sy = e.clientY;
  let lx = sx, ly = sy, on = false, ghost = null, slot = null, index = -1, over = '', raf = 0;
  const srcEl = d.el;
  const rect = srcEl.getBoundingClientRect();
  const ox = sx - rect.left, oy = sy - rect.top;
  const pal = $('#lab-pal'), prog = $('#lab-prog'), scroller = $('#main');

  const place = () => {
    ghost.style.transform = `translate(${lx - ox}px, ${ly - oy}px) rotate(1.2deg)`;
    const stack = $('#prog-stack');
    const pr = prog.getBoundingClientRect(), pa = pal.getBoundingClientRect();
    const inPal = d.kind === 'move' && lx >= pa.left && lx <= pa.right && ly >= pa.top && ly <= pa.bottom;
    const inProg = !inPal && lx >= pr.left - 24 && lx <= pr.right + 24 && ly >= pr.top - 40 && ly <= pr.bottom + 80;
    over = inPal ? 'trash' : inProg ? 'prog' : '';
    pal.classList.toggle('is-trash', inPal);
    if (over !== 'prog' || !stack) { slot.remove(); index = -1; return; }
    const els = $$('.blk[data-id]:not(.is-dragging)', stack);
    let i = 0;
    for (; i < els.length; i++) { const r = els[i].getBoundingClientRect(); if (ly < r.top + r.height / 2) break; }
    index = i;
    const before = els[i] || null;
    if (slot.parentNode !== stack || slot.nextElementSibling !== before) stack.insertBefore(slot, before);
  };
  const tick = () => {
    if (!on) return;
    const mr = scroller.getBoundingClientRect();
    if (ly < mr.top + 70) scroller.scrollTop -= 14;
    else if (ly > mr.bottom - 70) scroller.scrollTop += 14;
    place();
    raf = requestAnimationFrame(tick);
  };
  const begin = () => {
    on = true;
    closePop();
    ghost = srcEl.cloneNode(true);
    ghost.classList.add('drag-ghost');
    ghost.classList.remove('is-new');
    ghost.style.width = rect.width + 'px';
    document.body.appendChild(ghost);
    slot = document.createElement('div');
    slot.className = 'blk-slot';
    if (d.kind === 'move') srcEl.classList.add('is-dragging');
    document.body.classList.add('is-dnd');
    if (d.kind === 'move') pal.classList.add('can-trash');
    tick();
  };
  const onMove = ev => {
    lx = ev.clientX; ly = ev.clientY;
    if (!on && Math.hypot(lx - sx, ly - sy) > 6) begin();
    if (on) ev.preventDefault();
  };
  const finish = commit => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    cancelAnimationFrame(raf);
    if (!on) { if (commit && d.kind === 'new') insertBlock(d.type); return; }   // 沒有拖動＝點一下
    on = false;
    ghost.remove(); slot.remove();
    pal.classList.remove('is-trash', 'can-trash');
    document.body.classList.remove('is-dnd');
    srcEl.classList.remove('is-dragging');
    if (!commit) return;
    if (over === 'prog' && index >= 0) { if (d.kind === 'new') insertBlock(d.type, index); else moveBlock(d.id, index); }
    else if (over === 'trash') removeBlock(d.id);
  };
  const onUp = () => finish(true);
  const onCancel = () => finish(false);
  window.addEventListener('pointermove', onMove, { passive: false });
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
}

/* ---------- 事件 ---------- */
let selecting = false;
const searchSoon = debounce(() => { lab.page = 0; lab.sel = null; computeView(); renderGrid(); }, 200);

function bindLab(root) {
  root.addEventListener('click', onLabClick);
  root.addEventListener('change', onLabChange);
  root.addEventListener('input', onLabInput);
  root.addEventListener('compositionend', e => { if (e.target.matches && e.target.matches('.blk [data-path]')) onLabInput(e); });
  root.addEventListener('pointerdown', e => {
    const pal = e.target.closest('.pal-item');
    if (pal) { startBlockDrag(e, { kind: 'new', type: pal.dataset.type, el: pal }); return; }
    const grip = e.target.closest('[data-grip]');
    if (grip) { const blk = grip.closest('.blk[data-id]'); if (blk) startBlockDrag(e, { kind: 'move', id: blk.dataset.id, el: blk }); return; }
    if (e.button) return;
    const rowHead = e.target.closest('th.g-r');
    if (rowHead && lab.result) { const r = +rowHead.dataset.r; lab.sel = { r0: r, c0: 0, r1: r, c1: lab.result.cols.length - 1 }; paintSel(); return; }
    const td = e.target.closest('td[data-r]');
    if (td) {
      const r = +td.dataset.r, c = +td.dataset.c;
      if (e.shiftKey && lab.sel) { lab.sel.r1 = r; lab.sel.c1 = c; }
      else lab.sel = { r0: r, c0: c, r1: r, c1: c };
      selecting = e.pointerType === 'mouse';
      paintSel();
    }
  });
  root.addEventListener('pointerover', e => {
    const p = e.target.closest ? e.target.closest('.pal-item') : null;
    if (p) { const h = $('#pal-hint'); if (h) h.innerHTML = `<b>${p.textContent}</b>：${esc(p.dataset.hint)}`; }
    if (!selecting || !lab.sel) return;
    const td = e.target.closest('td[data-r]');
    if (td && (+td.dataset.r !== lab.sel.r1 || +td.dataset.c !== lab.sel.c1)) { lab.sel.r1 = +td.dataset.r; lab.sel.c1 = +td.dataset.c; paintSel(); }
  });
  root.addEventListener('focusin', e => {
    const p = e.target.closest ? e.target.closest('.pal-item') : null;
    if (p) { const h = $('#pal-hint'); if (h) h.innerHTML = `<b>${p.textContent}</b>：${esc(p.dataset.hint)}`; }
  });
}

function onLabClick(e) {
  const pal = e.target.closest('.pal-item');
  if (pal) { if (e.detail === 0) insertBlock(pal.dataset.type); return; }   // 鍵盤操作（滑鼠與觸控由 pointer 事件處理）
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const blkEl = el.closest('.blk[data-id]');
  const b = blkEl ? findBlock(blkEl.dataset.id) : null;
  switch (act) {
    case 'upload': $('#upload-file').click(); return;
    case 'pick-server': openServerMenu(el); return;
    case 'ds-del': removeDataset(el.dataset.id); return;
    case 'ds-src': if (lab.src !== el.dataset.id) { lab.src = el.dataset.id; lab.cursor = null; renderData(); labRun(); } return;
    case 'toggle-editor': setEditorOpen(!lab.editorOpen); return;
    case 'open-lib': openLibrary(); return;
    case 'save-script': openSaveScript(); return;
    case 'undo': undoProgram(); return;
    case 'redo': redoProgram(); return;
    case 'clear-prog': {
      if (!lab.blocks.length) return;
      const label = el.querySelector('span');
      if (el.dataset.confirm !== '1') {
        el.dataset.confirm = '1'; el.classList.add('is-confirm'); label.textContent = '確定清空？';
        setTimeout(() => { if (document.contains(el)) { el.dataset.confirm = ''; el.classList.remove('is-confirm'); label.textContent = '清空積木'; } }, 3000);
        return;
      }
      el.dataset.confirm = ''; el.classList.remove('is-confirm'); label.textContent = '清空積木';
      lab.blocks = []; lab.cursor = null; labRun();
      return;
    }
    case 'tab': lab.tab = el.dataset.tab; renderResult(); return;
    case 'page': gotoPage(el.dataset.to); return;
    case 'col-menu': openColMenu(el, +el.dataset.c); return;
    case 'peek-off': lab.cursor = null; labRun(); return;
    case 'export-csv': {
      const t = lab.result;
      if (!t) return;
      download(`分析結果_${localStamp()}.csv`, new Blob(['\ufeff' + toCSV(t.cols, t.rows)], { type: 'text/csv;charset=utf-8;' }));
      toast(`已匯出 ${fmtInt(t.rows.length)} 列`, 'success');
      return;
    }
    case 'copy-code': copyText(currentCode()).then(ok => toast(ok ? '已複製程式碼' : '複製失敗，請手動選取複製', ok ? 'success' : 'error')); return;
    case 'chart-png': {
      const c = $('#lab-chart');
      if (!c || !lab.chartObj) { toast('目前沒有圖表可以存', 'info'); return; }
      c.toBlob(blob => { if (blob) { download(`圖表_${localStamp()}.png`, blob); toast('圖片已下載', 'success'); } }, 'image/png');
      return;
    }
    case 'sel-filter': {
      if (!lab.sel || !lab.result) return;
      const s = normSel();
      const v = lab.view[s.r0] ? lab.view[s.r0][s.c0] : '';
      insertBlock('filter', null, { mode: 'all', conds: [{ col: lab.result.cols[s.c0], op: isBlank(v) ? 'empty' : '=', vt: 'val', val: isBlank(v) ? '' : String(v).trim(), val2: '' }] });
      return;
    }
  }
  if (!b) return;
  switch (act) {
    case 'blk-del': removeBlock(b.id); return;
    case 'blk-dup': {
      const copy = { id: newBlockId(), type: b.type, off: b.off, p: JSON.parse(JSON.stringify(b.p)) };
      lab.blocks.splice(lab.blocks.indexOf(b) + 1, 0, copy);
      lab.justAdded = copy.id; lab.reveal = false;
      labRun();
      return;
    }
    case 'blk-up': { const i = lab.blocks.indexOf(b); if (i > 0) { lab.blocks.splice(i, 1); lab.blocks.splice(i - 1, 0, b); labRun(); } return; }
    case 'blk-down': { const i = lab.blocks.indexOf(b); if (i < lab.blocks.length - 1) { lab.blocks.splice(i, 1); lab.blocks.splice(i + 1, 0, b); labRun(); } return; }
    case 'blk-off': b.off = !b.off; labRun(); return;
    case 'blk-peek': lab.cursor = lab.cursor === b.id ? null : b.id; labRun(); return;
    case 'mdel': { const arr = getPath(b.p, el.dataset.path); if (Array.isArray(arr)) { arr.splice(+el.dataset.i, 1); labRun(); } return; }
  }
  const acts = BLOCKS[b.type].acts;
  if (acts && acts[act]) {
    const it = lab.info.get(b.id) || {};
    acts[act](b.p, +el.dataset.i, it.inCols || []);
    labRun();
  }
}

function onLabChange(e) {
  const t = e.target;
  if (t.matches('[data-src]')) { lab.src = t.value; lab.cursor = null; renderData(); labRun(); return; }
  const blkEl = t.closest('.blk[data-id]');
  if (blkEl) {
    const b = findBlock(blkEl.dataset.id);
    if (!b) return;
    if (t.dataset.madd) {
      if (t.value) { const arr = getPath(b.p, t.dataset.madd); if (Array.isArray(arr)) { arr.push(t.value); labRun(); } }
      return;
    }
    if (t.dataset.insert) {
      if (!t.value) return;
      const inp = $(`[data-path="${t.dataset.insert}"]`, blkEl);
      const cur = String(getPath(b.p, t.dataset.insert) ?? '');
      const pos = inp && inp.selectionStart != null ? inp.selectionStart : cur.length;
      const ins = `[${t.value}]`;
      setPath(b.p, t.dataset.insert, cur.slice(0, pos) + ins + cur.slice(pos));
      labRun();
      const again = $(`.blk[data-id="${b.id}"] [data-path="${t.dataset.insert}"]`);
      if (again) { again.focus(); again.setSelectionRange(pos + ins.length, pos + ins.length); }
      return;
    }
    if (!t.dataset.path) return;
    if (t.type === 'checkbox') setPath(b.p, t.dataset.path, t.checked);
    else if (t.tagName === 'SELECT') { setPath(b.p, t.dataset.path, t.value); if (t.dataset.reset) setPath(b.p, t.dataset.reset, ''); }
    else return;   // 文字與數字輸入由 input 事件處理
    runSoon.cancel();
    labRun();
    return;
  }
  if (t.id === 'page-size') { lab.size = Number(t.value) || 50; lab.page = 0; renderGrid(); saveLab(); return; }
  if (t.id === 'page-no') { gotoPage(t.value); return; }
  if (t.dataset.chart) {
    lab.chart[t.dataset.chart] = t.value;
    if (t.dataset.chart === 'type' && t.value === 'line') lab.chart.order = 'orig';   // 折線圖通常是看時間順序，不要照數值重排
    saveLab();
    if (t.dataset.chart === 'type' || t.dataset.chart === 'agg') { renderChartTab($('#res-body')); const again = $(`[data-chart="${t.dataset.chart}"]`); if (again) again.focus(); }
    else drawChart();
  }
}

function onLabInput(e) {
  const t = e.target;
  if (t.id === 'grid-q') { lab.q = t.value; searchSoon(); return; }
  if (!t.dataset || !t.dataset.path || t.tagName === 'SELECT' || t.type === 'checkbox') return;
  if (e.isComposing) return;   // 中文輸入法組字中，等選好字再執行
  const blkEl = t.closest('.blk[data-id]');
  const b = blkEl ? findBlock(blkEl.dataset.id) : null;
  if (!b) return;
  setPath(b.p, t.dataset.path, t.value);
  runSoon();
}

/** 只需要綁一次的全域事件 */
function initLabGlobal() {
  $('#upload-file').addEventListener('change', e => { handleFiles(e.target.files); e.target.value = ''; });
  window.addEventListener('pointerup', () => { selecting = false; });
  window.addEventListener('pointercancel', () => { selecting = false; });
  document.addEventListener('keydown', e => {
    if (!$('#grid-wrap') || !lab.sel) return;
    const ae = document.activeElement;
    const typing = ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.tagName === 'SELECT' || ae.isContentEditable);
    if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C') && !typing && !String(window.getSelection()).trim()) { e.preventDefault(); copySelection(); }
    else if (e.key === 'Escape' && !typing) { lab.sel = null; paintSel(); }
  });
  document.addEventListener('keydown', e => {
    if (!$('#lab') || !$('#modal').hidden || !(e.ctrlKey || e.metaKey)) return;
    const ae = document.activeElement;
    if (ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA' || ae.isContentEditable)) return;   // 輸入框裡的 Ctrl+Z 留給文字本身
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undoProgram(); }
    else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redoProgram(); }
  });
  // 拖檔案進來：在試算表頁面就載入；其他頁面也要擋下，避免瀏覽器直接把檔案打開而離開網站
  const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
  let depth = 0;
  const mask = on => { const m = $('#lab-dropmask'); if (m) m.hidden = !on; };
  document.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); depth++; mask(true); });
  document.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  document.addEventListener('dragleave', e => { if (!hasFiles(e)) return; depth = Math.max(0, depth - 1); if (!depth) mask(false); });
  document.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    depth = 0; mask(false);
    if ($('#lab')) handleFiles(e.dataTransfer.files);
    else toast('要分析自己的檔案，請先切到雲端試算表再拖進來', 'info');
  });
}

/* ======================================================================
 * 腳本庫（config/scripts.json）、我的腳本、復原／重做
 * ==================================================================== */
const MINE_KEY = 'lab_scripts_v1';
const lib = { cat: '全部', q: '', cur: null, mode: 'replace', vals: {} };
const validScript = s => !!s && typeof s.title === 'string' && s.title.trim() !== '' && Array.isArray(s.blocks) && s.blocks.length > 0 &&
  s.blocks.every(b => b && BLOCKS[b.type] && (b.p == null || (typeof b.p === 'object' && !Array.isArray(b.p))));

function loadMine() {
  try { const a = JSON.parse(store.get(MINE_KEY) || '[]'); return Array.isArray(a) ? a.filter(validScript) : []; }
  catch (e) { return []; }
}
const saveMineList = () => store.set(MINE_KEY, JSON.stringify(lab.mine));

async function ensureScripts(force) {
  if (lab.scripts && !lab.scripts.err && !force) return;
  try {
    const res = await fetch('./config/scripts.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const j = await res.json();
    const raw = Array.isArray(j) ? j : j && Array.isArray(j.scripts) ? j.scripts : [];
    const list = raw.filter(validScript).map((s, i) => ({
      id: 's' + i, title: s.title, category: s.category || '其他', desc: s.desc || '', tip: s.tip || '', needs: Number(s.needs) || 1,
      vars: Array.isArray(s.vars) ? s.vars.filter(v => v && typeof v.key === 'string') : [], blocks: s.blocks
    }));
    if (raw.length > list.length) console.warn(`scripts.json 有 ${raw.length - list.length} 個腳本格式不對或用到不存在的積木，已略過`);
    lab.scripts = { list, err: '' };
  } catch (e) {
    console.warn('讀不到 config/scripts.json：', e);
    lab.scripts = { list: [], err: e.message || String(e) };
  }
}

const allScripts = () => [...lab.scripts.list, ...lab.mine.map(s => ({ ...s, category: '我的腳本', mine: true, vars: [], needs: 1, tip: '' }))];
const findScript = id => allScripts().find(s => s.id === id);

/* ---------- 腳本庫清單 ---------- */
function scriptCard(s) {
  const flow = s.blocks.map(b => `<span class="sc-b cat-${BLOCKS[b.type].cat}">${BLOCKS[b.type].label}</span>`).join('<i aria-hidden="true">›</i>');
  const short = lab.ds.length < s.needs;
  return `<article class="sc">
    <div class="sc-top"><h3>${esc(s.title)}</h3><span class="sc-cat">${esc(s.category)}</span></div>
    ${s.desc ? `<p>${esc(s.desc)}</p>` : ''}
    <div class="sc-flow" aria-label="這個腳本用到的積木">${flow}</div>
    <div class="sc-foot">
      ${short ? `<span class="sc-need">${ICON.info}要先載入 ${s.needs} 份資料</span>` : ''}
      ${s.mine ? `<button type="button" class="mini-btn" data-lib="download" data-id="${esc(s.id)}">${ICON.download}<span>下載</span></button><button type="button" class="mini-btn" data-lib="delete" data-id="${esc(s.id)}">${ICON.trash}<span>刪除</span></button>` : ''}
      <button type="button" class="btn btn-gold" data-lib="use" data-id="${esc(s.id)}"${short ? ' disabled' : ''}>使用這個腳本</button>
    </div>
  </article>`;
}

function libListHTML() {
  const all = allScripts();
  const cats = ['全部', ...new Set(all.map(s => s.category))];
  if (!cats.includes(lib.cat)) lib.cat = '全部';
  const q = lib.q.trim().toLowerCase();
  const shown = all.filter(s => (lib.cat === '全部' || s.category === lib.cat) && (!q || (s.title + ' ' + s.desc + ' ' + s.category).toLowerCase().includes(q)));
  return `
    <div class="lib-cats" role="group" aria-label="分類">${cats.map(c => `<button type="button" class="lib-cat${c === lib.cat ? ' is-on' : ''}" data-cat="${esc(c)}" aria-pressed="${c === lib.cat}">${esc(c)}<b>${c === '全部' ? all.length : all.filter(s => s.category === c).length}</b></button>`).join('')}</div>
    ${lab.scripts.err ? `<p class="res-banner is-err">${ICON.alert}<span>讀不到 <code>config/scripts.json</code>（${esc(lab.scripts.err)}），目前只看得到「我的腳本」。</span><button type="button" class="link-btn" data-lib="reload">重新讀取</button></p>` : ''}
    <div class="lib-list">${shown.length ? shown.map(scriptCard).join('') : `<p class="empty">${all.length ? '沒有符合的腳本。' : '腳本庫是空的。'}</p>`}</div>`;
}

function renderLibrary() {
  lib.cur = null;
  openModal(`
    <header class="modal-head">
      <div><h2>腳本庫</h2><p>挑一個最接近題目的腳本，套用後再照自己的資料修改積木。</p></div>
      <button type="button" class="icon-btn" data-close aria-label="關閉">${ICON.x}</button>
    </header>
    <div class="lib-bar"><label class="search">${ICON.search}<input type="search" id="lib-q" value="${esc(lib.q)}" placeholder="搜尋腳本，例如：前三名、月份、合併" aria-label="搜尋腳本" autocomplete="off" data-autofocus></label></div>
    <div class="modal-body" id="lib-body">${libListHTML()}</div>
    <footer class="modal-foot">
      <span>腳本內容放在 <code>config/scripts.json</code>，可以自行增修。</span>
      <button type="button" class="mini-btn" data-lib="import">${ICON.upload}<span>匯入腳本檔</span></button>
    </footer>`, '腳本庫', 'is-wide');
}

async function openLibrary() {
  openModal(`<div class="modal-loading"><span class="spin"></span>正在讀取腳本庫…</div>`, '腳本庫', 'is-wide');
  await ensureScripts();
  if (!$('#modal').hidden) renderLibrary();
}

/* ---------- 套用腳本：填空格 ---------- */
function isDateCol(t, i) {
  if (/日期|date|時間|time/i.test(t.cols[i])) return true;
  let seen = 0, hit = 0;
  for (let r = 0; r < t.rows.length && seen < 30; r++) {
    const v = t.rows[r][i];
    if (isBlank(v)) continue;
    seen++;
    const s = toStr(v).trim();
    if ((/^\d{7,8}$/.test(s) || /\d\s*[\/\-年]\s*\d/.test(s)) && parseDate(s)) hit++;
  }
  return seen > 0 && hit / seen >= 0.8;
}

function distinctCount(t, i) {
  const seen = new Set();
  for (let r = 0; r < t.rows.length && r < 2000; r++) seen.add(toStr(t.rows[r][i]).trim());
  return seen.size;
}

/** 幫腳本的欄位空格猜一個預設值 */
function guessCol(v, t, kinds, taken) {
  const all = t.cols.map((c, i) => ({ c, i }));
  const fits = o => (v.kind === 'num' ? kinds[o.i] === 'num' : v.kind === 'date' ? isDateCol(t, o.i) : v.kind === 'text' ? kinds[o.i] === 'text' && !isDateCol(t, o.i) : true);
  let pool = all.filter(fits);
  if (!pool.length) pool = all;
  const free = pool.filter(o => !taken.has(o.c));
  if (free.length) pool = free;
  const hints = (Array.isArray(v.guess) ? v.guess : []).map(h => String(h).toLowerCase());
  const hit = pool.find(o => hints.some(h => o.c.toLowerCase().includes(h)));
  if (hit) return hit.c;
  if (v.kind === 'text' && pool.length > 1) {
    const scored = pool.map(o => ({ ...o, n: distinctCount(t, o.i) }));
    scored.sort((a, b) => (v.prefer === 'many' ? b.n - a.n : a.n - b.n));
    return scored[0].c;
  }
  return pool.length ? pool[0].c : '';
}

function scriptBase() {
  if (lib.mode === 'append' && lab.result) return lab.result;
  const src = dsById(lab.src);
  return src ? { cols: src.cols, rows: src.rows } : { cols: [], rows: [] };
}

function renderScriptForm(s, keep) {
  lib.cur = s.id;
  const base = scriptBase();
  const kinds = base.cols.map((_, i) => colKind(base.rows, i));
  if (!keep) lib.vals = {};
  const taken = new Set();
  const fields = s.vars.map(v => {
    const type = v.type || 'col';
    let val = lib.vals[v.key];
    if (type === 'col') {
      if (!base.cols.includes(val)) val = guessCol(v, base, kinds, taken);
      taken.add(val);
      lib.vals[v.key] = val;
      return `<label class="fld"><span>${esc(v.label || v.key)}</span><select data-var="${esc(v.key)}">${base.cols.map(c => `<option value="${esc(c)}"${c === val ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></label>`;
    }
    if (val == null) val = v.default != null ? String(v.default) : '';
    lib.vals[v.key] = val;
    return `<label class="fld"><span>${esc(v.label || v.key)}</span><input type="${type === 'number' ? 'number' : 'text'}" data-var="${esc(v.key)}" value="${esc(val)}" autocomplete="off"></label>`;
  }).join('');
  const flow = s.blocks.map(b => `<span class="sc-b cat-${BLOCKS[b.type].cat}">${BLOCKS[b.type].label}</span>`).join('<i aria-hidden="true">›</i>');
  openModal(`
    <header class="modal-head">
      <div><h2>${esc(s.title)}</h2>${s.desc ? `<p>${esc(s.desc)}</p>` : ''}</div>
      <button type="button" class="icon-btn" data-close aria-label="關閉">${ICON.x}</button>
    </header>
    <div class="modal-body">
      <div class="sc-flow is-big" aria-label="這個腳本用到的積木">${flow}</div>
      ${s.vars.length ? `<div class="form">${fields}</div><p class="form-note">欄位是依資料內容先猜的，請確認後再套用；套用之後還是可以在積木裡修改。</p>` : '<p class="form-note">這個腳本沒有需要填的空格，套用後可以直接在積木裡修改。</p>'}
      ${lab.blocks.length ? `<fieldset class="choice"><legend>程式區已經有積木了</legend>
        <label><input type="radio" name="sc-mode" value="replace"${lib.mode === 'replace' ? ' checked' : ''}><span>清掉原本的積木，改用這個腳本</span></label>
        <label><input type="radio" name="sc-mode" value="append"${lib.mode === 'append' ? ' checked' : ''}><span>接在原本的積木後面</span></label>
      </fieldset>` : ''}
    </div>
    <footer class="modal-foot">
      <button type="button" class="btn btn-quiet" data-lib="back">${ICON.left}<span>回腳本庫</span></button>
      <button type="button" class="btn btn-gold" data-lib="apply" data-autofocus>套用到程式區</button>
    </footer>`, s.title);
}

const subVars = (v, vals) => {
  if (typeof v === 'string') return v.replace(/\{\{\s*(.+?)\s*\}\}/g, (m, k) => (k in vals ? vals[k] : m));
  if (Array.isArray(v)) return v.map(x => subVars(x, vals));
  if (v && typeof v === 'object') return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, subVars(x, vals)]));
  return v;
};

function applyScript(s, vals, mode) {
  if (!dsById(lab.src)) { toast('請先載入一份資料', 'info'); return; }
  if (mode === 'replace') { lab.blocks = []; lab.cursor = null; }
  for (const b of s.blocks) {
    const pre = tableBefore(lab.blocks.length);
    const def = BLOCKS[b.type].make(pre.cols, pre.cols.map((_, i) => colKind(pre.rows, i)), { ...blockCtx(), table: pre });
    lab.blocks.push({ id: newBlockId(), type: b.type, off: false, p: Object.assign(def, subVars(JSON.parse(JSON.stringify(b.p || {})), vals)) });
  }
  closeModal();
  setEditorOpen(true);
  labRun();
  const ed = $('#lab-editor');
  if (ed) ed.scrollIntoView({ block: 'start', behavior: reduceMotion() ? 'auto' : 'smooth' });
  toast(`已套用「${s.title}」。${s.tip || '請依題目調整積木裡的欄位和數值。'}`, 'success', 5200);
  const r = ed ? ed.getBoundingClientRect() : null;
  if (r) fx.ripple(r.left + r.width / 2, Math.max(60, r.top + 80), 'gold', 0.8);
}

/* ---------- 存成我的腳本 ---------- */
const programAsScript = (title, desc) => ({
  title: title || '我的腳本', category: '自訂', desc: desc || '',
  blocks: lab.blocks.filter(b => !b.off).map(b => ({ type: b.type, p: JSON.parse(JSON.stringify(b.p)) }))
});

function openSaveScript() {
  if (!lab.blocks.some(b => !b.off)) { toast('程式區還沒有可以存的積木', 'info'); return; }
  openModal(`
    <header class="modal-head">
      <div><h2>存成腳本</h2><p>存在這個瀏覽器裡，之後可以從腳本庫的「我的腳本」再叫出來；也可以下載成檔案分享給別人。</p></div>
      <button type="button" class="icon-btn" data-close aria-label="關閉">${ICON.x}</button>
    </header>
    <div class="modal-body"><div class="form">
      <label class="fld"><span>腳本名稱</span><input type="text" id="ms-title" maxlength="40" placeholder="例：各縣市發生數前三名" autocomplete="off" data-autofocus></label>
      <label class="fld"><span>說明（可不填）</span><input type="text" id="ms-desc" maxlength="120" placeholder="這個腳本在做什麼、適合哪種題目" autocomplete="off"></label>
    </div></div>
    <footer class="modal-foot">
      <button type="button" class="btn btn-line" data-lib="save-download">${ICON.download}<span>下載成 JSON 檔</span></button>
      <button type="button" class="btn btn-gold" data-lib="save-mine">存到我的腳本</button>
    </footer>`, '存成腳本');
}

async function importScriptFile(file) {
  let j;
  try { j = JSON.parse(await file.text()); }
  catch (e) { toast('這個檔案不是正確的 JSON', 'error'); return; }
  const raw = Array.isArray(j) ? j : j && Array.isArray(j.scripts) ? j.scripts : [j];
  const ok = raw.filter(validScript);
  if (!ok.length) { toast('檔案裡沒有可以用的腳本', 'error'); return; }
  ok.forEach((s, i) => lab.mine.push({ id: 'm' + Date.now().toString(36) + i, title: s.title, desc: s.desc || '', blocks: s.blocks }));
  saveMineList();
  toast(`已匯入 ${ok.length} 個腳本到「我的腳本」`, 'success');
  lib.cat = '我的腳本';
  if (lab.scripts && !$('#modal').hidden) renderLibrary();
}

function onModalClick(e) {
  const cat = e.target.closest('[data-cat]');
  if (cat) { lib.cat = cat.dataset.cat; $('#lib-body').innerHTML = libListHTML(); return; }
  const el = e.target.closest('[data-lib]');
  if (!el) return;
  const act = el.dataset.lib;
  const s = el.dataset.id ? findScript(el.dataset.id) : lib.cur ? findScript(lib.cur) : null;
  if (act === 'use' && s) {
    lib.mode = 'replace';
    if (!s.vars.length && !lab.blocks.length) applyScript(s, {}, 'replace'); else renderScriptForm(s, false);
  } else if (act === 'back') renderLibrary();
  else if (act === 'apply' && s) {
    const missing = s.vars.find(v => (v.type || 'col') === 'col' && !lib.vals[v.key]);
    if (missing) { toast(`請先選「${missing.label || missing.key}」`, 'error'); return; }
    applyScript(s, { ...lib.vals }, lab.blocks.length ? lib.mode : 'replace');
  } else if (act === 'reload') { ensureScripts(true).then(() => { if (!$('#modal').hidden) renderLibrary(); }); }
  else if (act === 'import') $('#script-file').click();
  else if (act === 'delete' && s) {
    if (el.dataset.confirm !== '1') { el.dataset.confirm = '1'; el.classList.add('is-confirm'); el.querySelector('span').textContent = '確定刪除？'; return; }
    lab.mine = lab.mine.filter(x => x.id !== s.id); saveMineList(); $('#lib-body').innerHTML = libListHTML();
  } else if (act === 'download' && s) {
    download(`腳本_${s.title.replace(/[\\/:*?"<>|]/g, '_')}.json`, new Blob([JSON.stringify({ scripts: [{ title: s.title, category: '自訂', desc: s.desc || '', blocks: s.blocks }] }, null, 2)], { type: 'application/json' }));
  } else if (act === 'save-mine' || act === 'save-download') {
    const title = $('#ms-title').value.trim(), desc = $('#ms-desc').value.trim();
    if (!title) { toast('請幫腳本取個名字', 'error'); $('#ms-title').focus(); return; }
    const sc = programAsScript(title, desc);
    if (act === 'save-download') {
      download(`腳本_${title.replace(/[\\/:*?"<>|]/g, '_')}.json`, new Blob([JSON.stringify({ scripts: [sc] }, null, 2)], { type: 'application/json' }));
      toast('已下載。把檔案裡 scripts 的那一段貼進 config/scripts.json，就會出現在所有人的腳本庫', 'success', 6500);
    } else {
      lab.mine.push({ id: 'm' + Date.now().toString(36), title, desc, blocks: sc.blocks });
      saveMineList();
      toast(`已存到「我的腳本」：${title}`, 'success');
    }
    closeModal();
  }
}

function initScripts() {
  lab.mine = loadMine();
  const m = $('#modal');
  m.addEventListener('click', onModalClick);
  m.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'lib-q') { lib.q = t.value; $('#lib-body').innerHTML = libListHTML(); }
    else if (t.dataset && t.dataset.var && t.tagName === 'INPUT') lib.vals[t.dataset.var] = t.value;
  });
  m.addEventListener('change', e => {
    const t = e.target;
    if (t.dataset && t.dataset.var) lib.vals[t.dataset.var] = t.value;
    else if (t.name === 'sc-mode') { lib.mode = t.value; const s = findScript(lib.cur); if (s) { renderScriptForm(s, true); const again = $(`#modal input[name="sc-mode"][value="${lib.mode}"]`); if (again) again.focus(); } }
  });
  m.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'ms-title') { const b = $('#modal [data-lib="save-mine"]'); if (b) b.click(); } });
  $('#script-file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importScriptFile(f); });
}

/* ---------- 復原／重做 ---------- */
const progSnapshot = () => JSON.stringify({ src: lab.src, blocks: lab.blocks });

function pushHistory() {
  if (!dsById(lab.src)) return;   // 還沒有資料時不記
  const s = progSnapshot();
  if (lab.hist[lab.hist.length - 1] === s) return;
  lab.hist.push(s);
  if (lab.hist.length > 80) lab.hist.shift();
  lab.redo = [];
}

function applySnapshot(s) {
  const o = JSON.parse(s);
  if (dsById(o.src)) lab.src = o.src;
  lab.blocks = o.blocks;
  lab.cursor = null;
  lab.noHist = true;
  renderData();
  labRun();
  lab.noHist = false;
}

function undoProgram() {
  if (lab.hist.length < 2) return;
  lab.redo.push(lab.hist.pop());
  applySnapshot(lab.hist[lab.hist.length - 1]);
}

function redoProgram() {
  if (!lab.redo.length) return;
  const s = lab.redo.pop();
  lab.hist.push(s);
  applySnapshot(s);
}

function renderUndoState() {
  const u = $('[data-act="undo"]'), r = $('[data-act="redo"]');
  if (u) u.disabled = lab.hist.length < 2;
  if (r) r.disabled = !lab.redo.length;
}

/* ======================================================================
 * 啟動
 * ==================================================================== */
async function loadCategories() {
  try {
    const res = await fetch('./config/title.json');
    if (!res.ok) throw new Error(`讀不到 config/title.json（HTTP ${res.status}）`);
    const text = (await res.text()).replace(/\{\{TODAY_ROC\}\}/g, todayROC());
    let list = JSON.parse(text);
    if (!Array.isArray(list)) throw new Error('title.json 的最外層應該是陣列');
    list = list.filter(c => c && c.id != null);
    // 固定順序：「前言」第一、「雲端試算表」第二
    const preface = list.find(c => c.isPreface);
    const viewer = list.find(c => c.isDataViewer);
    list = list.filter(c => c !== preface && c !== viewer);
    if (viewer) list.unshift(viewer);
    if (preface) list.unshift(preface);
    CATS = list;
  } catch (e) {
    console.error('載入題庫失敗：', e);
    state.loadError = e.message || String(e);
    // 題庫讀不到時，至少讓試算表可以用
    CATS = [{ id: '__lab', title: '雲端試算表', fullName: '雲端試算表', isDataViewer: true, questions: [] }];
    setTimeout(() => toast('無法載入題庫清單，請確認 ./config/title.json 是否存在', 'error', 7000), 800);
  }
  if (CATS.length) state.catId = CATS[0].id;
}

function bindChrome() {
  $('#menu-btn').addEventListener('click', () => toggleSidebar(true));
  $('#close-side').addEventListener('click', () => toggleSidebar(false));
  $('#scrim').addEventListener('click', () => toggleSidebar(false));
  $('#nav').addEventListener('click', e => { const b = e.target.closest('.nav-item'); if (b) openCategory(b.dataset.id); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sidebar').classList.contains('is-open')) toggleSidebar(false); });

  $('#export-btn').addEventListener('click', exportRecords);
  const importFile = $('#import-file');
  $('#import-btn').addEventListener('click', () => importFile.click());
  importFile.addEventListener('change', async e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (f) await importRecords(f);
  });

  const main = $('#main'), top = $('#to-top');
  main.addEventListener('scroll', () => {
    top.classList.toggle('in', main.scrollTop > 400);
    if (performance.now() - pop.at > 300) closePop();   // 選單剛打開時的捲動（例如瀏覽器把按鈕捲進畫面）不算
  }, { passive: true });
  top.addEventListener('click', () => main.scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }));
}

async function init() {
  bindChrome();
  initPop();
  initModal();
  initCursor();
  initBackdrop();
  setFx(fx.on);
  $('#fx-btn').addEventListener('click', () => { setFx(!fx.on); toast(fx.on ? '特效已開啟' : '特效已關閉（十字游標與背景動畫）', 'info', 2200); });
  initLabGlobal();
  initScripts();
  try {
    await idbOpen();
    state.subs = (await idbAll()).sort((a, b) => subTime(b) - subTime(a));
  } catch (e) { console.error('無法初始化本機資料庫：', e); }
  initCloud();                 // 不等它：雲端連線慢也不會卡住畫面
  await loadCategories();
  const loading = $('#loading');
  loading.classList.add('out');
  $('#app').hidden = false;
  renderSidebar();
  renderStatus();
  renderPage();
  setTimeout(() => loading.remove(), 600);
}

init();

})();
</script>
